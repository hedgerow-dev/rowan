# Go Security Rules
rules:

  - id: GO-INJECT-001
    name: os/exec command injection
    severity: high
    category: command_injection
    cwe: [78]
    languages: [go]
    patterns:
      - 'exec\.Command\s*\('
    pattern-not:
      - '(?m)^\s*//.*'
    message: |
      exec.Command() with user-controlled arguments leads to arbitrary command
      execution. Use .arg() with separate arguments, never shell strings.

  - id: GO-INJECT-002
    name: SQL injection via fmt.Sprintf
    severity: high
    category: injection
    cwe: [89]
    languages: [go]
    patterns:
      - '\.(Query|Exec)\(\s*fmt\.Sprintf\s*\('
      - '\.(Query|Exec)\(\s*[`"](?:SELECT|INSERT|UPDATE|DELETE)\b[^)]*\+'
    pattern-not:
      - '(?m)^\s*//.*'
    message: |
      SQL query built with fmt.Sprintf() is vulnerable to SQL injection.
      Use $1, $2 placeholders with parameterized queries.

  - id: GO-XSS-001
    name: Unescaped template type
    severity: high
    category: xss
    cwe: [79]
    languages: [go]
    patterns:
      - 'template\.(HTML|JS|CSS|URL|HTMLAttr)\s*\('
    pattern-not:
      - '(?m)^\s*//.*'
    message: |
      Unescaped template type marks content as safe. XSS if content is
      user-controlled. Use html/template automatic escaping.

  - id: GO-CRYPTO-001
    name: Weak crypto import
    severity: medium
    category: crypto
    cwe: [328]
    languages: [go]
    patterns:
      - '"crypto/md5"'
      - '"crypto/sha1"'
      - '"crypto/des"'
    pattern-not:
      - '(?m)^\s*//.*'
    message: |
      Deprecated/weak crypto package imported. Use crypto/sha256 or
      crypto/aes (GCM mode) instead.

  - id: GO-CRYPTO-002
    name: math/rand for security
    severity: medium
    category: crypto
    cwe: [330]
    languages: [go]
    patterns:
      - '"math/rand"'
    pattern-not:
      - '"crypto/rand"'
      - '(?m)^\s*//.*'
    message: |
      math/rand is not cryptographically secure. Use crypto/rand for
      tokens, keys, and security-sensitive random values.

  - id: GO-CONFIG-001
    name: TLS verification disabled
    severity: high
    category: config
    cwe: [295]
    languages: [go]
    patterns:
      - 'InsecureSkipVerify\s*:\s*true'
    pattern-not:
      - '(?m)^\s*//.*'
    message: |
      TLS certificate verification disabled. Enables man-in-the-middle
      attacks in production. Remove InsecureSkipVerify.
