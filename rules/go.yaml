# Go Security Rules
rules:

  - id: GO-INJECT-001
    name: os/exec command injection
    severity: high
    category: command_injection
    cwe: [78]
    languages: [go]
    # A shell run with a command string that is not a single literal (#56).
    # exec.Command("git", "status") runs no shell; tnt-go-cmdi-001 covers
    # request input reaching the program itself.
    patterns:
      - 'exec\.Command(?:Context\s*\(\s*[^,]+,|\s*\()\s*"(?:sh|bash|zsh|/bin/sh|/bin/bash|cmd|cmd\.exe|powershell|pwsh)"\s*,\s*"(?:-c|/c|/C|-Command)"\s*,(?!\s*"(?:[^"\\]|\\.)*"\s*[,)])'
    pattern-not:
      - '(?m)^\s*//.*'
    message: |
      A shell runs a command string that is not a constant. If any part of it
      can come from input, the caller can run arbitrary commands. Pass the
      program and its arguments to exec.Command separately, without a shell.

  - id: GO-INJECT-002
    name: SQL injection via fmt.Sprintf
    severity: high
    category: injection
    cwe: [89]
    languages: [go]
    # Any case, QueryRow/Prepare/gorm Raw and Where, *Context and sqlx x
    # variants, and SQL text assembled with Sprintf before the call (#56).
    patterns:
      - '(?i)\.(?:Query|QueryRow|Exec|Prepare|Raw|Where)(?:Context|x)?\s*\(\s*(?:\w+\s*,\s*)?fmt\.Sprintf\s*\('
      - '(?i)\.(?:Query|QueryRow|Exec|Prepare|Raw|Where)(?:Context|x)?\s*\(\s*(?:\w+\s*,\s*)?[`"](?:select|insert|update|delete|with)\b[^`"]*[`"]\s*\+'
      - '(?i)\bfmt\.Sprintf\s*\(\s*[`"]\s*(?:select|insert|update|delete)\b'
    pattern-not:
      - '(?m)^\s*//.*'
    message: |
      SQL text is assembled with string formatting or concatenation. If any
      formatted value can come from input, that is SQL injection. Use $1 / ?
      placeholders and pass the values as query arguments.

  - id: GO-XSS-001
    name: Unescaped template type
    severity: high
    category: xss
    cwe: [79]
    languages: [go]
    # A constant argument is trusted markup; only a non-literal one can carry
    # input past html/template's escaping (#56).
    patterns:
      - 'template\.(?:HTML|JS|CSS|URL|HTMLAttr)\s*\((?!\s*"(?:[^"\\]|\\.)*"\s*\))'
    pattern-not:
      - '(?m)^\s*//.*'
    message: |
      Unescaped template type marks content as safe. XSS if content is
      user-controlled. Use html/template automatic escaping.

  - id: GO-CRYPTO-001
    name: Weak crypto import
    severity: low
    category: crypto
    cwe: [328]
    languages: [go]
    patterns:
      - '"crypto/md5"'
      - '"crypto/sha1"'
      - '"crypto/des"'
      - '"crypto/rc4"'
      - '"golang.org/x/crypto/md4"'
    pattern-not:
      - '(?m)^\s*//.*'
    message: |
      A weak hash or cipher package is imported. sha1 and md5 are fine for
      checksums and git object IDs, so this is an inventory signal: confirm it
      is not used for passwords, signatures or encryption. Use crypto/sha256
      or crypto/aes (GCM) for those.

  - id: GO-CRYPTO-002
    name: math/rand for security
    severity: medium
    category: crypto
    cwe: [330]
    languages: [go]
    # A security-named value drawn from math/rand (v1 or v2), not every
    # import: simulations, jitter and shuffles are fine (#56). crypto/rand is
    # also imported as `rand`; its Int takes rand.Reader.
    patterns:
      - '(?i)\b\w*(?:token|secret|passw|nonce|salt|session|otp|apikey|api_key|csrf)\w*\s*:?=\s*[^\n]*\brand\.(?:Int|Intn|Int31|Int31n|Int63|Int63n|Uint32|Uint64|IntN|Int64|N)\b'
    pattern-not:
      - 'rand\.Reader'
      - '(?m)^\s*//.*'
    message: |
      math/rand is not cryptographically secure. Use crypto/rand for
      tokens, keys, and security-sensitive random values.

  - id: GO-CONFIG-001
    name: TLS verification disabled
    severity: high
    category: config
    cwe: [295]
    languages: [go]
    exclude_paths:
      - "*_test.go"
    patterns:
      - 'InsecureSkipVerify\s*(?::|=)\s*true'
    pattern-not:
      - '(?m)^\s*//.*'
    message: |
      TLS certificate verification disabled. Enables man-in-the-middle
      attacks in production. Remove InsecureSkipVerify.
