rules:
  - id: tnt-go-sqli-001
    mode: taint
    languages: [go]
    severity: ERROR
    message: >-
      User input flows into a SQL query without parameterization, enabling SQL injection.
    metadata:
      cwe:
        - "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      confidence: HIGH
      category: injection
      fix: "Use parameterized queries (database/sql's placeholder args) instead of concatenating input into SQL text."
    pattern-sources:
      # rowan-registry:begin source=web_request_go
      - patterns:
          - pattern-either:
              - pattern: $R.URL.Query()
              - pattern: $R.URL.Path
              - pattern: $R.URL.RawQuery
              - pattern: $R.FormValue(...)
              - pattern: $R.PostFormValue(...)
              - pattern: $R.Header.Get(...)
              - pattern: $R.Body
              - pattern: $C.Param(...)
              - pattern: "($C : *gin.Context).Query(...)"
              - pattern: $C.PostForm(...)
              - pattern: $C.DefaultQuery(...)
              - pattern: $C.GetHeader(...)
              - pattern: $C.QueryParam(...)
              - pattern: $C.Params(...)
              - pattern: chi.URLParam(...)
              - pattern: mux.Vars(...)
      # rowan-registry:end source=web_request_go
      # rowan-registry:begin source=web_request_go_bind
      - patterns:
          - pattern-either:
              - pattern: $C.ShouldBindJSON(&$X)
              - pattern: $C.BindJSON(&$X)
              - pattern: $C.ShouldBind(&$X)
              - pattern: $C.Bind(&$X)
              - pattern: $C.ShouldBindQuery(&$X)
              - pattern: $C.BodyParser(&$X)
              - pattern: json.NewDecoder($R.Body).Decode(&$X)
          - focus-metavariable: $X
        by-side-effect: true
      # rowan-registry:end source=web_request_go_bind
    # A bare `$DB.Query(...)` sink bound `$DB` to `req.URL` (net/http
    # query string) and to gin's context receiver, so `r.URL.Query()` and
    # `c.Query("k")` were source and sink at once (gin-gonic/gin
    # binding/query.go:16, context.go:581). Exclude the URL/query-getter
    # shapes and gin's context by type, not by receiver name.
    pattern-sinks:
      # rowan-registry:begin sink=sql_go
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern: $DB.$M($SQL, ...)
                  - metavariable-regex:
                      metavariable: $M
                      regex: ^(Query|QueryRow|Exec|Prepare|Preparex|Queryx|QueryRowx|MustExec|NamedQuery|NamedExec|Raw|Where|Or|Not|Order|Having|Joins|Group)$
                  - pattern-not-inside: |
                      $DB, $E := $X.Prepare(...)
                      ...
                  - pattern-not-inside: |
                      $DB, $E = $X.Prepare(...)
                      ...
                  - pattern-not-inside: |
                      $DB, $E := $X.Preparex(...)
                      ...
                  - pattern-not-inside: |
                      $DB, $E = $X.Preparex(...)
                      ...
                  - pattern-not: "($DB : *sql.Stmt).$M(...)"
                  - pattern-not: $X.URL.Query(...)
                  - pattern-not: "($X : *gin.Context).Query(...)"
                  - pattern-not-inside: |
                      $SQL := $T{...}
                      ...
                  - pattern-not-inside: |
                      $SQL := $PKG.$T{...}
                      ...
                  - pattern-not-inside: |
                      $SQL := &$PKG.$T{...}
                      ...
                  - focus-metavariable: $SQL
              - patterns:
                  - pattern: $DB.$M($CTX, $SQL, ...)
                  - metavariable-regex:
                      metavariable: $M
                      regex: ^(QueryContext|QueryRowContext|ExecContext|PrepareContext|QueryxContext|QueryRowxContext)$
                  - focus-metavariable: $SQL
              - patterns:
                  - pattern: $DB.$M($CTX, $SQL, ...)
                  - metavariable-regex:
                      metavariable: $M
                      regex: ^(Query|QueryRow|Exec)$
                  - metavariable-regex:
                      metavariable: $CTX
                      regex: (?i).*(ctx|context)
                  - metavariable-regex:
                      metavariable: $DB
                      regex: (?i)(db|conn|connection|pool|tx|sql|pg|pgx|database|querier)$
                  - pattern-not-inside: |
                      $SQL := $T{...}
                      ...
                  - pattern-not-inside: |
                      $SQL := $PKG.$T{...}
                      ...
                  - pattern-not-inside: |
                      $SQL := &$PKG.$T{...}
                      ...
                  - focus-metavariable: $SQL
              - patterns:
                  - pattern-either:
                      - pattern: $DB.Select(&$DEST, $SQL, ...)
                      - pattern: $DB.Get(&$DEST, $SQL, ...)
                  - focus-metavariable: $SQL
      # rowan-registry:end sink=sql_go

    pattern-sanitizers:
      - pattern: strconv.Atoi(...)
      - pattern: strconv.ParseInt(...)

  # Split from tnt-go-sqli-001: env vars, flags and argv are
  # operator-controlled, not attacker-controlled, so a SQL string built from
  # them is a MEDIUM configuration-sourced signal, not HIGH SQL injection.
  # Seen on gogs internal/dbtest/dbtest.go (os.Getenv("MYSQL_USER") into
  # sqlDB.Exec). Sinks and sanitizers are copied from 001 on purpose.
  - id: tnt-go-sqli-002
    mode: taint
    languages: [go]
    severity: WARNING
    message: >-
      Configuration or command-line input (env var, flag, argv) flows into a SQL query
      without parameterization. Operator-controlled, so lower risk than request input,
      but still a query built from untrusted text.
    metadata:
      cwe:
        - "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      confidence: MEDIUM
      category: injection
      source_kind: operator_input
      fix: "Use parameterized queries (database/sql's placeholder args) instead of concatenating input into SQL text."
    pattern-sources:
      # rowan-registry:begin source=operator_input_go
      - patterns:
          - pattern-either:
              - pattern: os.Getenv(...)
              - pattern: os.LookupEnv(...)
              - pattern: flag.String(...)
              - pattern: flag.Arg(...)
              - pattern: os.Args
              - pattern: viper.GetString(...)
              - pattern: viper.Get(...)
      # rowan-registry:end source=operator_input_go
    pattern-sinks:
      # rowan-registry:begin sink=sql_go
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern: $DB.$M($SQL, ...)
                  - metavariable-regex:
                      metavariable: $M
                      regex: ^(Query|QueryRow|Exec|Prepare|Preparex|Queryx|QueryRowx|MustExec|NamedQuery|NamedExec|Raw|Where|Or|Not|Order|Having|Joins|Group)$
                  - pattern-not-inside: |
                      $DB, $E := $X.Prepare(...)
                      ...
                  - pattern-not-inside: |
                      $DB, $E = $X.Prepare(...)
                      ...
                  - pattern-not-inside: |
                      $DB, $E := $X.Preparex(...)
                      ...
                  - pattern-not-inside: |
                      $DB, $E = $X.Preparex(...)
                      ...
                  - pattern-not: "($DB : *sql.Stmt).$M(...)"
                  - pattern-not: $X.URL.Query(...)
                  - pattern-not: "($X : *gin.Context).Query(...)"
                  - pattern-not-inside: |
                      $SQL := $T{...}
                      ...
                  - pattern-not-inside: |
                      $SQL := $PKG.$T{...}
                      ...
                  - pattern-not-inside: |
                      $SQL := &$PKG.$T{...}
                      ...
                  - focus-metavariable: $SQL
              - patterns:
                  - pattern: $DB.$M($CTX, $SQL, ...)
                  - metavariable-regex:
                      metavariable: $M
                      regex: ^(QueryContext|QueryRowContext|ExecContext|PrepareContext|QueryxContext|QueryRowxContext)$
                  - focus-metavariable: $SQL
              - patterns:
                  - pattern: $DB.$M($CTX, $SQL, ...)
                  - metavariable-regex:
                      metavariable: $M
                      regex: ^(Query|QueryRow|Exec)$
                  - metavariable-regex:
                      metavariable: $CTX
                      regex: (?i).*(ctx|context)
                  - metavariable-regex:
                      metavariable: $DB
                      regex: (?i)(db|conn|connection|pool|tx|sql|pg|pgx|database|querier)$
                  - pattern-not-inside: |
                      $SQL := $T{...}
                      ...
                  - pattern-not-inside: |
                      $SQL := $PKG.$T{...}
                      ...
                  - pattern-not-inside: |
                      $SQL := &$PKG.$T{...}
                      ...
                  - focus-metavariable: $SQL
              - patterns:
                  - pattern-either:
                      - pattern: $DB.Select(&$DEST, $SQL, ...)
                      - pattern: $DB.Get(&$DEST, $SQL, ...)
                  - focus-metavariable: $SQL
      # rowan-registry:end sink=sql_go

    pattern-sanitizers:
      - pattern: strconv.Atoi(...)
      - pattern: strconv.ParseInt(...)

  - id: tnt-go-cmdi-001
    mode: taint
    languages: [go]
    severity: ERROR
    message: >-
      User input flows into a command execution call, enabling OS command injection.
    metadata:
      cwe:
        - "CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
      confidence: HIGH
      category: command_injection
      fix: "Pass arguments to exec.Command() as separate slice elements, never via a shell-interpolated string."
    pattern-sources:
      # rowan-registry:begin source=web_request_go
      - patterns:
          - pattern-either:
              - pattern: $R.URL.Query()
              - pattern: $R.URL.Path
              - pattern: $R.URL.RawQuery
              - pattern: $R.FormValue(...)
              - pattern: $R.PostFormValue(...)
              - pattern: $R.Header.Get(...)
              - pattern: $R.Body
              - pattern: $C.Param(...)
              - pattern: "($C : *gin.Context).Query(...)"
              - pattern: $C.PostForm(...)
              - pattern: $C.DefaultQuery(...)
              - pattern: $C.GetHeader(...)
              - pattern: $C.QueryParam(...)
              - pattern: $C.Params(...)
              - pattern: chi.URLParam(...)
              - pattern: mux.Vars(...)
      # rowan-registry:end source=web_request_go
      # rowan-registry:begin source=web_request_go_bind
      - patterns:
          - pattern-either:
              - pattern: $C.ShouldBindJSON(&$X)
              - pattern: $C.BindJSON(&$X)
              - pattern: $C.ShouldBind(&$X)
              - pattern: $C.Bind(&$X)
              - pattern: $C.ShouldBindQuery(&$X)
              - pattern: $C.BodyParser(&$X)
              - pattern: json.NewDecoder($R.Body).Decode(&$X)
          - focus-metavariable: $X
        by-side-effect: true
      # rowan-registry:end source=web_request_go_bind
      # Bare `$C.Query(...)` on purpose here, unlike the SQL rules: the
      # fragment types it to *gin.Context because the bare form collides with
      # the `$DB.Query(...)` SQL sink. These sinks do not collide, and the bare
      # form is what reaches macaron-style contexts (gogs internal/route).
      - pattern: $C.Query(...)
    pattern-sinks:
      # rowan-registry:begin sink=exec_go
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern: exec.Command($BIN, ...)
                      - pattern: exec.CommandContext($CTX, $BIN, ...)
                  - focus-metavariable: $BIN
              - patterns:
                  - pattern-either:
                      - pattern: exec.Command($SH, $FLAG, $CMD, ...)
                      - pattern: exec.CommandContext($CTX, $SH, $FLAG, $CMD, ...)
                  - metavariable-regex:
                      metavariable: $SH
                      regex: ^\"(sh|bash|zsh|ash|dash|/bin/sh|/bin/bash|/usr/bin/env|cmd|cmd\.exe|powershell|pwsh)\"$
                  - metavariable-regex:
                      metavariable: $FLAG
                      regex: ^\"(-c|/c|/C|-Command)\"$
                  - focus-metavariable: $CMD
              - patterns:
                  - pattern-either:
                      - pattern: syscall.Exec($BIN, ...)
                      - pattern: os.StartProcess($BIN, ...)
                  - focus-metavariable: $BIN
      # rowan-registry:end sink=exec_go

  # EXT-19: operator-controlled sources (env, flags, argv, viper) split out
  # of the -001 rule the EXT-08 way (tnt-go-sqli-002). gogs' 134 env-sourced
  # path hits (GOGS_CUSTOM) and kubernetes-mcp-server's startup flags were
  # the FP set in ADR-0005. Same sinks and sanitizers as the -001.
  # Request input as an extra argument to a fixed program (#56). No shell
  # parses it, so it is argument injection (an attacker-chosen flag such as
  # git's --upload-pack), not command injection.
  - id: tnt-go-argi-001
    mode: taint
    languages: [go]
    severity: WARNING
    message: >-
      User input is passed as an argument to a fixed program. No shell runs it,
      but a value starting with '-' can be read as an option and change what
      the program does.
    metadata:
      cwe:
        - "CWE-88: Improper Neutralization of Argument Delimiters in a Command ('Argument Injection')"
      confidence: MEDIUM
      category: command_injection
      source_kind: http_input
      fix: "Put '--' before user-supplied arguments, or reject values that start with '-', so they cannot be read as options."
    pattern-sources:
      # rowan-registry:begin source=web_request_go
      - patterns:
          - pattern-either:
              - pattern: $R.URL.Query()
              - pattern: $R.URL.Path
              - pattern: $R.URL.RawQuery
              - pattern: $R.FormValue(...)
              - pattern: $R.PostFormValue(...)
              - pattern: $R.Header.Get(...)
              - pattern: $R.Body
              - pattern: $C.Param(...)
              - pattern: "($C : *gin.Context).Query(...)"
              - pattern: $C.PostForm(...)
              - pattern: $C.DefaultQuery(...)
              - pattern: $C.GetHeader(...)
              - pattern: $C.QueryParam(...)
              - pattern: $C.Params(...)
              - pattern: chi.URLParam(...)
              - pattern: mux.Vars(...)
      # rowan-registry:end source=web_request_go
      # rowan-registry:begin source=web_request_go_bind
      - patterns:
          - pattern-either:
              - pattern: $C.ShouldBindJSON(&$X)
              - pattern: $C.BindJSON(&$X)
              - pattern: $C.ShouldBind(&$X)
              - pattern: $C.Bind(&$X)
              - pattern: $C.ShouldBindQuery(&$X)
              - pattern: $C.BodyParser(&$X)
              - pattern: json.NewDecoder($R.Body).Decode(&$X)
          - focus-metavariable: $X
        by-side-effect: true
      # rowan-registry:end source=web_request_go_bind
      # Bare `$C.Query(...)` on purpose here, unlike the SQL rules: the
      # fragment types it to *gin.Context because the bare form collides with
      # the `$DB.Query(...)` SQL sink. These sinks do not collide, and the bare
      # form is what reaches macaron-style contexts (gogs internal/route).
      - pattern: $C.Query(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: exec.Command("$BIN", ..., $ARG, ...)
              - pattern: exec.CommandContext($CTX, "$BIN", ..., $ARG, ...)
          # A shell's -c string is command injection (tnt-go-cmdi-001).
          - pattern-not: exec.Command($SH, "-c", ...)
          - pattern-not: exec.Command($SH, "/c", ...)
          - pattern-not: exec.CommandContext($CTX, $SH, "-c", ...)
          - pattern-not: exec.CommandContext($CTX, $SH, "/c", ...)
          - focus-metavariable: $ARG

  - id: tnt-go-cmdi-002
    mode: taint
    languages: [go]
    severity: WARNING
    message: >-
      Configuration or command-line input (env var, flag, argv, viper config) flows into a
      command execution call unchanged. Operator-controlled, so lower risk than request
      input, but the same OS command injection sink built from untrusted text.
    metadata:
      cwe:
        - "CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
      confidence: MEDIUM
      category: command_injection
      source_kind: operator_input
      fix: "Pass arguments to exec.Command() as separate slice elements, never via a shell-interpolated string."
    pattern-sources:
      # rowan-registry:begin source=operator_input_go
      - patterns:
          - pattern-either:
              - pattern: os.Getenv(...)
              - pattern: os.LookupEnv(...)
              - pattern: flag.String(...)
              - pattern: flag.Arg(...)
              - pattern: os.Args
              - pattern: viper.GetString(...)
              - pattern: viper.Get(...)
      # rowan-registry:end source=operator_input_go
    pattern-sinks:
      # rowan-registry:begin sink=exec_go
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern: exec.Command($BIN, ...)
                      - pattern: exec.CommandContext($CTX, $BIN, ...)
                  - focus-metavariable: $BIN
              - patterns:
                  - pattern-either:
                      - pattern: exec.Command($SH, $FLAG, $CMD, ...)
                      - pattern: exec.CommandContext($CTX, $SH, $FLAG, $CMD, ...)
                  - metavariable-regex:
                      metavariable: $SH
                      regex: ^\"(sh|bash|zsh|ash|dash|/bin/sh|/bin/bash|/usr/bin/env|cmd|cmd\.exe|powershell|pwsh)\"$
                  - metavariable-regex:
                      metavariable: $FLAG
                      regex: ^\"(-c|/c|/C|-Command)\"$
                  - focus-metavariable: $CMD
              - patterns:
                  - pattern-either:
                      - pattern: syscall.Exec($BIN, ...)
                      - pattern: os.StartProcess($BIN, ...)
                  - focus-metavariable: $BIN
      # rowan-registry:end sink=exec_go

  - id: tnt-go-path-001
    mode: taint
    languages: [go]
    severity: ERROR
    message: >-
      User input flows into a filesystem path, enabling path traversal attacks.
    metadata:
      cwe:
        - "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
      confidence: HIGH
      category: path_traversal
      fix: "Resolve with filepath.Clean() and verify the result is still under the intended base directory (strings.HasPrefix on the cleaned absolute path) before use, or use filepath.Base() to discard directory components entirely."
    pattern-sources:
      # rowan-registry:begin source=web_request_go
      - patterns:
          - pattern-either:
              - pattern: $R.URL.Query()
              - pattern: $R.URL.Path
              - pattern: $R.URL.RawQuery
              - pattern: $R.FormValue(...)
              - pattern: $R.PostFormValue(...)
              - pattern: $R.Header.Get(...)
              - pattern: $R.Body
              - pattern: $C.Param(...)
              - pattern: "($C : *gin.Context).Query(...)"
              - pattern: $C.PostForm(...)
              - pattern: $C.DefaultQuery(...)
              - pattern: $C.GetHeader(...)
              - pattern: $C.QueryParam(...)
              - pattern: $C.Params(...)
              - pattern: chi.URLParam(...)
              - pattern: mux.Vars(...)
      # rowan-registry:end source=web_request_go
      # rowan-registry:begin source=web_request_go_bind
      - patterns:
          - pattern-either:
              - pattern: $C.ShouldBindJSON(&$X)
              - pattern: $C.BindJSON(&$X)
              - pattern: $C.ShouldBind(&$X)
              - pattern: $C.Bind(&$X)
              - pattern: $C.ShouldBindQuery(&$X)
              - pattern: $C.BodyParser(&$X)
              - pattern: json.NewDecoder($R.Body).Decode(&$X)
          - focus-metavariable: $X
        by-side-effect: true
      # rowan-registry:end source=web_request_go_bind
      # Bare `$C.Query(...)` on purpose here, unlike the SQL rules: the
      # fragment types it to *gin.Context because the bare form collides with
      # the `$DB.Query(...)` SQL sink. These sinks do not collide, and the bare
      # form is what reaches macaron-style contexts (gogs internal/route).
      - pattern: $C.Query(...)
    pattern-sinks:
      # rowan-registry:begin sink=file_path_go
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern: os.Open($P)
                      - pattern: os.OpenFile($P, ...)
                      - pattern: os.ReadFile($P)
                      - pattern: os.ReadDir($P)
                      - pattern: os.Create($P)
                      - pattern: os.WriteFile($P, ...)
                      - pattern: os.Remove($P)
                      - pattern: os.RemoveAll($P)
                      - pattern: os.Mkdir($P, ...)
                      - pattern: os.MkdirAll($P, ...)
                      - pattern: os.Rename($P, $Q)
                      - pattern: os.Rename($Q, $P)
                      - pattern: ioutil.ReadFile($P)
                      - pattern: ioutil.WriteFile($P, ...)
                      - pattern: http.ServeFile($W, $R, $P)
                  - focus-metavariable: $P
              - patterns:
                  - pattern-either:
                      - pattern: $C.File($P)
                      - pattern: $C.FileAttachment($P, ...)
                      - pattern: $C.Attachment($P, ...)
                      - pattern: $C.SendFile($P, ...)
                      - pattern: $C.Download($P, ...)
                  - metavariable-regex:
                      metavariable: $C
                      regex: (?i)^(c|ctx|e|context)$
                  - focus-metavariable: $P
      # rowan-registry:end sink=file_path_go
    pattern-sanitizers:
      - pattern: filepath.Base(...)
      - pattern: securejoin.SecureJoin(...)

  # EXT-19 operator-input sibling; see tnt-go-cmdi-002.
  - id: tnt-go-path-002
    mode: taint
    languages: [go]
    severity: WARNING
    message: >-
      Configuration or command-line input (env var, flag, argv, viper config) flows into a
      filesystem path unchanged. Operator-controlled, so lower risk than request
      input, but the same path traversal sink built from untrusted text.
    metadata:
      cwe:
        - "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
      confidence: MEDIUM
      category: path_traversal
      source_kind: operator_input
      fix: "Resolve with filepath.Clean() and verify the result is still under the intended base directory (strings.HasPrefix on the cleaned absolute path) before use, or use filepath.Base() to discard directory components entirely."
    pattern-sources:
