  - id: tnt-go-log-001
    mode: taint
    languages: [go]
    severity: WARNING
    message: >-
      User input flows into a log statement without sanitization, enabling log injection.
    metadata:
      cwe:
        - "CWE-117: Improper Output Neutralization for Logs"
      confidence: MEDIUM
      category: injection
      fix: "Strip or encode newline/CR characters before writing user input to a log entry, so a single log line can't be forged."
    pattern-sources:
      # rowan-registry:begin source=web_request_go
      - patterns:
          - pattern-either:
              - pattern: $R.URL.Query()
              - pattern: $R.URL.Path
              - pattern: $R.URL.RawQuery
              - pattern: $R.FormValue(...)
              - pattern: $R.PostFormValue(...)
              - pattern: $R.Header.Get(...)
              - pattern: $R.Body
              - pattern: $C.Param(...)
              - pattern: "($C : *gin.Context).Query(...)"
              - pattern: $C.PostForm(...)
              - pattern: $C.DefaultQuery(...)
              - pattern: $C.GetHeader(...)
              - pattern: $C.QueryParam(...)
              - pattern: $C.Params(...)
              - pattern: chi.URLParam(...)
              - pattern: mux.Vars(...)
      # rowan-registry:end source=web_request_go
      # rowan-registry:begin source=web_request_go_bind
      - patterns:
          - pattern-either:
              - pattern: $C.ShouldBindJSON(&$X)
              - pattern: $C.BindJSON(&$X)
              - pattern: $C.ShouldBind(&$X)
              - pattern: $C.Bind(&$X)
              - pattern: $C.ShouldBindQuery(&$X)
              - pattern: $C.BodyParser(&$X)
              - pattern: json.NewDecoder($R.Body).Decode(&$X)
          - focus-metavariable: $X
        by-side-effect: true
      # rowan-registry:end source=web_request_go_bind
      # Bare `$C.Query(...)` on purpose here, unlike the SQL rules: the
      # fragment types it to *gin.Context because the bare form collides with
      # the `$DB.Query(...)` SQL sink. These sinks do not collide, and the bare
      # form is what reaches macaron-style contexts (gogs internal/route).
      - pattern: $C.Query(...)
    pattern-sinks:
      # The standard log package writes the value as is. slog and logrus
      # quote or escape newlines in values, and %q escapes them too.
      - patterns:
          - pattern: log.$F(...)
          - metavariable-regex:
              metavariable: $F
              regex: ^(Print|Printf|Println|Fatal|Fatalf|Fatalln|Panic|Panicf|Panicln)$
          - pattern-not: log.$F("=~/%q/", ...)
    pattern-sanitizers:
      - pattern: url.QueryEscape(...)
      # NOT strings.ReplaceAll(...): its neutralizing effect depends
      # entirely on caller-supplied old/new args, which this pattern doesn't
      # pin down -- strings.ReplaceAll($S, "unrelated", "x") clears taint
      # here even though it does nothing to remove \n/\r. See
      # docs/taint-sanitizer-audit.md.

  - id: tnt-go-header-001
    mode: taint
    languages: [go]
    severity: WARNING
    message: >-
