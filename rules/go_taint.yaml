      # here even though it does nothing to remove \n/\r. See
      # docs/taint-sanitizer-audit.md.

  - id: tnt-go-redirect-001
    mode: taint
    languages: [go]
    severity: WARNING
    message: >-
      User input reaches a redirect target: open redirect. An attacker can send
      victims to an external phishing page from a trusted link.
    metadata:
      cwe:
        - "CWE-601: URL Redirection to Untrusted Site ('Open Redirect')"
      confidence: HIGH
      category: general
      source_kind: http_input
      fix: "Redirect only to internal paths or an allowlist of hosts; never to a raw user-supplied URL."
    pattern-sources:
      # rowan-registry:begin source=web_request_go
      - patterns:
          - pattern-either:
              - pattern: $R.URL.Query()
              - pattern: $R.URL.Path
              - pattern: $R.URL.RawQuery
              - pattern: $R.FormValue(...)
              - pattern: $R.PostFormValue(...)
              - pattern: $R.Header.Get(...)
              - pattern: $R.Body
