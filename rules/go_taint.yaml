      # fragment types it to *gin.Context because the bare form collides with
      # the `$DB.Query(...)` SQL sink. These sinks do not collide, and the bare
      # form is what reaches macaron-style contexts (gogs internal/route).
      - pattern: $C.Query(...)
    pattern-sinks:
      # Location is the redirect rule's sink.
      - patterns:
          - pattern-either:
              - pattern: $W.Header().Set($NAME, $V)
              - pattern: $W.Header().Add($NAME, $V)
          - metavariable-regex:
              metavariable: $NAME
              regex: (?i)^"(set-cookie|content-disposition)"$
          - focus-metavariable: $V
    pattern-sanitizers:
      - pattern: url.QueryEscape(...)
      # NOT strings.ReplaceAll(...): its neutralizing effect depends
