  - id: tnt-go-ssrf-001
    mode: taint
    languages: [go]
    severity: ERROR
    message: >-
      User input flows into an outbound HTTP request URL, enabling server-side request forgery.
    metadata:
      cwe:
        - "CWE-918: Server-Side Request Forgery (SSRF)"
      confidence: HIGH
      category: ssrf
      fix: "Validate the destination host against an explicit allowlist of permitted domains/IPs before making the request."
    pattern-sources:
      # rowan-registry:begin source=web_request_go
      - patterns:
          - pattern-either:
              - pattern: $R.URL.Query()
              - pattern: $R.URL.Path
              - pattern: $R.URL.RawQuery
              - pattern: $R.FormValue(...)
              - pattern: $R.PostFormValue(...)
              - pattern: $R.Header.Get(...)
              - pattern: $R.Body
              - pattern: $C.Param(...)
              - pattern: "($C : *gin.Context).Query(...)"
              - pattern: $C.PostForm(...)
              - pattern: $C.DefaultQuery(...)
              - pattern: $C.GetHeader(...)
              - pattern: $C.QueryParam(...)
              - pattern: $C.Params(...)
              - pattern: chi.URLParam(...)
              - pattern: mux.Vars(...)
      # rowan-registry:end source=web_request_go
      # rowan-registry:begin source=web_request_go_bind
      - patterns:
          - pattern-either:
              - pattern: $C.ShouldBindJSON(&$X)
              - pattern: $C.BindJSON(&$X)
              - pattern: $C.ShouldBind(&$X)
              - pattern: $C.Bind(&$X)
