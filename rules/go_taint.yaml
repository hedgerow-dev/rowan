      confidence: HIGH
      category: ssti
      source_kind: http_input
      fix: "Parse only templates shipped with the code; pass user input as data to Execute, never as template text."
    pattern-sources:
      # rowan-registry:begin source=web_request_go
      - patterns:
          - pattern-either:
              - pattern: $R.URL.Query()
              - pattern: $R.URL.Path
              - pattern: $R.URL.RawQuery
              - pattern: $R.FormValue(...)
              - pattern: $R.PostFormValue(...)
              - pattern: $R.Header.Get(...)
              - pattern: $R.Body
