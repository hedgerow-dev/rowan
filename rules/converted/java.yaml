rules:
- id: JA-INJECT-001
  languages:
  - java
  severity: ERROR
  message: 'Runtime.exec() executes OS commands. User-controlled arguments enable

    shell injection. Use ProcessBuilder with separate argument array.'
  patterns:
  - pattern-regex: Runtime\.getRuntime\(\)\.exec\s*\(
  - pattern-not-regex: (?m)^\s*//.*
  metadata:
    category: command_injection
    cwe:
    - 78
    original_engine: neuroscan
    rule_name: Runtime.exec() command injection
    residual:
    - sanitizer
- id: JA-INJECT-002
  languages:
  - java
  severity: ERROR
  message: 'ProcessBuilder with string concatenation allows command injection.

    Prefer array form: new ProcessBuilder(["cmd", "arg1", "arg2"]).'
  patterns:
  - pattern-regex: new\s+ProcessBuilder\s*\(
  - pattern-not-regex: \.command\s*\(\s*\[
  - pattern-not-regex: (?m)^\s*//.*
  metadata:
    category: command_injection
    cwe:
    - 78
    original_engine: neuroscan
    rule_name: ProcessBuilder command injection
    residual:
    - sanitizer
- id: JA-DESER-001
  languages:
  - java
  severity: ERROR
  message: 'ObjectInputStream.readObject() deserializes arbitrary classes.

    RCE possible via gadget chains. Use a whitelist-based ObjectInputFilter.'
  patterns:
  - pattern-regex: new\s+ObjectInputStream\s*\(
  - pattern-not-regex: \.readObject\s*\(\s*\)\s*\{
  - pattern-not-regex: (?m)^\s*//.*
  metadata:
    category: deserialization
    cwe:
    - 502
    original_engine: neuroscan
    original_severity: critical
    rule_name: Unsafe ObjectInputStream deserialization
    fix: Avoid Java native deserialization (ObjectInputStream) on untrusted data; use a JSON library with a known target type,
      or an allowlisting ObjectInputFilter.
    residual:
    - sanitizer
- id: JA-CRYPTO-002
  languages:
  - java
  severity: WARNING
  message: 'java.util.Random is predictable. Use java.security.SecureRandom

    for tokens, nonces, and cryptographic keys.'
  patterns:
  - pattern-regex: new\s+Random\s*\(
  - pattern-not-regex: new\s+SecureRandom\s*\(
  - pattern-not-regex: (?m)^\s*//.*
  metadata:
    category: crypto
    cwe:
    - 330
    original_engine: neuroscan
    rule_name: java.util.Random for security
- id: JA-XXE-001
  languages:
  - java
  severity: ERROR
  message: 'XML parser without XXE protections. Set FEATURE_SECURE_PROCESSING,

    disallow DOCTYPE, and set external-general-entities/parameter-entities to false.'
  patterns:
  - pattern-either:
    - pattern-regex: DocumentBuilderFactory\.newInstance\(\)
    - pattern-regex: SAXParserFactory\.newInstance\(\)
  - pattern-not-regex: setFeature.*EXTERNAL_GENERAL_ENTITIES.*false
  - pattern-not-regex: setFeature.*EXTERNAL_PARAMETER_ENTITIES.*false
  - pattern-not-regex: (?m)^\s*//.*
  metadata:
    category: injection
    cwe:
    - 611
    original_engine: neuroscan
    rule_name: XML parser without XXE protection
    residual:
    - sanitizer
- id: JA-AUTH-001
  languages:
  - java
  severity: WARNING
  message: 'Cookie created without setSecure(true) and setHttpOnly(true).

    Session hijacking risk via MITM or XSS.'
  patterns:
  - pattern-regex: new\s+Cookie\s*\(
  - pattern-not-regex: \.setSecure\s*\(true\)
  - pattern-not-regex: \.setHttpOnly\s*\(true\)
  - pattern-not-regex: (?m)^\s*//.*
  metadata:
    category: auth
    cwe:
    - 614
    original_engine: neuroscan
    rule_name: Cookie without Secure/HttpOnly
- id: JA-INJECT-004
  languages:
  - java
  severity: WARNING
  message: 'User input in XPath expression allows data exfiltration.

    Use parameterized XPath or validate/escape input.'
  patterns:
  - pattern-regex: XPathExpression.*\.compile\s*\(.*\+
  - pattern-not-regex: (?m)^\s*//.*
  metadata:
    category: injection
    cwe:
    - 643
    original_engine: neuroscan
    rule_name: XPath injection
    residual:
    - sanitizer
- id: JA-PATH-001
  languages:
  - java
  severity: ERROR
  message: 'A filesystem path is built by concatenating a value onto a fixed base.

    If that value is externally controlled, traversal sequences can escape

    the intended directory. Resolve the path and verify it stays under the

    allowed base directory.'
  patterns:
  - pattern-either:
    - pattern-regex: new\s+File\s*\(\s*["'][^"']*["']\s*\+
    - pattern-regex: Paths\.get\s*\(\s*["'][^"']*["']\s*\+
  - pattern-not-regex: (?m)^\s*//.*
  metadata:
    category: path_traversal
    cwe:
    - 22
    original_engine: neuroscan
    rule_name: Filesystem path built by concatenation
    residual:
    - sanitizer
- id: JA-CONFIG-001
  languages:
  - java
  severity: WARNING
  message: 'Custom TrustManager detected. Ensure proper certificate validation

    is implemented: empty checkServerTrusted() disables all TLS verification.'
  patterns:
  - pattern-regex: TrustManager.*X509TrustManager
  - pattern-not-regex: checkClientTrusted
  - pattern-not-regex: checkServerTrusted
  - pattern-not-regex: (?m)^\s*//.*
  metadata:
    category: config
    cwe:
    - 295
    original_engine: neuroscan
    rule_name: Insecure TLS configuration
