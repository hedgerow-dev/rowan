rules:
- id: GO-INJECT-001
  languages:
  - go
  severity: ERROR
  message: 'A shell runs a command string that is not a constant. If any part of it

    can come from input, the caller can run arbitrary commands. Pass the

    program and its arguments to exec.Command separately, without a shell.'
  patterns:
  - pattern-regex: exec\.Command(?:Context\s*\(\s*[^,]+,|\s*\()\s*"(?:sh|bash|zsh|/bin/sh|/bin/bash|cmd|cmd\.exe|powershell|pwsh)"\s*,\s*"(?:-c|/c|/C|-Command)"\s*,(?!\s*"(?:[^"\\]|\\.)*"\s*[,)])
  - pattern-not-regex: (?m)^\s*//.*
  metadata:
    category: command_injection
    cwe:
    - 78
    original_engine: neuroscan
    rule_name: os/exec command injection
    residual:
    - sanitizer
- id: GO-INJECT-002
  languages:
  - go
  severity: ERROR
  message: 'SQL text is assembled with string formatting or concatenation. If any

    formatted value can come from input, that is SQL injection. Use $1 / ?

    placeholders and pass the values as query arguments.'
  patterns:
  - pattern-either:
    - pattern-regex: (?i)\.(?:Query|QueryRow|Exec|Prepare|Raw|Where)(?:Context|x)?\s*\(\s*(?:\w+\s*,\s*)?fmt\.Sprintf\s*\(
    - pattern-regex: (?i)\.(?:Query|QueryRow|Exec|Prepare|Raw|Where)(?:Context|x)?\s*\(\s*(?:\w+\s*,\s*)?[`"](?:select|insert|update|delete|with)\b[^`"]*[`"]\s*\+
    - pattern-regex: (?i)\bfmt\.Sprintf\s*\(\s*[`"]\s*(?:select|insert|update|delete)\b
  - pattern-not-regex: (?m)^\s*//.*
  metadata:
    category: injection
    cwe:
    - 89
    original_engine: neuroscan
    rule_name: SQL injection via fmt.Sprintf
    residual:
    - sanitizer
- id: GO-XSS-001
  languages:
  - go
  severity: ERROR
  message: 'Unescaped template type marks content as safe. XSS if content is

    user-controlled. Use html/template automatic escaping.'
  patterns:
  - pattern-regex: template\.(?:HTML|JS|CSS|URL|HTMLAttr)\s*\((?!\s*"(?:[^"\\]|\\.)*"\s*\))
  - pattern-not-regex: (?m)^\s*//.*
  metadata:
    category: xss
    cwe:
    - 79
    original_engine: neuroscan
    rule_name: Unescaped template type
    residual:
    - sanitizer
- id: GO-CRYPTO-001
  languages:
  - go
  severity: INFO
  message: 'A weak hash or cipher package is imported. sha1 and md5 are fine for

    checksums and git object IDs, so this is an inventory signal: confirm it

    is not used for passwords, signatures or encryption. Use crypto/sha256

    or crypto/aes (GCM) for those.'
  patterns:
  - pattern-either:
    - pattern-regex: '"crypto/md5"'
    - pattern-regex: '"crypto/sha1"'
    - pattern-regex: '"crypto/des"'
    - pattern-regex: '"crypto/rc4"'
    - pattern-regex: '"golang.org/x/crypto/md4"'
  - pattern-not-regex: (?m)^\s*//.*
  metadata:
    category: crypto
    cwe:
    - 328
    original_engine: neuroscan
    original_severity: low
    rule_name: Weak crypto import
- id: GO-CRYPTO-002
  languages:
  - go
  severity: WARNING
  message: 'math/rand is not cryptographically secure. Use crypto/rand for

    tokens, keys, and security-sensitive random values.'
  patterns:
  - pattern-regex: (?i)\b\w*(?:token|secret|passw|nonce|salt|session|otp|apikey|api_key|csrf)\w*\s*:?=\s*[^\n]*\brand\.(?:Int|Intn|Int31|Int31n|Int63|Int63n|Uint32|Uint64|IntN|Int64|N)\b
  - pattern-not-regex: rand\.Reader
  - pattern-not-regex: (?m)^\s*//.*
  metadata:
    category: crypto
    cwe:
    - 330
    original_engine: neuroscan
    rule_name: math/rand for security
- id: GO-CONFIG-001
  languages:
  - go
  severity: ERROR
  message: 'TLS certificate verification disabled. Enables man-in-the-middle

    attacks in production. Remove InsecureSkipVerify.'
  patterns:
  - pattern-regex: InsecureSkipVerify\s*(?::|=)\s*true
  - pattern-not-regex: (?m)^\s*//.*
  metadata:
    category: config
    cwe:
    - 295
    original_engine: neuroscan
    rule_name: TLS verification disabled
  paths:
    exclude:
    - '*_test.go'
