- id: ns-aiml-108
  languages:
  - generic
  severity: WARNING
  message: 'Zero-width characters (ZWSP U+200B, Word Joiner U+2060, BOM/ZWNBSP

    U+FEFF) or bidirectional text-direction overrides (U+202D LRO, U+202E

    RLO -- the "Trojan Source" class, CVE-2021-42574) appear in this file.

    These carry no visible glyph, or visually reorder the surrounding

    text, while an LLM (or, for the bidi case, a human skimming the raw

    byte order) reads something different from what renders. Legitimate

    use is rare in these specific codepoints (unlike ZWJ/ZWNJ, deliberately

    excluded here for their legitimate use in emoji sequences and Indic-

    script conjunct rendering); in a prompt, tool description, or

    instruction file this is a prompt-injection smuggling vector.'
  patterns:
