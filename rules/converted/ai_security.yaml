    rule_name: Embedding vector exposure on an unauthenticated route (embedding inversion)
    residual:
    - sanitizer
- id: ns-aiml-125
  languages:
  - python
  severity: WARNING
  message: 'MCP tool description is not a fixed string literal -- it is a bare

    variable/attribute reference, a function/method call result, or an

    f-string that interpolates a non-literal expression. The tool

    description is injected verbatim into the client model''s own context

    window on every session; if the description can change after the

    user approved the tool (fetched from a registry/config at import or

    call time, computed from mutable state) the change is invisible to

    the user and becomes an instruction-injection channel the user never

    re-reviewed (Invariant Labs 2025 tool-poisoning / "rug pull"

    disclosure). Presence signal only: a reference to a module-level

    string constant would also match this heuristic; if the referenced

    value is fixed at import time and never reassigned or fetched

    remotely, this is a false positive -- inline it as a literal to

    silence the finding, or confirm the value truly is static. Distinct

    from NS-AIML-009 (which flags any exposed MCP tool regardless of its

    description) and ns-aiml-066 (tool-call-smuggling on mcp.run/serve);

    this rule is specifically about the description field as an

    injection channel.


    Scoped to a same-line tool-constructor/decorator call (Tool(,

    FunctionTool(, StructuredTool(, BaseTool(, @mcp.tool(, @server.tool(,

    @app.tool() -- a bare `description=` kwarg is far too common a name

    (Pydantic model fields, argparse, unrelated dataclasses) to use as a

    standalone signal, and this regex engine can''t verify multi-line call

    membership. This trades recall on multi-line constructor calls

    (`description=` on its own line inside a call opened elsewhere) for

    eliminating the flood of unrelated `description=` kwargs this rule

    matched before the same-line anchor was added.'
  patterns:
  - pattern-either:
    - pattern-regex: (?:\bTool|\bFunctionTool|\bStructuredTool|\bBaseTool|@mcp\.tool|@server\.tool|@app\.tool)\s*\([^()]*\bdescription\s*=\s*(?!["']|None\b|True\b|False\b)[A-Za-z_]\w*(?:\.\w+)*\s*[,)]
    - pattern-regex: (?:\bTool|\bFunctionTool|\bStructuredTool|\bBaseTool|@mcp\.tool|@server\.tool|@app\.tool)\s*\([^()]*\bdescription\s*=\s*(?!["']|None\b|True\b|False\b)[A-Za-z_]\w*(?:\.\w+)*\s*\(
    - pattern-regex: (?:\bTool|\bFunctionTool|\bStructuredTool|\bBaseTool|@mcp\.tool|@server\.tool|@app\.tool)\s*\([^()]*\bdescription\s*=\s*f["'][^"']*\{
  - pattern-not-regex: (?m)^\s*#
  - pattern-not-regex: (?:def test_|conftest|unittest)
  - pattern-not-regex: \bdescription\s*=\s*(?:None|True|False)\b
  metadata:
    category: prompt_injection
    cwe:
    - 367
    - 829
    original_engine: neuroscan
    rule_name: MCP tool description built from non-literal content (tool poisoning / rug pull)
    source_rule: TNT-ML-024
    residual:
    - sanitizer
- id: ns-aiml-126
  languages:
  - python
  severity: ERROR
  message: 'MCP server run()/serve() call binds host to 0.0.0.0, exposing the MCP

    endpoint on every network interface rather than localhost only.

    Combined with the MCP spec treating auth as optional, this is the

    shape behind CVE-2025-49596 (mcp-inspector RCE): a server reachable

    from the network with no authentication layer visible in the same

    call. Presence signal; confirm this config is production-facing

    before treating as a confirmed vulnerability (sibling check to

    ns-aiml-067''s identical Ray-dashboard convention). This is a

    transport/bind-address finding distinct from ns-aiml-066, which flags

    the same mcp.run(...) call for an unrelated reason (tool-call

    smuggling risk inherent to running the server at all); seeing both on

    one line is expected, not duplicate reporting.'
  patterns:
