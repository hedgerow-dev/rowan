- id: ns-aiml-112
  languages:
  - python
  severity: INFO
  message: 'archival_memory_insert()/core_memory_append()/core_memory_replace()

    is defined or called. In Letta/MemGPT these are registered

    agent-callable tools: the model itself decides both when to write and

    what content to persist, so any untrusted content that reached the

    model''s context (user input, a document, another tool''s result) can

    end up as standing agent memory with no source expression a same-file

    taint trace can follow -- the model''s tool-call decision is the

    boundary crossing, not a value assignment. This is a structural

    awareness signal about how Letta''s memory model works, not a claim

    that Letta itself is vulnerable: Letta legitimately implements this

    feature. Treat whatever the model chooses to write here as untrusted

    input the next time it is recalled into a prompt (see TNT-ML-016).'
  patterns:
  - pattern-either:
    - pattern-regex: \bdef\s+archival_memory_insert\s*\(
    - pattern-regex: \barchival_memory_insert\s*\(
    - pattern-regex: \bdef\s+core_memory_append\s*\(
    - pattern-regex: \bcore_memory_append\s*\(
    - pattern-regex: \bdef\s+core_memory_replace\s*\(
    - pattern-regex: \bcore_memory_replace\s*\(
  - pattern-not-regex: (?m)^\s*#
  - pattern-not-regex: (?:def test_|conftest|unittest)
  metadata:
    category: ai_ml
    cwe:
    - 284
    original_engine: neuroscan
    rule_name: Letta-style agent-callable memory-write tool
    source_rule: TNT-ML-018
- id: ns-aiml-120
  languages:
  - python
  severity: WARNING
  message: 'A `while True:`/`while 1:` loop with no iteration-cap term (

    max_iterations/max_turns/max_steps/max_loops/recursion_limit/

    iteration_limit/MAX_ITER/deadline/time.time()/time.monotonic()) within

    10 lines. Agent "reflection" loops that call a completion API and

    rely on the MODEL''s own output to decide when to stop (e.g. `if "DONE"

    in reply: break`) are still unbounded from a cost/availability

    standpoint -- termination must be CODE-controlled (a counter compared

    against a fixed limit, or a wall-clock deadline), not model-decided,

    or a misbehaving/adversarially-steered model can loop indefinitely

    and exhaust the token/rate budget (Sourcegraph Cody and multiple

    OpenAI-bill-runaway postmortems are this exact loop-amplification

    shape). Engine limitation: this regex-based signal cannot verify a

    completion API call is actually inside the loop body, or that a

    `break` statement it does find is code-controlled rather than

    model-controlled -- it only checks for the ABSENCE of a recognized

    cap term nearby. Triage against the loop body; a `while True:` with no

    completion call at all is a false positive for this specific concern.'
  patterns:
  - pattern-regex: '\bwhile\s+(?:True|1)\s*:'
  - pattern-not-regex: (?m)^\s*#
  - pattern-not-regex: (?:def test_|conftest|unittest)
  metadata:
    category: ai_ml
    cwe:
    - 400
    - 770
    original_engine: neuroscan
    rule_name: Unbounded while-True loop with no visible iteration cap
    source_rule: TNT-ML-022
    fix: 'Bound every agent/reflection loop with a code-controlled exit: a counter compared against a fixed max_iterations/max_turns,
      or a wall-clock deadline check -- never rely solely on the model''s own output (e.g. a ''DONE'' sentinel) to terminate
      the loop.'
    residual:
    - sanitizer
- id: ns-aiml-121
  languages:
  - python
  severity: INFO
  message: 'A completion API call (.chat.completions.create/.completions.create/

    .messages.create/openai.ChatCompletion.create/openai.Completion.create/

    litellm.completion/litellm.acompletion/.text_generation) with no

    max_tokens, max_completion_tokens, or max_new_tokens argument within 10

    lines. Provider defaults, where a cap is optional, can be the model''s

    own maximum context/output length -- combined with no rate limiting,

    each request can cost as much as the model allows. This is a

    heuristic INFO-level surface signal, not a confirmed vulnerability:

    the regex engine cannot verify this call site is a request/route

    handler specifically (that structural recognition -- GitHub issue

    #122''s cross_file.py AST pass -- is not reachable from a regex-mode

    rule), so it fires on every completion call missing the kwarg,

    including intentionally-unbounded offline/batch scripts. Triage

    accordingly; low confidence by design (see the low-confidence INFO

    convention other ns-aiml-* rules use).'
  patterns:
  - pattern-either:
    - pattern-regex: \.chat\.completions\.create\(
    - pattern-regex: \.completions\.create\(
    - pattern-regex: \.messages\.create\(
    - pattern-regex: openai\.ChatCompletion\.create\(
    - pattern-regex: openai\.Completion\.create\(
    - pattern-regex: litellm\.completion\(
    - pattern-regex: litellm\.acompletion\(
    - pattern-regex: \.text_generation\(
  - pattern-not-regex: (?m)^\s*#
  - pattern-not-regex: (?:def test_|conftest|unittest)
  metadata:
    category: ai_ml
    cwe:
    - 400
    - 770
    original_engine: neuroscan
    rule_name: Completion API call with no max_tokens/max_completion_tokens cap
    source_rule: TNT-ML-022
    fix: Always pass an explicit max_tokens (or max_completion_tokens / max_new_tokens for the relevant SDK) upper bound to
      every completion call, and pair it with request-level rate limiting on the endpoint.
    residual:
    - sanitizer
- id: ns-aiml-122
  languages:
  - python
  severity: INFO
  message: 'A retry decorator (@retry/@tenacity.retry) or a same-line

    `except ...: continue` retry idiom with no visible attempt-cap term

    (stop=, stop_after_attempt(...), stop_after_delay(...), max_retries=,

    an attempts/retries counter comparison) within 10 lines. An uncapped

    retry wrapper around a completion call turns a transient failure (or

    an attacker-inducible one, e.g. a deliberately malformed request that

    always errors) into unbounded repeated billed API calls. Engine

    limitation: this cannot verify the wrapped function actually calls a

    completion API (only that a retry construct with no visible cap is

    present) or verify the multi-line `except:\n    continue` shape (only

    the same-line `except ...: continue` compact form is matched); INFO

    severity reflects this lower confidence.'
  patterns:
  - pattern-either:
    - pattern-regex: '@(?:tenacity\.)?retry\b'
    - pattern-regex: except\b[^:\n]*:\s*continue\b
  - pattern-not-regex: (?m)^\s*#
  - pattern-not-regex: (?:def test_|conftest|unittest)
  metadata:
    category: ai_ml
    cwe:
    - 400
    - 770
    original_engine: neuroscan
    rule_name: Retry wrapper around a completion call with no attempt cap
    source_rule: TNT-ML-022
    fix: Cap every retry wrapper around a completion call with an explicit attempt limit (tenacity's stop=stop_after_attempt(N)
      or stop_after_delay(N), or a counter compared against a fixed max in a hand-rolled retry loop).
    residual:
    - sanitizer
- id: ns-aiml-123
  languages:
  - python
  severity: WARNING
  message: 'A completion call requests logprobs=True or a nonzero top_logprobs

    with no nearby indication the value stays server-side. Per-token

    log-probabilities materially cheapen model-extraction and

    membership-inference attacks: Carlini et al. 2024 ("Stealing Part of

    a Production Language Model") used a public logprob API to recover

    the hidden-dimension size and an embedding projection matrix of

    production models (including OpenAI''s) at low cost, and logprobs are

    the standard oracle for membership-inference attacks against LLMs.

    See OWASP LLM02:2025 (Sensitive Information Disclosure). Presence

    signal only -- does not confirm the response actually reaches a

    client-facing serialization call; see TNT-ML-023 for the

    taint-confirmed variant of this same finding.'
  patterns:
  - pattern-either:
    - pattern-regex: logprobs\s*=\s*True
    - pattern-regex: top_logprobs\s*=\s*\d+
  - pattern-not-regex: (?m)^\s*#
  - pattern-not-regex: (?:def test_|conftest|unittest)
  metadata:
    category: ai_ml
    cwe:
    - 200
    original_engine: neuroscan
    rule_name: Logprob/logit exposure to client (model-extraction surface)
    residual:
    - sanitizer
- id: ns-aiml-124
  languages:
  - python
  severity: INFO
  message: 'embeddings.create() (or an equivalent embedding API call) is invoked

    with no visible authentication decorator/dependency nearby. Text

    embedding vectors are not opaque: Morris et al. showed embedding

    inversion recovers a close approximation of the original input text

    from the vector alone (see OWASP LLM02:2025). Returning raw

    embeddings for request-derived text on an unauthenticated route lets

    anyone reconstruct whatever text was embedded. Presence signal only

    -- confirm the route is genuinely public and the vector is actually

    returned to the caller, not consumed only for an internal similarity

    search.'
  patterns:
  - pattern-either:
    - pattern-regex: \.embeddings\.create\s*\(
    - pattern-regex: openai\.Embedding\.create\s*\(
