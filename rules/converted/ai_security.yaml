- id: ns-aiml-159
  languages:
  - javascript
  - python
  - typescript
  severity: WARNING
  message: 'A JWT/bearer token is decoded or verified (PyJWT/python-jose''s

    `jwt.decode(...)`, jsonwebtoken''s `jwt.verify(...)`, or jose''s

    `jwtVerify(...)`) with no `audience` check anywhere nearby. RFC 8707

    (Resource Indicators for OAuth 2.0), which the MCP authorization spec

    requires, exists specifically because a token''s SIGNATURE validating

    does not prove it was issued FOR this server -- an authorization

    server that also issues tokens for other resources will happily sign

    a token whose `aud` claim names a different service entirely. A

    server that verifies the signature but not the audience will accept

    any validly-signed token from that authorization server, regardless

    of which resource it was actually issued for -- the confused-deputy

    mechanism behind the class `TNT-ML-025` only catches when the token

    is visibly forwarded in-function; this catches it even when the token

    never leaves the function that decoded it, because the flaw is in

    the decode itself.

    Engine limitation: presence + absence-in-window, like every other

    NeuroScan rule -- an `audience=`/`audience:` check that validates the

    WRONG value (a client ID instead of the resource identifier, or a

    value read from the token itself) still suppresses this finding.

    Triage against what the audience is actually compared to.'
  patterns:
  - pattern-either:
    - pattern-regex: \bjwt\.decode\(
    - pattern-regex: \bjwt\.verify\(
    - pattern-regex: \bjwtVerify\(
  - pattern-not-regex: (?m)^\s*#
  - pattern-not-regex: (?m)^\s*//.*
  - pattern-not-regex: (?:def test_|conftest|unittest)
  - pattern-not-regex: (?i)\bjwt\.decode\((?:(?!\ndef )[\s\S]){0,400}?(?:audience\s*[:=]|aud["'\]]*\s*[!=]=|verify_aud)
  - pattern-not-regex: (?i)\bjwt\.verify\((?:(?!\ndef )[\s\S]){0,400}?(?:audience\s*[:=]|aud["'\]]*\s*[!=]=|verify_aud)
  - pattern-not-regex: (?i)\bjwtVerify\((?:(?!\ndef )[\s\S]){0,400}?(?:audience\s*[:=]|aud["'\]]*\s*[!=]=|verify_aud)
  metadata:
    category: auth
    cwe:
    - 287
    - 863
    original_engine: neuroscan
    rule_name: JWT/bearer token decoded without audience validation
    fix: 'Validate the token''s `aud` claim identifies THIS resource server before trusting anything else in it: `jwt.decode(token,
      key, algorithms=[...], audience=RESOURCE_SERVER_ID)` (PyJWT/python-jose raise on mismatch automatically), `jwt.verify(token,
      key, { audience: RESOURCE_SERVER_ID })` (jsonwebtoken), or `jwtVerify(token, key, { audience: RESOURCE_SERVER_ID })`
      (jose). Do not accept a token whose audience is absent, wildcarded, or names a different resource.'
    residual:
    - sanitizer
- id: ns-aiml-160
  languages:
  - javascript
  - python
  - typescript
  severity: WARNING
  message: 'Either: a redirect URI is validated with `.startswith()`/`.startsWith()`

    against the registered value instead of an exact string comparison

    (the classic open-redirect bypass -- `https://app.example.com.evil.com`

    or `https://app.example.com/../evil` both satisfy a prefix check that

    exact matching would reject); or: a Dynamic Client Registration (DCR)

    endpoint reads `redirect_uris` directly from the request body with no

    visible allowlist/hostname check nearby before registering the client.

    MCP''s DCR support (RFC 7591) made dynamic redirect-URI registration

    common, which reintroduces classic OAuth open-redirect risk in a

    newly-common code path -- OAuth 2.0 Security BCP requires EXACT

    string comparison for redirect URIs, never prefix or substring

    matching.

    Engine limitation: presence + absence-in-window. A DCR endpoint that

    validates through an indirection this rule cannot see (a schema

    validator, a separate middleware) will still be flagged; conversely,

    an allowlist term appearing anywhere in the same +/-10 line window

    (not necessarily applied to THIS redirect_uris read) suppresses it.'
  patterns:
  - pattern-either:
    - pattern-regex: (?i)redirect\w*\.startswith\(
    - pattern-regex: redirect_uris\s*=\s*request\.(?:json|form|args)
    - pattern-regex: redirectUris\s*[:=]\s*req\.body
  - pattern-not-regex: (?m)^\s*#
  - pattern-not-regex: (?m)^\s*//.*
  - pattern-not-regex: (?:def test_|conftest|unittest)
  - pattern-not-regex: (?i)redirect_uris\s*=\s*request\.(?:json|form|args)(?:(?!\ndef )[\s\S]){0,400}?(?:allowed[_-]?redirect|redirect.{0,20}not
      in|not in.{0,20}redirect)
  - pattern-not-regex: (?i)redirectUris\s*[:=]\s*req\.body(?:(?!\ndef )[\s\S]){0,400}?(?:allowed[_-]?redirect|\.includes\(\s*redirect)
  metadata:
    category: auth
    cwe:
    - 601
    - 863
    original_engine: neuroscan
    rule_name: OAuth redirect URI validated by prefix, or DCR-registered without an allowlist
    fix: 'Compare redirect URIs with exact string equality against a fixed allowlist, never a prefix/substring/regex match:
      `if redirect_uri not in ALLOWED_REDIRECT_URIS: reject()`. For DCR, validate every submitted redirect_uris entry''s full
      URI (not just its hostname) against policy before registering the client, and reject registration if none are provided.'
    residual:
    - sanitizer
- id: ns-aiml-161
  languages:
  - javascript
  - python
  - typescript
  severity: WARNING
  message: 'Either: the `Mcp-Session-Id` header is read and used as the

    apparent basis for identifying/authenticating the caller with no

    other authentication mechanism (Authorization/Bearer header, JWT

    verification) visible nearby; or: a session id is generated from a

    predictable source -- `uuid.uuid1()` (time + MAC address, not

    cryptographically random), a Unix timestamp, or `Date.now()`. The

    MCP authorization spec explicitly states session IDs MUST NOT be

    used for authentication -- they identify a session for routing

    purposes, and unlike a bearer token they are frequently visible in

    logs, browser history, and referrer headers, and (per this second

    signal) are sometimes generated in a way an attacker can guess or

    narrow down.

    Engine limitation: presence + absence-in-window for the first signal

    -- real authentication performed through an indirection this rule

    cannot see (a decorator, a separate middleware file) will still be

    flagged.'
  patterns:
  - pattern-either:
    - pattern-regex: (?i)headers(?:\.get\(|\[)\s*["']mcp-session-id["']
    - pattern-regex: (?i)session_?id\s*=.{0,60}uuid1\(
    - pattern-regex: (?i)session_?id\s*=.{0,60}int\(time\.time\(\)
    - pattern-regex: (?i)session_?id\s*=.{0,60}Date\.now\(\)
  - pattern-not-regex: (?m)^\s*#
  - pattern-not-regex: (?m)^\s*//.*
  - pattern-not-regex: (?:def test_|conftest|unittest)
  - pattern-not-regex: (?i)headers(?:\.get\(|\[)\s*["']mcp-session-id["']\s*\)?(?:(?!\ndef )[\s\S]){0,400}?(?:authorization|jwt\.decode\(|jwt\.verify\(|jwtVerify\(|bearer)
  metadata:
    category: auth
    cwe:
    - 287
    - 330
    original_engine: neuroscan
    rule_name: MCP session id used as authentication, or generated predictably
    fix: Never treat a session id as proof of identity. Authenticate every request with a real credential (a bearer token
      validated per ns-aiml-159, or an equivalent), and use the session id only for session routing/correlation after that
      authentication succeeds. If you generate session ids, use a cryptographically random generator (`uuid.uuid4()`, `secrets.token_urlsafe()`,
      `crypto.randomUUID()`) -- never a timestamp or a time-based UUID version.
    residual:
    - sanitizer
- id: ns-aiml-162
  languages:
  - javascript
  - python
  - typescript
  severity: WARNING
  message: 'One of three RFC 8707 / MCP-authorization-spec anti-patterns: (a) a

    `resource_indicators`/`resourceIndicators` value of `"*"` -- a

    wildcard resource indicator defeats RFC 8707''s entire purpose, which

    is letting an authorization server scope a token to ONE resource

    server; (b) an authorization-server URL taken directly from a

    client-supplied request value (`authorization_server = request.args

    .get(...)`) rather than a fixed, operator-configured value -- this

    lets a client redirect the auth flow at an attacker-controlled

    "authorization server" that then harvests whatever the real client

    would have sent it; (c) an `/authorize`-shaped OAuth endpoint with no

    visible `code_challenge`/PKCE handling -- the MCP spec requires

    PKCE (RFC 7636) for all clients, not only public ones.

    Engine limitation: presence + absence-in-window for (c) -- PKCE

    enforcement through an indirection (a framework-level OAuth library

    that handles it internally) will still be flagged; triage against

    which OAuth library is in use.'
  patterns:
  - pattern-either:
    - pattern-regex: (?i)resource_?indicators?\s*=\s*\[?\s*["']\*["']
    - pattern-regex: (?i)authorization_?server\s*=\s*request\.(?:args|json|form|GET|POST)
    - pattern-regex: (?i)@app\.route\(\s*["'][^"']*authorize
    - pattern-regex: (?i)\.(?:get|post)\(\s*["'][^"']*authorize
    - pattern-regex: (?i)def\s+authorize\s*\(
  - pattern-not-regex: (?m)^\s*#
  - pattern-not-regex: (?m)^\s*//.*
  - pattern-not-regex: (?:def test_|conftest|unittest)
  - pattern-not-regex: (?i)@app\.route\(\s*["']*[^"']*authorize[^\n]*\n\s*def\s+\w+\s*\([^)]*\)\s*:(?:(?!\ndef )[\s\S]){0,400}?(?:code_?challenge|code_?verifier|\bpkce\b|\bS256\b)
  - pattern-not-regex: (?i)\.(?:get|post)\(\s*["']*[^"']*authorize(?:(?!\ndef )[\s\S]){0,400}?(?:code_?challenge|code_?verifier|\bpkce\b|\bS256\b)
  - pattern-not-regex: (?i)def\s+authorize\s*\((?:(?!\ndef )[\s\S]){0,400}?(?:code_?challenge|code_?verifier|\bpkce\b|\bS256\b)
  metadata:
    category: auth
    cwe:
    - 346
    - 863
    original_engine: neuroscan
    rule_name: OAuth wildcard resource indicator, client-supplied authorization-server URL, or missing PKCE
    fix: Never accept a wildcard resource indicator -- require an exact, single resource URI per token request. Take the authorization-server
      URL from fixed operator configuration, never from a client-supplied request parameter. Require and verify a `code_challenge`/`code_verifier`
      (PKCE, S256) on every `/authorize` request, public client or not, per the MCP authorization spec.
    residual:
    - sanitizer
