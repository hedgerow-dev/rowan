  severity: INFO
  message: Lambda(lambda ...) layer embeds a marshalled Python function in the model graph. If this model is saved (model.save/.h5/.keras
    export) and distributed, safe loaders (safe_mode=True, ns-aiml-114) will refuse it and scanners (MFV-KERAS-001) will flag
