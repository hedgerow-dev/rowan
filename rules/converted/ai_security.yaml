    - pattern-regex: (?:mcp|server|app)\.run\([^)]*host\s*=\s*["']0\.0\.0\.0["']
    - pattern-regex: (?:mcp|server|app)\.run\([^)]*["']0\.0\.0\.0["'][^)]*\)
    - pattern-regex: FastMCP\([^)]*host\s*=\s*["']0\.0\.0\.0["']
