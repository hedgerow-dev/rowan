    mounting the Docker socket into a container an LLM-driven agent can

    reach gives it the ability to launch new, arbitrary containers on the

    HOST engine (full host takeover, not merely "escape this one

    container"), and this exact shape is a common tutorial pattern for

    giving an agent a "code execution sandbox." `pid_mode`/`network_mode:

    host` similarly erase the isolation a container is supposed to provide.

    Issue #189 (epic #183).'
  patterns:
  - pattern-either:
    - pattern-regex: privileged\s*[:=]\s*["']?[Tt]rue
    - pattern-regex: /var/run/docker\.sock
    - pattern-regex: network_mode\s*[:=]\s*["']?host["']?
    - pattern-regex: pid_mode\s*[:=]\s*["']?host["']?
    - pattern-regex: cap_add.*SYS_ADMIN
  - pattern-not-regex: (?m)^\s*#
  - pattern-not-regex: (?m)^\s*//.*
  - pattern-not-regex: (?:def test_|conftest|unittest)
  metadata:
    category: ai_ml
    cwe:
    - 269
    - 250
    original_engine: neuroscan
    rule_name: Escape-grade Docker configuration for an agent/interpreter container
    fix: 'Never run an agent/interpreter container privileged, with the Docker socket mounted, or with host networking/PID
      namespace. Use a rootless, capability-dropped container (`cap_drop: [ALL]`), a dedicated bridge network, and its own
      PID namespace. If the agent genuinely needs to launch containers, use a scoped sibling-container API (e.g. a proxy that
      only permits a fixed allowlist of images/commands), never a raw docker.sock bind.'
- id: ns-aiml-164
  languages:
  - javascript
  - python
  - typescript
  severity: WARNING
  message: 'An E2B/Modal-style hosted sandbox (`Sandbox(...)` / `Sandbox.create(...)`)

    is constructed with no visible `timeout`/`timeout_ms`, and no visible

    network-restriction parameter (`allow_internet`, `network_access`,

    `internet_access`, `disable_network`, `no_internet`) anywhere nearby.

    Network egress from a code interpreter is the exfiltration path that

    makes an otherwise-contained RCE matter -- sandboxed code execution

    with an open network connection can still exfiltrate secrets, call out

    to an attacker-controlled endpoint, or pull in and run additional

    payloads. An absent timeout compounds this by letting a single

    sandboxed session run indefinitely.

    Engine limitation: the exact network-control parameter name varies by

    provider and SDK version; this checks for the ABSENCE of any

    recognized term nearby, so a provider whose network isolation is

    configured at the template/organization level rather than per-call

    will still be flagged. Triage against the actual provider''s model.

    Issue #189 (epic #183).'
  patterns:
  - pattern-either:
    - pattern-regex: \bSandbox\s*\(
    - pattern-regex: \bSandbox\.create\s*\(
  - pattern-not-regex: (?m)^\s*#
  - pattern-not-regex: (?m)^\s*//.*
  - pattern-not-regex: (?:def test_|conftest|unittest)
  - pattern-not-regex: (?i)Sandbox\s*\((?:(?!\ndef )[\s\S]){0,400}?(?:timeout(?:_ms)?\s*=|allow_internet\s*=|network_access\s*=|internet_access\s*=|disable_network|no_internet)
  - pattern-not-regex: (?i)Sandbox\.create\s*\((?:(?!\ndef )[\s\S]){0,400}?(?:timeout(?:_ms)?\s*=|allow_internet\s*=|network_access\s*=|internet_access\s*=|disable_network|no_internet)
  metadata:
    category: ai_ml
    cwe:
    - 668
    - 400
    original_engine: neuroscan
    rule_name: Hosted code-interpreter sandbox with no visible network restriction or timeout
    fix: Set an explicit, short timeout on every hosted sandbox session, and disable network egress unless the agent's task
      genuinely requires it (e.g. E2B's per-sandbox firewall/allowlist settings, or your provider's equivalent). A code interpreter
      with an open network connection can exfiltrate anything it can read, regardless of how well the execution itself is
      contained.
    residual:
    - sanitizer
- id: ns-aiml-165
  languages:
  - javascript
  - python
  - typescript
  severity: WARNING
  message: 'A sandboxed code-execution session is handed the full host environment

    (`envs=os.environ`), a Docker `env_file`, or a bind mount of a cloud

    credential directory (`~/.aws`, `~/.config/gcloud`). The sandbox

    contains the CODE but hands it the KEYS anyway -- whatever the sandbox

    is supposed to protect against (an agent running attacker-influenced

    code) can simply read the credentials out of its own environment or

    filesystem and exfiltrate them, no escape required at all.

    Issue #189 (epic #183).'
  patterns:
  - pattern-either:
    - pattern-regex: envs\s*=\s*os\.environ\b
    - pattern-regex: '(?m)^\s*env_file\s*:'
    - pattern-regex: '["\x27/]\.aws["\x27/]'
    - pattern-regex: '["\x27/]\.config/gcloud'
  - pattern-not-regex: (?m)^\s*#
  - pattern-not-regex: (?m)^\s*//.*
  - pattern-not-regex: (?:def test_|conftest|unittest)
  - pattern-not-regex: (?m)^\s*env_file\s*:.*,\s*$
  metadata:
    category: ai_ml
    cwe:
    - 522
    - 200
    original_engine: neuroscan
    rule_name: Sandbox inherits the full host environment or cloud credentials
    fix: Pass the sandbox only the specific environment variables its task actually needs -- never the full `os.environ`.
      Never mount a cloud credential directory or an `env_file` containing production secrets into a code-execution sandbox.
      If the sandboxed code needs to call an API on the agent's behalf, use a short-lived, narrowly-scoped credential minted
      for that one session, not the host's own long-lived keys.
- id: ns-aiml-166
  languages:
  - python
  severity: ERROR
  message: '`exec(code, {})` (or `exec(code, {}, {})`) is a common misconception:

    passing an empty dict as globals does NOT remove access to builtins --

    Python automatically injects a `__builtins__` entry into any globals

    dict that lacks one, so the executed code still has full access to

    `open`, `__import__`, `eval`, and everything else needed to escape.

    This is a "sandbox" in name only. Issue #189 (epic #183): related to

    `TNT-INJECT-003`''s RestrictedPython sanitizer fix (DEF-43-shaped bug --

    the bare word `RestrictedPython` was a sanitizer with no verification

    it was actually used correctly); this is the same fail-open

    misconception in a different, non-library-dependent form.'
  patterns:
  - pattern-either:
    - pattern-regex: exec\(\s*\w+\s*,\s*\{\}\s*\)
    - pattern-regex: exec\(\s*\w+\s*,\s*\{\}\s*,\s*\{\}\s*\)
  - pattern-not-regex: (?m)^\s*#
  - pattern-not-regex: (?:def test_|conftest|unittest)
  metadata:
    category: ai_ml
    cwe:
    - 693
    - 94
    original_engine: neuroscan
    rule_name: exec() presented as sandboxed via a trivial or empty globals dict
    fix: An empty globals dict is not a sandbox -- Python injects `__builtins__` automatically. Use RestrictedPython's `compile_restricted()`
      with an explicit, minimal `safe_globals`/`safe_builtins`, or better, run untrusted code in a real process/container/microVM
      sandbox (E2B, gVisor, nsjail, Firecracker) rather than in-process at all.
- id: ns-aiml-167
  languages:
  - python
  - yaml
  severity: WARNING
  message: 'A container/sandbox mount binds the host filesystem root (`/`), the

    user''s home directory (`~`), or a bare Windows drive root (`C:\`,

    `C:/`) into an agent code-execution environment. Mirrors the

    `_ROOT_SCOPE_PATHS` check `rowan/core/mcp_config.py` already

    applies to MCP server filesystem-tool arguments -- the same

    misconfiguration, one level down at the container/sandbox mount layer:

    whatever the sandbox is supposed to contain, a root or home-directory

    mount hands it the entire host filesystem instead of a scoped project

    directory. Issue #189 (epic #183).'
  patterns:
  - pattern-either:
    - pattern-regex: volumes\s*=\s*\{\s*["\x27](?:/|~|C:\\\\|C:/)["\x27]
    - pattern-regex: '(?m)^\s*-\s*(?:/|~|C:\\\\|C:/):'
  - pattern-not-regex: (?m)^\s*#
  - pattern-not-regex: (?:def test_|conftest|unittest)
  metadata:
    category: ai_ml
    cwe:
    - 668
    - 552
    original_engine: neuroscan
    rule_name: Host root or home directory bind-mounted into an agent sandbox
    fix: Bind-mount only the specific project/workspace directory the sandboxed code needs, never the host filesystem root
      or a user's home directory. If the agent needs to read reference files, copy them into a scoped, disposable directory
      rather than granting broad host filesystem access.
- id: ns-aiml-168
  languages:
  - python
  severity: ERROR
  message: 'An agent tool (or a bare `os.system`/`subprocess` call reachable from

    one) executes shell commands or arbitrary code with no recognized

    sandbox mechanism (E2B, Modal, Daytona, Docker, gVisor, nsjail,

    Firecracker, RestrictedPython/`compile_restricted`, Pyodide) visible

    anywhere nearby. This is the confirmatory escalation of

    `NS-AIML-010`/`NS-AIML-011` (which flag the dangerous call as a bare

    presence signal regardless of context): when nothing that looks like a

    sandbox appears in the surrounding code at all, this is no longer "an

    agent has a shell tool" but "an agent has direct, unsandboxed host

    access." Issue #189 (epic #183).

    Engine limitation: presence + absence-in-window, like every other

    NeuroScan rule -- a sandbox implemented in a different file this rule

    doesn''t scan (a separate sandboxing service the tool calls out to)

    will still be flagged; triage against the actual execution path. This

    necessarily co-fires with `NS-AIML-010`/`011` on the same line by

    design (see the fix note there) -- it is a stronger, escalated signal

    layered on the same evidence, not an accidental duplicate rule (DEF-10

    is about byte-identical patterns meant to be one rule; this is a

    deliberately distinct, complementary check).'
  patterns:
  - pattern-either:
    - pattern-regex: os\.system\s*\(
    - pattern-regex: subprocess\.(?:run|Popen|call)\s*\(
    - pattern-regex: '@(?:tool|mcp\.tool|server\.tool|app\.tool)\b[\s\S]{0,300}?\bexec\('
  - pattern-not-regex: (?m)^\s*#
  - pattern-not-regex: (?:def test_|conftest|unittest)
  - pattern-not-regex: (?:@fixture|@pytest)
  - pattern-not-regex: shell\s*=\s*False
  - pattern-not-regex: (?:argparse|sys\.argv|--help|setup\.py|pip\s+install|pip\s+uninstall)
  - pattern-not-regex: subprocess\.run\(\[["\x27](?:git|docker|pip|npm|cargo|go|make|cmake)["\x27]
  - pattern-not-regex: subprocess\.(?:run|Popen|call)\([^)]*capture_output\s*=\s*True
  - pattern-not-regex: subprocess\.(?:run|Popen|call)\([^)]*check\s*=\s*True
  - pattern-not-regex: subprocess\.(?:run|Popen|call)\([^)]*text\s*=\s*True
  - pattern-not-regex: (?i)os\.system\s*\((?:(?!\ndef )[\s\S]){0,400}?(?:e2b|Sandbox\(|modal\.Sandbox|\bdocker\b|gvisor|nsjail|firecracker|RestrictedPython|compile_restricted|pyodide|daytona)
  - pattern-not-regex: (?i)subprocess\.(?:run|Popen|call)\s*\((?:(?!\ndef )[\s\S]){0,400}?(?:e2b|Sandbox\(|modal\.Sandbox|\bdocker\b|gvisor|nsjail|firecracker|RestrictedPython|compile_restricted|pyodide|daytona)
  - pattern-not-regex: (?i)@(?:tool|mcp\.tool|server\.tool|app\.tool)\b(?:(?!\ndef )[\s\S]){0,300}?\bexec\((?:(?!\ndef )[\s\S]){0,400}?(?:e2b|Sandbox\(|modal\.Sandbox|\bdocker\b|gvisor|nsjail|firecracker|RestrictedPython|compile_restricted|pyodide|daytona)
  metadata:
    category: ai_ml
    cwe:
    - 94
    - 78
    original_engine: neuroscan
    rule_name: Agent code-execution tool with no recognized sandbox anywhere nearby
    fix: Never let an agent-callable tool run subprocess/os.system/exec directly against the host. Route all agent-initiated
      code execution through a real sandbox (E2B, Modal, Daytona, a locked-down container with dropped capabilities, or an
      in-process restricted interpreter with a genuinely minimal globals dict -- see ns-aiml-166).
    residual:
    - sanitizer
- id: ns-aiml-154
  languages:
  - generic
  severity: WARNING
  message: 'LLM tracing is initialized (langsmith.Client(), Langfuse(),

    phoenix.otel.register(), a W&B LLM tracer, or LANGCHAIN_TRACING_V2

    in a committed env file or Dockerfile) with no redaction hook

    (mask=/hide_inputs/hide_outputs) or content-capture opt-out

    (OTEL_..._CAPTURE_CONTENT=false) visible nearby. By default these

    SDKs capture the full prompt, completion, tool-call arguments, and

    retrieved RAG documents and ship them to a third-party SaaS -- in a

    codebase where the prompt carries customer records, that is an

    undeclared data-processor relationship. Enabling tracing is

    frequently a one-line change made during debugging and never

    reverted; forward this to whoever owns data-processing agreements,

    not just engineering.'
  patterns:
  - pattern-either:
    - pattern-regex: \blangsmith\.Client\(
    - pattern-regex: \bLangfuse\(
    - pattern-regex: \bphoenix\.otel\.register\(
    - pattern-regex: \bWandbTracer\(
    - pattern-regex: \bwandb\.integration\.openai\.autolog\(
    - pattern-regex: (?i)\bLANGCHAIN_TRACING_V2\s*[=:]\s*["']?(?:true|1)["']?
    - pattern-regex: (?im)^\s*ENV\s+LANGCHAIN_TRACING_V2\s*=?\s*["']?(?:true|1)["']?
  - pattern-not-regex: (?m)^\s*#
  - pattern-not-regex: (?:def test_|conftest|unittest)
  - pattern-not-regex: \blangsmith\.Client\((?:(?!\ndef )[\s\S]){0,300}?(?i:hide_inputs|hide_outputs|\bmask\s*=|redact|scrub|anonymize|CAPTURE_CONTENT\s*=\s*false)
  - pattern-not-regex: \bLangfuse\((?:(?!\ndef )[\s\S]){0,300}?(?i:hide_inputs|hide_outputs|\bmask\s*=|redact|scrub|anonymize|CAPTURE_CONTENT\s*=\s*false)
  - pattern-not-regex: \bphoenix\.otel\.register\((?:(?!\ndef )[\s\S]){0,300}?(?i:hide_inputs|hide_outputs|\bmask\s*=|redact|scrub|anonymize|CAPTURE_CONTENT\s*=\s*false)
  - pattern-not-regex: \bWandbTracer\((?:(?!\ndef )[\s\S]){0,300}?(?i:hide_inputs|hide_outputs|\bmask\s*=|redact|scrub|anonymize|CAPTURE_CONTENT\s*=\s*false)
  metadata:
    category: ai_ml
    cwe:
    - 359
    original_engine: neuroscan
    rule_name: LLM tracing enabled with payload capture on
    residual:
    - sanitizer
  paths:
    include:
    - '*.py'
    - '*.pyi'
    - Dockerfile
    - '*.dockerfile'
    - '*.yaml'
    - '*.yml'
    - .env
- id: ns-aiml-155
  languages:
  - python
  severity: INFO
  message: 'An LLM tracing client (langsmith.Client(), Langfuse(),

    phoenix.otel.register()) is configured with no visible host/

    endpoint argument nearby. With no explicit endpoint, these SDKs

    silently default to the vendor''s own cloud -- confirm this is

    intended (that data leaving to the vendor''s SaaS is an accepted,

    declared relationship) rather than assuming a self-hosted

    deployment. Presence signal; this is not a claim that any breach

    occurred.'
  patterns:
  - pattern-either:
    - pattern-regex: \blangsmith\.Client\(
    - pattern-regex: \bLangfuse\(
    - pattern-regex: \bphoenix\.otel\.register\(
  - pattern-not-regex: (?m)^\s*#
  - pattern-not-regex: (?:def test_|conftest|unittest)
  - pattern-not-regex: \blangsmith\.Client\((?:(?!\ndef )[\s\S]){0,300}?(?i:\bhost\s*=|\bendpoint\s*=|api_url\s*=)
  - pattern-not-regex: \bLangfuse\((?:(?!\ndef )[\s\S]){0,300}?(?i:\bhost\s*=|\bendpoint\s*=|api_url\s*=)
  - pattern-not-regex: \bphoenix\.otel\.register\((?:(?!\ndef )[\s\S]){0,300}?(?i:\bhost\s*=|\bendpoint\s*=|api_url\s*=)
  metadata:
    category: ai_ml
    cwe:
    - 200
    original_engine: neuroscan
    rule_name: LLM tracing endpoint not pinned to self-hosted infrastructure
    residual:
    - sanitizer
- id: ns-sec-003
  languages:
  - generic
  severity: ERROR
  message: 'A literal-looking value is assigned to an LLM tracing provider''s API

    key (LANGSMITH_API_KEY, LANGFUSE_SECRET_KEY/LANGFUSE_PUBLIC_KEY,

    PHOENIX_API_KEY, or WANDB_API_KEY). Same class as any other

    committed credential -- anyone with read access to the repository

    (or its history) can read it and exfiltrate traced prompts/

    completions from the tracing provider''s own dashboard, which is a

    second disclosure surface beyond the credential itself.'
  patterns:
  - pattern-either:
    - pattern-regex: (?i)\bLANGSMITH_API_KEY\s*[=:]
    - pattern-regex: (?i)\bLANGFUSE_SECRET_KEY\s*[=:]
    - pattern-regex: (?i)\bLANGFUSE_PUBLIC_KEY\s*[=:]
    - pattern-regex: (?i)\bPHOENIX_API_KEY\s*[=:]
    - pattern-regex: (?i)\bWANDB_API_KEY\s*[=:]
  metadata:
    category: secrets
    cwe:
    - 798
    original_engine: neuroscan
    original_severity: critical
    rule_name: LLM tracing API key committed
    fix: Move the value to a secret manager or environment variable injected at runtime, never a literal in source or a committed
      .env file, and rotate it since it is already in history.
    residual:
    - secrets
  paths:
    include:
    - '*.py'
    - '*.pyi'
    - Dockerfile
    - '*.dockerfile'
    - '*.yaml'
    - '*.yml'
    - .env
- id: ns-aiml-135
  languages:
  - python
  severity: ERROR
  message: 'A media URL field taken from a request (image_url, audio_url,

    video_url, ref_audio, media_url, or the OpenAI-compatible

    {"type": "image_url", "image_url": {"url": ...}} content part) is

    passed straight into an HTTP client call with no host validation

    visible nearby. On an inference server this turns the model endpoint

    into a request proxy: the caller picks the destination, so

    169.254.169.254 (cloud metadata), 127.0.0.1 (the admin/control port

    on the same box) and RFC1918 addresses are all reachable, and the

    response, headers or error text often leak back through the model

    output or the error path. This is LMDeploy CVE-2026-33626, fixed in

    v0.12.3 by adding an _is_safe_url() check that blocks 169.254.0.0/16,

    127.0.0.0/8, ::1 and the RFC1918 ranges; the same defect was

    confirmed independently in NVIDIA Dynamo (ref_audio), TGI and the

    Dynamo MDC artifact resolver, and one of them was exploited in the

    wild within 12 hours of the advisory. Note that a guard existing

    elsewhere in the repo is not a fix: in two of the four cases a correct

    revalidating fetcher already shipped in the same tree and the

    vulnerable loader simply did not call it.'
  patterns:
  - pattern-either:
    - pattern-regex: (?i)(?:requests|httpx|aiohttp|urllib3|urllib\.request|\w*(?:session|client|http)\w*)(?:\([^)]{0,60}\))?\.(?:get|post|request|stream|urlopen)\s*\(\s*(?:await\s+)?[^)]{0,120}?(?:image_url|audio_url|video_url|ref_audio|media_url)
    - pattern-regex: (?i)\b(?:urlopen|urlretrieve)\s*\(\s*[^)]{0,120}?(?:image_url|audio_url|video_url|ref_audio|media_url)
  - pattern-not-regex: (?m)^\s*#
  - pattern-not-regex: (?:def test_|conftest|unittest)
  metadata:
    category: ssrf
    cwe:
    - 918
    original_engine: neuroscan
    rule_name: Request-supplied media URL fetched without host validation
    fix: Resolve the hostname and reject the fetch when it lands on a private, loopback, link-local or multicast address (169.254.0.0/16,
      127.0.0.0/8, ::1, RFC1918) before issuing the request, and route every media loader in the tree through that one checked
      fetcher rather than re-implementing it per handler.
    residual:
    - sanitizer
- id: ns-aiml-136
  languages:
  - python
  severity: WARNING
  message: 'Server-side code reads a media URL field out of a request payload

    (part["image_url"]["url"], payload.get("audio_url"),

    content.image_url.url and friends). This is the entrypoint half of the

    multimodal SSRF class in ns-aiml-135: the value is caller-controlled

    and, in every confirmed case (LMDeploy CVE-2026-33626, NVIDIA Dynamo

    ref_audio, TGI, the Dynamo MDC resolver), it was later dereferenced by

    an HTTP fetch with no hostname or private-range check.

    Presence signal, WARNING: the regex engine matches line by line, so

    when the URL is copied into a generically-named variable

    (url = part["image_url"]["url"]) the later fetch line carries no media

    token and ns-aiml-135 cannot see it. This rule covers that gap and

    therefore also fires on reads that never reach a fetch (validation,

    logging, re-serialisation). Confirm where the value goes before

    treating it as a finding.'
  patterns:
  - pattern-either:
    - pattern-regex: (?i)\[\s*["']image_url["']\s*\]\s*\[\s*["']url["']\s*\]
    - pattern-regex: (?i)\.(?:image_url|audio_url|video_url|ref_audio|media_url)\.url\b
    - pattern-regex: (?i)\.get\(\s*["'](?:image_url|audio_url|video_url|ref_audio|media_url)["']
    - pattern-regex: (?i)\[\s*["'](?:image_url|audio_url|video_url|ref_audio|media_url)["']\s*\]
  - pattern-not-regex: (?m)^\s*#
  - pattern-not-regex: (?:def test_|conftest|unittest)
  - pattern-not-regex: (?i)["'](?:image_url|audio_url|video_url|ref_audio|media_url)["']\s*\]\s*=[^=]
  metadata:
    category: ssrf
    cwe:
    - 918
    original_engine: neuroscan
    rule_name: Multimodal media URL read from a request payload
    fix: 'Treat the media URL as untrusted input: resolve and check the destination address against a private/loopback/link-local
      blocklist (or an explicit host allowlist) inside the single shared fetcher that every loader calls.'
    residual:
    - sanitizer
- id: ns-aiml-137
  languages:
  - python
  severity: ERROR
  message: 'Dynamic code execution is handed an explicit globals mapping that

    defines __builtins__ as a dict of "safe" names. A __builtins__ dict is

    not a sandbox. Any executed string reaches the full interpreter in

    four lines through the object graph, for example

    ().__class__.__base__.__subclasses__() to find BuiltinImporter and

    import anything, without ever touching the __import__ entry that was

    so carefully replaced. LMCache shipped exactly this shape behind an

    unauthenticated /run_script endpoint, which is unauthenticated RCE.

    There is no allowlist of builtins, no name filter and no AST check

    that makes this safe, so do not tune the dict: remove the dynamic

    execution endpoint, or move execution into a real OS-level sandbox

    (separate process, seccomp/gVisor/container, no host filesystem or

    network) and authenticate and authorise the caller.'
  patterns:
  - pattern-either:
    - pattern-regex: '(?:[{,]|^)\s*["'']__builtins__["'']\s*:'
    - pattern-regex: \[\s*["']__builtins__["']\s*\]\s*=[^=]
    - pattern-regex: \b(?:exec|eval)\s*\([^)]{0,200}__builtins__
  - pattern-not-regex: (?m)^\s*#
  - pattern-not-regex: (?:def test_|conftest|unittest)
  metadata:
    category: ai_ml
    cwe:
    - 94
    - 693
    original_engine: neuroscan
    rule_name: Fake exec sandbox built from a restricted __builtins__ dict
    fix: Delete the dynamic execution path, or run the code in a real OS-level sandbox (separate process with seccomp/container
      isolation, no host filesystem or network) behind authentication; never rely on a restricted __builtins__ mapping.
- id: ns-aiml-138
  languages:
  - python
  severity: WARNING
  message: 'A multi-agent orchestration construct (AutoGen `GroupChat`, LangGraph

    `StateGraph`, or CrewAI `Crew`) with no visible turn/round/iteration

    cap (`max_round`, `recursion_limit`, `max_iter`, `max_turns`) anywhere

    nearby. Issue #188 (epic #183): related to `ns-aiml-120`''s unbounded

    `while True` around a single completion call, but structurally

    different -- the loop here lives in the DELEGATION GRAPH (agent A

    hands off to B, which hands back to A, ...), not in ordinary control

    flow, so `ns-aiml-120` cannot see it. A cyclic or open-ended handoff

    topology with no cap means a misbehaving or adversarially-steered

    agent can keep the delegation loop running indefinitely, exhausting

    the token/rate budget the same way an unbounded reflection loop does.

    Engine limitation: presence + absence-in-window, like every other

    NeuroScan rule here -- this cannot verify the topology is actually

    cyclic (a genuinely acyclic, one-pass handoff chain with no natural

    termination condition looks identical to this rule), so it is a

    cycle-agnostic "unbounded orchestration session" signal, not a

    confirmed-cyclic-graph one. Triage against the actual handoff graph.'
  patterns:
  - pattern-either:
    - pattern-regex: \bGroupChat\s*\(
    - pattern-regex: \bStateGraph\s*\(
    - pattern-regex: \bCrew\s*\(
  - pattern-not-regex: (?m)^\s*#
  - pattern-not-regex: (?:def test_|conftest|unittest)
  - pattern-not-regex: (?m)^\s*class\s+(?:GroupChat|StateGraph|Crew)\s*\(
  - pattern-not-regex: (?i)GroupChat\s*\((?:(?!\ndef )[\s\S]){0,400}?(?:max_round|recursion_limit|max_iter|max_turns)
  - pattern-not-regex: (?i)StateGraph\s*\((?:(?!\ndef )[\s\S]){0,400}?(?:max_round|recursion_limit|max_iter|max_turns)
  - pattern-not-regex: (?i)Crew\s*\((?:(?!\ndef )[\s\S]){0,400}?(?:max_round|recursion_limit|max_iter|max_turns)
  metadata:
    category: ai_ml
    cwe:
    - 400
    - 770
    original_engine: neuroscan
    rule_name: Unbounded multi-agent delegation topology
    fix: 'Cap every multi-agent delegation session with a code-controlled limit: GroupChat''s max_round, LangGraph''s recursion_limit
      (passed via config= at invoke time), or Crew''s max_iter. A model-decided stopping condition (an agent replying "done")
      is not a bound -- a misbehaving or adversarially-steered agent can keep handing off indefinitely.'
    residual:
    - sanitizer
- id: ns-aiml-139
  languages:
  - python
  severity: WARNING
  message: 'An A2A (Agent2Agent) agent card / capability manifest is fetched from

    a remote `.well-known/agent.json`-shaped URL with no signature

    verification or pinning check visible nearby. This is

    `trust_remote_code` (`ns-aiml-047`/`059`) for agent TOPOLOGY rather

    than model weights: the agent card tells the caller which tools the

    peer agent exposes and how to invoke it, and a compromised or

    MITM''d card can redirect delegation at an attacker-controlled agent

    impersonating the intended peer, the same way an unverified model

    download can deliver a tampered model.

    Engine limitation: presence + absence-in-window. Verification

    performed through an indirection this rule cannot see (a dedicated

    A2A client library that verifies internally) will still be flagged;

    triage against which A2A client is in use.'
  patterns:
  - pattern-regex: (?:httpx|requests)\.get\([^)]*\.well-known/agent
  - pattern-not-regex: (?m)^\s*#
  - pattern-not-regex: (?:def test_|conftest|unittest)
  - pattern-not-regex: (?i)(?:httpx|requests)\.get\([^)]*\.well-known/agent(?:(?!\ndef )[\s\S]){0,400}?(?:verify_signature|\bsignature\b|check_signature|\bpinned?\b|\btrusted\b)
  metadata:
    category: supply_chain
    cwe:
    - 345
    - 494
    original_engine: neuroscan
    rule_name: A2A agent card fetched without pinning or signature verification
    fix: Verify the agent card's signature (or fetch it only from a pinned, operator-controlled source) before trusting anything
      it claims about the peer agent's identity or capabilities. Treat a remotely-fetched, unverified agent card the same
      as an unverified model download -- don't act on it.
    residual:
    - sanitizer
