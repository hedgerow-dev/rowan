- id: ns-aiml-114
  languages:
  - python
  severity: WARNING
  message: keras.models.load_model()/keras.saving.load_model() executes arbitrary code if the loaded archive contains a Lambda
    layer (CVE-2024-3660) or, in Keras 3 < 3.9, a crafted Model.from_config payload (CVE-2025-1550). Presence signal; confirm
    the model source is user-controlled. Pass safe_mode=True to reject unsafe layers at load time (safe_mode defaults to True
    since Keras 2.13 but the kwarg does not exist in earlier versions, so upgrading matters as much as passing it explicitly).
    The model-file scanner (MFV-KERAS-001) independently flags Lambda layers found inside .h5/.keras archives.
  patterns:
  - pattern-either:
    - pattern-regex: keras\.models\.load_model\(
    - pattern-regex: tf\.keras\.models\.load_model\(
    - pattern-regex: keras\.saving\.load_model\(
  - pattern-not-regex: (?m)^\s*#
  - pattern-not-regex: (?:def test_|conftest|unittest)
  - pattern-not-regex: safe_mode\s*=\s*False
  metadata:
    category: deserialization
    cwe:
    - 94
    - 502
    original_engine: neuroscan
    source_rule: AI031
    residual:
    - sanitizer
- id: ns-aiml-115
  languages:
  - python
  severity: ERROR
  message: keras.models.load_model(..., safe_mode=False) explicitly disables the Lambda-layer/unsafe-deserialization safety
    check, allowing arbitrary code execution on load (CVE-2024-3660).
  patterns:
  - pattern-either:
    - pattern-regex: keras\.models\.load_model\([^)]*safe_mode\s*=\s*False
    - pattern-regex: tf\.keras\.models\.load_model\([^)]*safe_mode\s*=\s*False
    - pattern-regex: keras\.saving\.load_model\([^)]*safe_mode\s*=\s*False
  - pattern-not-regex: (?m)^\s*#
  - pattern-not-regex: (?:def test_|conftest|unittest)
