    - pattern-regex: (?i)@\w*\.(?:sampling_callback|on_sampling_message)\b
  - pattern-not-regex: (?m)^\s*#
  - pattern-not-regex: (?:def test_|conftest|unittest)
  metadata:
    category: auth
    cwe:
    - 862
    original_engine: neuroscan
    rule_name: MCP sampling request auto-approved without human gate
    source_rule: ns-aiml-067
