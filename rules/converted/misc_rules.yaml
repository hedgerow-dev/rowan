- id: ns-bb-017
  languages:
  - python
  severity: ERROR
  message: 'A container is created through the Docker SDK with none of the options

    that would actually isolate it. With no network_mode the container joins

    the default bridge and has full outbound network access; with no user it

    runs as whatever the image''s default is, usually root; with no cap_drop

    or security_opt it keeps the default capability set; with no mem_limit or

    pids_limit it can exhaust the host.


    This matters most when the container is the sandbox for untrusted or

    model-generated code. A bind-mounted host directory is then writable by

    that code, which turns "run this snippet in a container" into a host file

    write, and full egress turns it into an exfiltration and SSRF path to the

    cloud metadata service.


    Any one isolation option present in the surrounding lines suppresses this

    finding, on the assumption that an author who set one considered the

    others. The rule flags the case where none was set at all.'
  patterns:
  - pattern-regex: \.containers\.(?:run|create)\s*[(,]
  - pattern-not-regex: (?m)^\s*#
  - pattern-not-regex: (?:def test_|conftest|unittest)
  metadata:
    category: config
    cwe:
    - 653
    original_engine: neuroscan
    rule_name: Docker SDK container created with no isolation options
    fix: 'Pass explicit isolation options when creating the container: network_mode=''none'' (or an internal network), user=
      a non-root uid, cap_drop=[''ALL''], security_opt=[''no-new-privileges''], plus mem_limit and pids_limit. Mount the work
      directory read-only where the workload does not need to write.'
    residual:
    - sanitizer
  paths:
    exclude:
    - /tests/
    - /test/
    - integration-tests/
    - load_tests/
    - _tests/
    - conftest.py
- id: ns-bb-018
  languages:
  - csharp
  - go
  - java
  - javascript
  - python
  - typescript
  severity: WARNING
  message: 'An error returned to a caller names the identifier of a *different*

    principal: the one that already holds the contested resource. The caller

    learns an identifier they had no way to obtain, and identifiers are often

    the only thing standing between an attacker and impersonation.


    This is the defect that turns an ordinary uniqueness check into an attack

    primitive. In AutoGen''s gRPC host, RegisterAgent replies "already

    registered with client <id>", and that id is exactly the value needed to

    hijack the victim''s connection, because the transport treats a

    self-asserted client id as identity.


    Reply with a generic conflict, and keep the incumbent identifier in the

    server-side log.'
  patterns:
  - pattern-either:
    - pattern-regex: (?i)f["'][^"']*\b(?:already|belongs to|owned by|registered to|in use by|taken by|assigned to)\b[^"']*\{[^}]*\b(?:existing|incumbent|current|previous|other|original)_[a-z_]*(?:user|client|owner|tenant|account|session|member|customer|principal)
    - pattern-regex: (?i)f["'][^"']*\{[^}]*\b(?:existing|incumbent|current|previous|other|original)_[a-z_]*(?:user|client|owner|tenant|account|session|member|customer|principal)[^}]*\}[^"']*\b(?:already|owns|holds|has
        it|is using)\b
  - pattern-not-regex: (?m)^\s*#
  - pattern-not-regex: (?:def test_|conftest|unittest)
  metadata:
    category: auth
    cwe:
    - 209
    original_engine: neuroscan
    rule_name: Another principal's identifier disclosed in a conflict error
    fix: Return a generic conflict message ('that name is already in use'). Never name the holder of the conflicting resource.
      Log the incumbent identifier server-side if operators need it.
    residual:
    - sanitizer
  paths:
    exclude:
    - /tests/
    - /test/
    - _tests/
    - conftest.py
- id: ns-bb-019
  languages:
  - csharp
  - go
  - java
  - javascript
  - python
  - typescript
  severity: WARNING
  message: 'An identity is read from a value the caller writes. gRPC metadata and HTTP

    headers are caller-controlled on any request that reaches the service

    directly, so an identifier taken from them is asserted, not proven. If it

    then keys session state, connection state, or an authorization decision,

    any peer can claim to be any other peer.


    AutoGen''s gRPC host does exactly this: worker identity is the `client-id`

    metadata header, with no verification anywhere, which is what makes agent

    spoofing and connection hijacking possible.


    This is a legitimate pattern only when an upstream gateway injects the

    header and the service is unreachable by any other route. That is a

    deployment property the code cannot express, so confirm it rather than

    assume it, and strip the header on ingress.'
  patterns:
  - pattern-either:
    - pattern-regex: (?i)metadata\s*(?:\.get\(|\[)\s*["'](?:client-id|user-id|tenant-id|account-id|on-behalf-of)["']
    - pattern-regex: (?i)headers\s*(?:\.get\(|\[)\s*["']x-(?:user|client|tenant|account|principal|remote[-_]user)[-_]?(?:id|name)?["']
  - pattern-not-regex: (?i)(?:headers|metadata)\s*\[\s*["'][^"']+["']\s*\]\s*=[^=]
  - pattern-not-regex: (?m)^\s*#
  - pattern-not-regex: (?:def test_|conftest|unittest)
  metadata:
    category: auth
    cwe:
    - 290
    original_engine: neuroscan
    rule_name: Caller-supplied header or metadata used as identity
    fix: Derive identity from a verified credential (a signed token, a mTLS peer certificate, or a session looked up server-side),
      not from a header the caller writes. If an upstream gateway injects the header, make the service reject the header when
      it arrives from anywhere else.
    residual:
    - sanitizer
  paths:
    exclude:
    - /tests/
    - /test/
    - _tests/
    - conftest.py
