  - pattern-either:
    - pattern-regex: traceback\.format_exc\(\)
    - pattern-regex: stack.*response
    - pattern-regex: e\.stack
    - pattern-regex: err\.stack
  - pattern-not-regex: (?:logger?|logging)\.[a-z]+\(
  - pattern-not-regex: log\.(?:error|warning|info|debug|exception)\(
  - pattern-not-regex: print\(
  - pattern-not-regex: if\s+(?:__?debug|DEBUG)\b
  - pattern-not-regex: sys\.exc_info\(
  - pattern-not-regex: (?m)^\s*#
  - pattern-not-regex: (?m)^\s*//.*
  - pattern-not-regex: (?:def test_|conftest|unittest)
  metadata:
    category: config
    cwe:
    - 209
    original_engine: neuroscan
    rule_name: Stack trace exposure in error response
- id: ns-grd-001
  languages:
  - python
  severity: WARNING
  message: 'Gradio share=True exposes the app publicly via tunnel. Combined with

    file upload or code execution, this is remotely exploitable.'
  patterns:
  - pattern-regex: \.launch\([^)]*share\s*=\s*True
  - pattern-not-regex: (?m)^\s*#
  - pattern-not-regex: (?:def test_|conftest|unittest)
  metadata:
    category: config
    cwe:
    - 668
    original_engine: neuroscan
    rule_name: Gradio share tunnel enabled
- id: ns-grd-002
  languages:
  - python
  severity: WARNING
  message: 'Gradio bound to 0.0.0.0 without authentication. Any network user

    can access the app. Add auth=("user", "pass") or use auth callbacks.'
  patterns:
  - pattern-regex: \.launch\([^)]*server_name\s*=\s*["']0\.0\.0\.0["']
  - pattern-not-regex: auth\s*=
  - pattern-not-regex: (?m)^\s*#
  - pattern-not-regex: (?:def test_|conftest|unittest)
  metadata:
    category: auth
    cwe:
    - 287
    original_engine: neuroscan
    rule_name: Gradio unauthenticated bind
- id: ns-grd-003
  languages:
  - python
  severity: ERROR
  message: 'Gradio file input without file_types restriction. Attackers can upload

    arbitrary files including pickle payloads. Set file_types=[".csv", ".txt"].'
  patterns:
  - pattern-either:
    - pattern-regex: gr\.File\s*\(
    - pattern-regex: gr\.UploadButton\s*\(
  - pattern-not-regex: file_types\s*=
  - pattern-not-regex: (?m)^\s*#
  - pattern-not-regex: (?:def test_|conftest|unittest)
  metadata:
    category: ai_ml
    cwe:
    - 434
    original_engine: neuroscan
    rule_name: Gradio file upload without validation
- id: ns-grd-004
  languages:
  - python
  severity: ERROR
  message: 'Gradio handler uses eval() or exec(). User input from the UI can

    reach these sinks. Refactor to avoid dynamic code execution.'
  patterns:
  - pattern-either:
    - pattern-regex: gr\.Interface\(.*eval
