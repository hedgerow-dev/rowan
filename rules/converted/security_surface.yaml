- id: NS-DESER-012
  languages:
  - python
  severity: ERROR
  message: ZMQ recv_pyobj() unpickles every frame it receives, so any peer that can reach the socket gets remote code execution.
    ZMQ has no authentication unless CURVE is configured. This is the shape of CVE-2026-3059 and CVE-2026-3060 in SGLang,
    where a broker bound to all interfaces unpickled received frames.
  patterns:
  - pattern-regex: \.recv_pyobj\(
  - pattern-not-regex: (?m)^\s*#
  - pattern-not-regex: (?:def test_|conftest|unittest)
  metadata:
    category: deserialization
    cwe:
    - 502
    original_engine: neuroscan
    fix: Send a safe format over the socket (recv_json, msgpack, protobuf) with a known schema; if pickle is unavoidable,
      enable CURVE auth and verify an HMAC over the frame before unpickling.
    residual:
    - sanitizer
- id: NS-DESER-013
  languages:
  - python
  severity: ERROR
  message: multiprocessing.connection.Listener on a network address accepts connections whose recv() unpickles whatever the
    peer sent, giving any peer that can connect remote code execution.
  patterns:
  - pattern-either:
    - pattern-regex: multiprocessing\.connection\.Listener\(\s*\(
    - pattern-regex: connection\.Listener\(\s*\(
    - pattern-regex: (?<![\w.])Listener\(\s*\(
  - pattern-not-regex: (?m)^\s*#
  - pattern-not-regex: (?:def test_|conftest|unittest)
  - pattern-not-regex: authkey
  metadata:
    category: deserialization
    cwe:
    - 502
    original_engine: neuroscan
    fix: Bind the Listener to a Unix socket or named pipe instead of a host/port tuple, and pass an authkey so unauthenticated
      peers cannot reach the unpickle.
    residual:
    - sanitizer
