- id: NS-PATH-008
  languages:
  - python
  severity: WARNING
  message: URL path built with str.format() and no encoding. A value substituted into a path template can contain ../ and
    walk out of the intended prefix, and URL libraries normalize the traversal away rather than rejecting it, so the request
    is sent to a different endpoint on the same host. Any credential the client is configured with (Authorization header,
    cookie, API key) is sent with it. Percent-encode each substituted segment (urllib.parse.quote with safe='') and reject
    segments containing '..' or '/'.
  patterns:
  - pattern-either:
    - pattern-regex: \.path\.format\(
    - pattern-regex: \bpath\s*=\s*(?!["'\s])[^=\n]*\.format\(
    - pattern-regex: \bendpoint\s*=\s*(?!["'\s])[^=\n]*\.format\(
  - pattern-not-regex: (?m)^\s*#
  - pattern-not-regex: (?:def test_|conftest|unittest)
  metadata:
    category: path_traversal
    cwe:
    - 22
    original_engine: neuroscan
    residual:
    - sanitizer
