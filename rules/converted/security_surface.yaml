- id: NS-CONFIG-101
  languages:
  - python
  severity: ERROR
  message: 'Web application debug / development mode is enabled (CWE-215). A running server with debug on exposes interactive
    stack traces, source snippets, config, and (Werkzeug/Flask) an evaluable console: remote code and full config disclosure.
    This fires on the debug flag being turned ON in code: Flask app.run(debug=True) / app.debug=True / app.config["DEBUG"]=True,
    Django DEBUG=True, FastAPI/Starlette/Tornado(debug=True), and DEBUG read from an environment variable with a TRUTHY default
    (a fail-open default that ships debug on unless the environment overrides it). Set debug off in production and make any
    env-var default fail closed (default False / "0").'
