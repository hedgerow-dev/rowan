rules:
- id: ns-fw-js-002
  languages:
  - javascript
  - typescript
  severity: WARNING
  message: CORS configured with wildcard origin (*). Restrict to specific trusted domains.
  patterns:
  - pattern-either:
    - pattern-regex: cors\(.*origin.*\*
    - pattern-regex: Access-Control-Allow-Origin.*\*
  - pattern-not-regex: (?m)^\s*#
  - pattern-not-regex: (?m)^\s*//.*
  - pattern-not-regex: (?:def test_|conftest|unittest)
  metadata:
    category: config
    cwe:
    - 942
    original_engine: neuroscan
    rule_name: CORS wildcard origin
- id: ns-fw-java-003
  languages:
  - java
  severity: ERROR
  message: 'Spring Actuator endpoints exposed (env, heapdump, etc.).

    Restrict exposure to health and info only. Protect with authentication.'
  patterns:
  - pattern-either:
    - pattern-regex: management\.endpoints\.web\.exposure\.include\s*=\s*\*
    - pattern-regex: management\.endpoints\.web\.exposure\.include\s*=\s*.*\benv\b
    - pattern-regex: management\.endpoints\.web\.exposure\.include\s*=\s*.*\bheapdump\b
    - pattern-regex: /actuator/env\b
    - pattern-regex: /actuator/heapdump\b
  - pattern-not-regex: (?m)^\s*#
  - pattern-not-regex: (?m)^\s*//.*
  - pattern-not-regex: (?:def test_|conftest|unittest)
  metadata:
    category: config
    cwe:
    - 200
    original_engine: neuroscan
    rule_name: Spring Actuator endpoints exposed
- id: ns-fw-go-002
  languages:
  - go
  severity: WARNING
  message: CORS allows all origins. Restrict AllowOrigins to specific trusted domains.
  patterns:
  - pattern-either:
    - pattern-regex: AllowAllOrigins\s*:\s*true
    - pattern-regex: AllowOrigins\s*:\s*\[.*\*
  - pattern-not-regex: (?m)^\s*#
  - pattern-not-regex: (?m)^\s*//.*
  - pattern-not-regex: (?:def test_|conftest|unittest)
  metadata:
    category: config
    cwe:
    - 942
    original_engine: neuroscan
    rule_name: Go CORS wildcard
- id: ns-fw-go-003
  languages:
  - go
  severity: ERROR
  message: 'User input from Query/Param injected directly into HTML template rendering.

    Sanitize input before passing to template context.'
  patterns:
  - pattern-regex: c\.HTML\(.*c\.(?:Query|Param)\(
  - pattern-not-regex: (?m)^\s*#
  - pattern-not-regex: (?m)^\s*//.*
  - pattern-not-regex: (?:def test_|conftest|unittest)
  metadata:
    category: xss
    cwe:
    - 79
    original_engine: neuroscan
    rule_name: Go HTML template injection
    residual:
    - sanitizer
- id: ns-fw-go-005
  languages:
  - go
  severity: WARNING
  message: 'Redirect target from user input enables open redirect attacks.

    Validate redirect URLs against an allowlist of trusted destinations.'
  patterns:
  - pattern-regex: c\.Redirect\(.*c\.(?:Query|Param)\(
  - pattern-not-regex: (?m)^\s*#
  - pattern-not-regex: (?m)^\s*//.*
  - pattern-not-regex: (?:def test_|conftest|unittest)
  metadata:
    category: injection
    cwe:
    - 601
    original_engine: neuroscan
    rule_name: Go open redirect
    residual:
    - sanitizer
