rules:
- id: ns-fw-js-002
  languages:
  - javascript
  - typescript
  severity: WARNING
  message: CORS configured with wildcard origin (*). Restrict to specific trusted domains.
  patterns:
  - pattern-either:
    - pattern-regex: cors\(.*origin.*\*
    - pattern-regex: Access-Control-Allow-Origin.*\*
  - pattern-not-regex: (?m)^\s*#
  - pattern-not-regex: (?m)^\s*//.*
  - pattern-not-regex: (?:def test_|conftest|unittest)
  metadata:
    category: config
    cwe:
    - 942
    original_engine: neuroscan
    rule_name: CORS wildcard origin
- id: ns-fw-java-001
  languages:
  - java
  severity: ERROR
  message: 'CSRF protection explicitly disabled in Spring Security configuration.

    Only disable for stateless API endpoints using token-based auth.'
  patterns:
  - pattern-either:
    - pattern-regex: \.csrf\(\)\.disable\(\)
    - pattern-regex: csrf\s*:\s*false
  - pattern-not-regex: (?m)^\s*#
  - pattern-not-regex: (?m)^\s*//.*
  - pattern-not-regex: (?:def test_|conftest|unittest)
  metadata:
    category: auth
    cwe:
    - 352
    original_engine: neuroscan
    rule_name: Spring CSRF disabled
- id: ns-fw-java-002
  languages:
  - java
  severity: WARNING
  message: 'permitAll() grants unauthenticated access. Verify this is intentional

    and does not expose admin or sensitive endpoints.'
  patterns:
  - pattern-regex: \.permitAll\(\)
  - pattern-not-regex: (?m)^\s*#
  - pattern-not-regex: (?m)^\s*//.*
  - pattern-not-regex: (?:def test_|conftest|unittest)
  metadata:
    category: auth
    cwe:
    - 862
    original_engine: neuroscan
    rule_name: Spring permitAll on sensitive endpoint
- id: ns-fw-java-003
  languages:
  - java
  severity: ERROR
  message: 'Spring Actuator endpoints exposed (env, heapdump, etc.).

    Restrict exposure to health and info only. Protect with authentication.'
  patterns:
  - pattern-either:
    - pattern-regex: management\.endpoints\.web\.exposure\.include\s*=\s*\*
    - pattern-regex: management\.endpoints\.web\.exposure\.include\s*=\s*.*\benv\b
    - pattern-regex: management\.endpoints\.web\.exposure\.include\s*=\s*.*\bheapdump\b
    - pattern-regex: /actuator/env\b
    - pattern-regex: /actuator/heapdump\b
  - pattern-not-regex: (?m)^\s*#
  - pattern-not-regex: (?m)^\s*//.*
  - pattern-not-regex: (?:def test_|conftest|unittest)
  metadata:
    category: config
    cwe:
    - 200
    original_engine: neuroscan
    rule_name: Spring Actuator endpoints exposed
- id: ns-fw-java-004
  languages:
  - java
  severity: ERROR
  message: 'Spring Expression Language (SpEL) parsing detected. If user input reaches

    parseExpression(), RCE is possible. Use SimpleEvaluationContext with restricted types.'
  patterns:
  - pattern-either:
    - pattern-regex: parseExpression\(
    - pattern-regex: SimpleEvaluationContext
  - pattern-not-regex: (?m)^\s*#
  - pattern-not-regex: (?m)^\s*//.*
  - pattern-not-regex: (?:def test_|conftest|unittest)
  metadata:
    category: injection
    cwe:
    - 917
    original_engine: neuroscan
    rule_name: Spring SpEL injection
    residual:
    - sanitizer
- id: ns-fw-cs-001
  languages:
  - csharp
  severity: WARNING
  message: 'State-changing HTTP endpoint without [Authorize] attribute.

    Add [Authorize] to restrict access to authenticated users.'
  patterns:
  - pattern-either:
    - pattern-regex: \[HttpPost\]
    - pattern-regex: \[HttpPut\]
    - pattern-regex: \[HttpDelete\]
  - pattern-not-regex: \[Authorize
  - pattern-not-regex: (?m)^\s*#
  - pattern-not-regex: (?m)^\s*//.*
  - pattern-not-regex: (?:def test_|conftest|unittest)
  metadata:
    category: auth
    cwe:
    - 862
    original_engine: neuroscan
    rule_name: ASP.NET missing Authorize attribute
- id: ns-fw-cs-002
  languages:
  - csharp
  severity: WARNING
  message: 'CORS allows any origin with credentials. This is a browser security violation

    and exposes authenticated endpoints to any site.'
  patterns:
  - pattern-either:
    - pattern-regex: \.AllowAnyOrigin\(\)
    - pattern-regex: \.AllowCredentials\(\)
  - pattern-not-regex: (?m)^\s*#
  - pattern-not-regex: (?m)^\s*//.*
  - pattern-not-regex: (?:def test_|conftest|unittest)
  metadata:
    category: config
    cwe:
    - 942
    original_engine: neuroscan
    rule_name: ASP.NET CORS any origin with credentials
- id: ns-fw-cs-004
  languages:
  - csharp
  severity: WARNING
  message: POST endpoint should use [ValidateAntiForgeryToken] for CSRF protection.
  patterns:
  - pattern-either:
    - pattern-regex: \[HttpPost\]
    - pattern-regex: \[ValidateAntiForgeryToken\]
  - pattern-not-regex: \[ValidateAntiForgeryToken\]
  - pattern-not-regex: (?m)^\s*#
  - pattern-not-regex: (?m)^\s*//.*
  - pattern-not-regex: (?:def test_|conftest|unittest)
  metadata:
    category: auth
    cwe:
    - 352
    original_engine: neuroscan
    rule_name: ASP.NET missing anti-forgery token
- id: ns-fw-cs-005
  languages:
  - csharp
  severity: ERROR
  message: 'UseDeveloperExceptionPage() exposes stack traces and source code.

    Only enable in Development environment behind env.IsDevelopment() check.'
  patterns:
  - pattern-regex: UseDeveloperExceptionPage\(\)
  - pattern-not-regex: (?m)^\s*#
  - pattern-not-regex: (?m)^\s*//.*
  - pattern-not-regex: (?:def test_|conftest|unittest)
  metadata:
    category: config
    cwe:
    - 209
    original_engine: neuroscan
    rule_name: ASP.NET developer exception page in production
- id: ns-fw-go-002
  languages:
  - go
  severity: WARNING
  message: CORS allows all origins. Restrict AllowOrigins to specific trusted domains.
  patterns:
  - pattern-either:
    - pattern-regex: AllowAllOrigins\s*:\s*true
    - pattern-regex: AllowOrigins\s*:\s*\[.*\*
  - pattern-not-regex: (?m)^\s*#
  - pattern-not-regex: (?m)^\s*//.*
  - pattern-not-regex: (?:def test_|conftest|unittest)
  metadata:
    category: config
    cwe:
    - 942
    original_engine: neuroscan
    rule_name: Go CORS wildcard
- id: ns-fw-go-003
  languages:
  - go
  severity: ERROR
  message: 'User input from Query/Param injected directly into HTML template rendering.

    Sanitize input before passing to template context.'
  patterns:
  - pattern-regex: c\.HTML\(.*c\.(?:Query|Param)\(
  - pattern-not-regex: (?m)^\s*#
  - pattern-not-regex: (?m)^\s*//.*
  - pattern-not-regex: (?:def test_|conftest|unittest)
  metadata:
    category: xss
    cwe:
    - 79
    original_engine: neuroscan
    rule_name: Go HTML template injection
    residual:
    - sanitizer
- id: ns-fw-go-005
  languages:
  - go
  severity: WARNING
  message: 'Redirect target from user input enables open redirect attacks.

    Validate redirect URLs against an allowlist of trusted destinations.'
  patterns:
  - pattern-regex: c\.Redirect\(.*c\.(?:Query|Param)\(
  - pattern-not-regex: (?m)^\s*#
  - pattern-not-regex: (?m)^\s*//.*
  - pattern-not-regex: (?:def test_|conftest|unittest)
  metadata:
    category: injection
    cwe:
    - 601
    original_engine: neuroscan
    rule_name: Go open redirect
    residual:
    - sanitizer
