rules:
- id: ns-websec-598-001
  languages:
  - python
  severity: WARNING
  message: A credential-shaped URL query parameter (token/access_token/api_key/...) is read directly from the query string.
    Query strings are logged by web servers and proxies, sent to third-party origins via the Referer header on any outbound
    request the page makes, and persist in browser history -- all leak the credential outside the TLS-protected request body.
    Accept the same credential via the Authorization header (or a POST body) instead.
  patterns:
  - pattern-either:
    - pattern-regex: request\.args\.get\(\s*["'](?:token|access_token|auth_token|api_key|apikey|session_token|bearer_token|id_token|refresh_token)["']
    - pattern-regex: request\.args\[\s*["'](?:token|access_token|auth_token|api_key|apikey|session_token|bearer_token|id_token|refresh_token)["']\s*\]
    - pattern-regex: request\.GET\.get\(\s*["'](?:token|access_token|auth_token|api_key|apikey|session_token|bearer_token|id_token|refresh_token)["']
    - pattern-regex: request\.GET\[\s*["'](?:token|access_token|auth_token|api_key|apikey|session_token|bearer_token|id_token|refresh_token)["']\s*\]
    - pattern-regex: request\.(?:query_params|values)\.get\(\s*["'](?:token|access_token|auth_token|api_key|apikey|session_token|bearer_token|id_token|refresh_token)["']
    - pattern-regex: request\.(?:query_params|values)\[\s*["'](?:token|access_token|auth_token|api_key|apikey|session_token|bearer_token|id_token|refresh_token)["']\s*\]
  - pattern-not-regex: (?m)^\s*#
  - pattern-not-regex: (?:def test_|conftest|unittest)
  metadata:
    category: auth
    cwe:
    - 598
    original_engine: neuroscan
    fix: 'Accept the credential only via the Authorization header (e.g. `Authorization: Bearer <token>`) or a POST body. If
      a query-string fallback is required for legacy clients, log a deprecation warning and strip it from any URL that is
      echoed back, redirected to, or logged verbatim.'
- id: ns-websec-611-001
  languages:
  - python
  severity: ERROR
  message: 'lxml XMLParser explicitly re-enables entity resolution (resolve_entities=True) and/or network access during DTD/entity
    resolution (no_network=False). This overrides lxml''s safe-by-default parser configuration and reopens classic XXE: local
    file disclosure via an internal/external entity, or SSRF via a network-fetched entity/DTD.'
  patterns:
  - pattern-regex: (?:lxml\.)?etree\.XMLParser\([^)]{0,300}?(?:resolve_entities\s*=\s*True|no_network\s*=\s*False)
  - pattern-not-regex: (?m)^\s*#
  - pattern-not-regex: (?:def test_|conftest|unittest)
  metadata:
    category: deserialization
    cwe:
    - 611
    original_engine: neuroscan
    fix: Do not set resolve_entities=True or no_network=False on an XMLParser used for untrusted input. Use the default XMLParser()
      (or explicitly resolve_entities=False, no_network=True, load_dtd=False), or switch to defusedxml.lxml.parse()/fromstring().
    residual:
    - sanitizer
- id: ns-websec-276-001
  languages:
  - python
  severity: WARNING
  message: Permissions are set to grant write access to every local account. Any user on the host can replace this file's
    contents -- if it holds code, configuration, or key material that the application later reads or executes, that is local
    privilege escalation into the service's identity. Grant the owner (0o700 for a directory, 0o600 for a file), or a dedicated
    group, and nothing wider.
  patterns:
  - pattern-either:
    - pattern-regex: (?:os|shutil)\.(?:chmod|fchmod|lchmod)\s*\((?:[^(),\n]|\([^()\n]*\))+,\s*0o?[02-7]?[0-7][0-7][2367]\s*[),]
    - pattern-regex: \.chmod\s*\(\s*0o?[02-7]?[0-7][0-7][2367]\s*[),]
    - pattern-regex: os\.umask\s*\(\s*0+\s*\)
  - pattern-not-regex: (?m)^\s*#
  metadata:
    category: config
    cwe:
    - 276
    - 732
    original_engine: neuroscan
    fix: Use 0o700 for a directory and 0o600 for a file the service alone needs, or 0o750/0o640 with a dedicated group for
      shared read access. If multiple accounts genuinely must write, give them a shared group rather than granting world write.
      Replace `os.umask(0)` with `os.umask(0o077)`.
  paths:
    exclude:
    - /tests/
    - /test/
    - test_*.py
    - '*_test.py'
    - conftest.py
