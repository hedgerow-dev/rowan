  # ── Unbounded generation parameters (OWASP LLM10:2025, "denial of
  # wallet") ──────────────────────────────────────────────────────
  # GitHub issue #139. Request-derived data flowing straight into
  # max_tokens/n/best_of/max_completion_tokens lets an attacker multiply
  # the victim's per-request bill (n=128 fans out 128 completions;
  # max_tokens=<model max> maximizes each one's cost) or exhaust a shared
  # rate/token budget other tenants depend on. Unlike TNT-ML-002's
  # "generation parameters" note (prompt injection via parameter choice),
  # this is specifically the resource-consumption angle: the attacker
  # doesn't need to influence prompt content at all, only the numeric
  # knobs.
  #
  # Sanitizer note (DEF-5 sanitizer-specificity review, see
  # docs/taint-sanitizer-audit.md): int()/float() casting is deliberately
  # NOT listed as a sanitizer here, unlike Category.INJECTION's default
  # sanitizer set. int(request.json["n"]) still lets the attacker choose
  # any integer value -- the type coercion narrows the syntax (no SQLi/
  # command-injection metacharacters survive) but does nothing to bound
  # the *magnitude*, which is the actual threat for a spend/fan-out
  # control. This inverts the usual numeric-cast sanitizer logic, so this
  # rule intentionally does not rely on Category.INJECTION's shared
  # sanitizer set and instead declares its own: only a genuine upper-bound
  # clamp neutralizes the risk -- `$X = min($X, ...)` (verified empirically
  # against the opengrep binary: the sanitizer must match the *reassignment*
  # shape, `$X = min(...)`, not `$X = min($X, ...)` literally, since a
  # value is usually wrapped first, e.g. `n = min(int(n), 128)` -- a bare
  # `$X = min($X, ...)` pattern does NOT match through that int() wrapper)
  # or a Pydantic `Field(le=...)`/`conint(le=...)` upper-bound constraint.
  - id: TNT-ML-022
    mode: taint
    message: |
      User-controlled value flows into a generation-parameter kwarg
      (max_tokens / n / best_of / max_completion_tokens) of a completion
      API call. OWASP LLM10:2025 Unbounded Consumption ("denial of
      wallet"): an attacker who controls n and/or max_tokens can multiply
      the cost of a single request (e.g. n=128 fans out 128 completions;
      a maximal max_tokens maximizes each one's token cost), running up
      the victim's API bill or exhausting a shared rate/token budget.
      int()/float() casting the value is NOT sufficient here -- it narrows
      syntax, not magnitude. Clamp to a fixed upper bound (min(n,
      MAX_N)) or enforce one with a Pydantic Field(le=...)/conint(le=...)
      constraint before it reaches the API call.
    severity: WARNING
    languages: [python]
    metadata:
      cwe: [400, 770]
      category: ai_ml
      fix: "Clamp user-supplied max_tokens/n/best_of/max_completion_tokens to a fixed upper bound (e.g. n = min(int(n), 4), max_tokens = min(int(max_tokens), 2048)) or declare them with a Pydantic Field(le=...)/conint(le=...) upper bound before passing them to the completion API. Never pass a request-derived value into these kwargs unclamped."
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: request.args.get(...)
              - pattern: request.args[...]
              - pattern: request.form.get(...)
              - pattern: request.form[...]
              - pattern: request.json.get(...)
              - pattern: request.json[...]
              - pattern: request.data
              - pattern: request.values.get(...)
              - pattern: request.cookies.get(...)
              - pattern: request.headers.get(...)
              - pattern: request.GET.get(...)
              - pattern: request.GET[...]
              - pattern: request.POST.get(...)
              - pattern: request.POST[...]
              - pattern: request.body
              - pattern: request.query_params
              - pattern: input(...)
              - pattern: kwargs.get(...)
              - pattern: $VAR = json.loads(...)
              - pattern: await request.json(...)
              - pattern: await request.form(...)
              - pattern: await request.body(...)
              - pattern: await websocket.recv(...)
              - pattern: await websocket.receive_text(...)
              - pattern: st.chat_input(...)
              - pattern: st.text_input(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: openai.ChatCompletion.create(..., max_tokens=$INPUT, ...)
              - pattern: openai.ChatCompletion.create(..., n=$INPUT, ...)
              - pattern: openai.ChatCompletion.create(..., best_of=$INPUT, ...)
              - pattern: openai.Completion.create(..., max_tokens=$INPUT, ...)
              - pattern: openai.Completion.create(..., n=$INPUT, ...)
              - pattern: openai.Completion.create(..., best_of=$INPUT, ...)
              - pattern: $CLIENT.chat.completions.create(..., max_tokens=$INPUT, ...)
              - pattern: $CLIENT.chat.completions.create(..., n=$INPUT, ...)
              - pattern: $CLIENT.chat.completions.create(..., best_of=$INPUT, ...)
              - pattern: $CLIENT.chat.completions.create(..., max_completion_tokens=$INPUT, ...)
              - pattern: $CLIENT.completions.create(..., max_tokens=$INPUT, ...)
              - pattern: $CLIENT.completions.create(..., n=$INPUT, ...)
              - pattern: $CLIENT.completions.create(..., best_of=$INPUT, ...)
              - pattern: $CLIENT.messages.create(..., max_tokens=$INPUT, ...)
              - pattern: litellm.completion(..., max_tokens=$INPUT, ...)
              - pattern: litellm.completion(..., n=$INPUT, ...)
              - pattern: litellm.acompletion(..., max_tokens=$INPUT, ...)
