# ML/AI-Specific Taint Rules: full dataflow from user input through ML pipelines to code execution.
# These use Opengrep's interprocedural taint engine (--taint-intrafile).
# Separated from generic web taint rules: these model ML framework internals.

rules:

  # ── Chat Template SSTI (CVE-2026-5760) ──────────────────────────
  - id: TNT-ML-001
    mode: taint
    message: |
      User-controlled data flows into Jinja2 chat template rendering.
      CVE-2026-5760: Malicious model metadata injected via chat_template
      can achieve SSTI -> RCE through Jinja2 without sandboxing.
    severity: ERROR
    languages: [python]
    metadata:
      cwe: [94, 1336]
      category: ssti
      fix: "Render chat templates in a sandboxed Jinja2 environment (jinja2.sandbox.SandboxedEnvironment); never render a template string sourced from model metadata directly."
    pattern-sources:
      # rowan-registry:begin source=web_request
      - patterns:
          - pattern-either:
              - pattern: request.args.get(...)
              - pattern: request.args[...]
              - pattern: request.form.get(...)
              - pattern: request.form[...]
              - pattern: request.json.get(...)
              - pattern: request.json[...]
              - pattern: request.data
              - pattern: request.stream
              - pattern: request.get_json(...)
              - pattern: request.values.get(...)
              - pattern: request.files.get(...)
              - pattern: request.cookies.get(...)
              - pattern: request.headers.get(...)
              - pattern: request.GET.get(...)
              - pattern: request.GET[...]
              - pattern: request.POST.get(...)
              - pattern: request.POST[...]
              - pattern: request.body
              - pattern: request.query_params
              - pattern: input(...)
              - pattern: sys.argv
              - pattern: os.environ[...]
              - pattern: os.getenv(...)
              - pattern: await request.json(...)
              - pattern: await request.form(...)
              - pattern: await request.body(...)
              - pattern: await websocket.recv(...)
              - pattern: await websocket.receive_text(...)
              - pattern: st.chat_input(...)
              - pattern: st.text_input(...)
              - pattern: st.file_uploader(...)
              - pattern: gr.File(...)
              - pattern: gr.UploadButton(...)
      # rowan-registry:end source=web_request

    # SSTI is a tainted TEMPLATE STRING, not tainted render arguments, so the
    # sink focuses on the template position. A bare `$T.render(...)` sink also
    # matched Django's `render(request, ...)` (Opengrep resolves the import to
    # `django.shortcuts.render`) and fired on every view in a Django app.
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $ENV.from_string($TEMPLATE)
              - pattern: Template($TEMPLATE)
              - pattern: jinja2.Template($TEMPLATE)
          - focus-metavariable: $TEMPLATE
    pattern-sanitizers:
      - patterns:
          - pattern-either:
              - pattern: SandboxedEnvironment(...)
              - pattern: jinja2.sandbox.SandboxedEnvironment(...)

  # ── HuggingFace pipeline taint ──────────────────────────────────
  - id: TNT-ML-002
    mode: taint
    message: |
      User input flows through HuggingFace pipeline to model output.
      Prompt injection through the pipeline: attacker controls system
      prompt or generation parameters via API input.
    severity: WARNING
    languages: [python]
    metadata:
      cwe: [94]
      category: prompt_injection
      fix: "Treat pipeline/model output as untrusted before using it in any downstream decision or rendering; do not feed it back into another prompt without validation."
    pattern-sources:
      # rowan-registry:begin source=user_input
      - patterns:
          - pattern-either:
              - pattern: request.args.get(...)
              - pattern: request.args[...]
              - pattern: request.form.get(...)
              - pattern: request.form[...]
              - pattern: request.json.get(...)
              - pattern: request.json[...]
              - pattern: request.data
              - pattern: request.stream
              - pattern: request.get_json(...)
              - pattern: request.values.get(...)
              - pattern: request.files.get(...)
              - pattern: request.cookies.get(...)
              - pattern: request.headers.get(...)
              - pattern: request.GET.get(...)
              - pattern: request.GET[...]
              - pattern: request.POST.get(...)
              - pattern: request.POST[...]
              - pattern: request.body
              - pattern: request.query_params
              - pattern: input(...)
              - pattern: await request.json(...)
              - pattern: await request.form(...)
              - pattern: await request.body(...)
              - pattern: await websocket.recv(...)
              - pattern: await websocket.receive_text(...)
              - pattern: st.chat_input(...)
              - pattern: st.text_input(...)
              - pattern: st.file_uploader(...)
              - pattern: gr.File(...)
              - pattern: gr.UploadButton(...)
      # rowan-registry:end source=user_input
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: pipeline($TASK, ...)
              - pattern: transformers.pipeline($TASK, ...)
              - pattern: $MODEL.generate($INPUT, ...)

  # ── OmegaConf config injection taint ────────────────────────────
  - id: TNT-ML-003
    mode: taint
    message: |
      User input reaches OmegaConf.merge(): config injection.
      Attacker-controlled YAML can override application config,
      including model paths, trust_remote_code, and execution settings.
    severity: WARNING
    languages: [python]
    metadata:
      cwe: [94]
      category: ai_ml
      fix: "Validate merged config values before use, or restrict OmegaConf.merge() to trusted sources; use OmegaConf.structured() for a typed schema instead of accepting arbitrary keys."
    pattern-sources:
      # rowan-registry:begin source=user_input
      - patterns:
          - pattern-either:
              - pattern: request.args.get(...)
              - pattern: request.args[...]
              - pattern: request.form.get(...)
              - pattern: request.form[...]
              - pattern: request.json.get(...)
              - pattern: request.json[...]
              - pattern: request.data
              - pattern: request.stream
              - pattern: request.get_json(...)
              - pattern: request.values.get(...)
              - pattern: request.files.get(...)
              - pattern: request.cookies.get(...)
              - pattern: request.headers.get(...)
              - pattern: request.GET.get(...)
              - pattern: request.GET[...]
              - pattern: request.POST.get(...)
              - pattern: request.POST[...]
              - pattern: request.body
              - pattern: request.query_params
              - pattern: input(...)
              - pattern: await request.json(...)
              - pattern: await request.form(...)
              - pattern: await request.body(...)
              - pattern: await websocket.recv(...)
              - pattern: await websocket.receive_text(...)
              - pattern: st.chat_input(...)
              - pattern: st.text_input(...)
              - pattern: st.file_uploader(...)
              - pattern: gr.File(...)
              - pattern: gr.UploadButton(...)
      # rowan-registry:end source=user_input
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: OmegaConf.merge($BASE, $CONFIG)
              - pattern: OmegaConf.unsafe_merge($BASE, $CONFIG)
              - pattern: OmegaConf.load($CONFIG)
    pattern-sanitizers:
      - patterns:
          - pattern-either:
              - pattern: OmegaConf.structured(...)

  # ── Vector store / RAG taint ────────────────────────────────────
  - id: TNT-ML-004
    mode: taint
    message: |
      User input reaches vector store query. RAG poisoning:
      attacker-controlled query can manipulate similarity search
      results, leading to prompt injection in the LLM context.
    severity: WARNING
    languages: [python]
    metadata:
      cwe: [94]
      category: prompt_injection
      fix: "Treat retrieved vector-store documents as untrusted content in the prompt, not as instructions; keep them in a clearly delimited context section."
    pattern-sources:
      # rowan-registry:begin source=user_input
      - patterns:
          - pattern-either:
              - pattern: request.args.get(...)
              - pattern: request.args[...]
              - pattern: request.form.get(...)
              - pattern: request.form[...]
              - pattern: request.json.get(...)
              - pattern: request.json[...]
              - pattern: request.data
              - pattern: request.stream
              - pattern: request.get_json(...)
              - pattern: request.values.get(...)
              - pattern: request.files.get(...)
              - pattern: request.cookies.get(...)
              - pattern: request.headers.get(...)
              - pattern: request.GET.get(...)
              - pattern: request.GET[...]
              - pattern: request.POST.get(...)
              - pattern: request.POST[...]
              - pattern: request.body
              - pattern: request.query_params
              - pattern: input(...)
              - pattern: await request.json(...)
              - pattern: await request.form(...)
              - pattern: await request.body(...)
              - pattern: await websocket.recv(...)
              - pattern: await websocket.receive_text(...)
              - pattern: st.chat_input(...)
              - pattern: st.text_input(...)
              - pattern: st.file_uploader(...)
              - pattern: gr.File(...)
              - pattern: gr.UploadButton(...)
      # rowan-registry:end source=user_input
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $STORE.similarity_search($QUERY, ...)
              - pattern: $STORE.search($QUERY, ...)
              - pattern: $INDEX.query($QUERY, ...)
              - pattern: pinecone.Index(...).query($QUERY, ...)
              - pattern: chromadb.Collection(...).query($QUERY, ...)
              - pattern: |
                  weaviate.Client(...).query.get(...).with_near_text({"concepts": [$QUERY]})

  # ── Vector-store metadata filter injection (issue #138) ─────────
  # Distinct from TNT-ML-004 above: TNT-ML-004 models the query TEXT
  # (first positional arg) reaching a search call -- RAG poisoning via
  # what gets searched FOR. This rule models the FILTER/WHERE STRUCTURE
  # itself being attacker-influenced -- the NoSQL-injection of RAG
  # stacks: an attacker who controls the filter dict/string can widen it
  # to retrieve another tenant's chunks or bypass a document-level ACL,
  # regardless of what the query text is. The two rules can both fire on
  # the same call site (e.g. both $QUERY and $FILT tainted) without being
  # duplicates of each other.
  - id: TNT-ML-020
    mode: taint
    message: |
      A request-supplied value builds a vector-store filter/where
      expression (Pinecone `filter=`, Chroma `where=`, Qdrant
      `query_filter=`, Milvus `expr=`) with no visible validation in
      between. This is the NoSQL-injection of RAG stacks: unlike
      TNT-ML-004 (query TEXT taint), this is the FILTER STRUCTURE being
      attacker-controlled -- most sharply when the filter arrives via
      `json.loads()` of raw request data, which hands the attacker the
      whole key/operator structure, not just a value. An attacker can
      widen the filter to retrieve another tenant's chunks or bypass a
      document-level ACL (OWASP LLM08:2025 Vector and Embedding
      Weaknesses).
    severity: ERROR
    languages: [python]
    metadata:
      cwe: [74, 285]
      category: nosql_injection
      fix: "Never build a vector-store filter from raw request data, especially via json.loads() of user input (that hands over key/operator control, not just a value). Validate the filter through a Pydantic model with an explicit allowed-field/operator schema, or construct it server-side from trusted session state, e.g. filter={\"tenant\": {\"$eq\": g.tenant_id}}, namespace=g.tenant_id."
    # Engine note: a filter built as a dict LITERAL directly in the call,
    # with a request-derived value only in the *value* position (e.g.
    # filter={"tenant": {"$eq": request.args.get("q")}}) is, per the
    # issue's own FP-considerations section, meant to be a lower-risk
    # shape than json.loads(request...) handing over the whole structure.
    # That distinction isn't implemented as a pattern-sanitizer here: any
    # sanitizer pattern permissive enough to match "$KEY: {$OP: $VAL}"
    # would also match an attacker-controlled key/operator (e.g.
    # filter={request.json["key"]: {request.json["op"]: val}}), which
    # would be unsound -- a sanitizer must not itself only be checkable by
    # the same taint analysis it's trying to short-circuit. Accepted
    # false-positive gap (this rule will flag the value-only-tainted
    # dict-literal shape too), same class of documented engine-limitation
    # gap as TNT-ML-018's Letta note and ns-aiml-111's mem0 hint-word
    # note elsewhere in this corpus.
    pattern-sources:
      # rowan-registry:begin source=user_input
      - patterns:
          - pattern-either:
              - pattern: request.args.get(...)
              - pattern: request.args[...]
              - pattern: request.form.get(...)
              - pattern: request.form[...]
              - pattern: request.json.get(...)
              - pattern: request.json[...]
              - pattern: request.data
              - pattern: request.stream
              - pattern: request.get_json(...)
              - pattern: request.values.get(...)
              - pattern: request.files.get(...)
              - pattern: request.cookies.get(...)
              - pattern: request.headers.get(...)
              - pattern: request.GET.get(...)
              - pattern: request.GET[...]
              - pattern: request.POST.get(...)
              - pattern: request.POST[...]
              - pattern: request.body
              - pattern: request.query_params
              - pattern: input(...)
              - pattern: await request.json(...)
              - pattern: await request.form(...)
              - pattern: await request.body(...)
              - pattern: await websocket.recv(...)
              - pattern: await websocket.receive_text(...)
              - pattern: st.chat_input(...)
              - pattern: st.text_input(...)
              - pattern: st.file_uploader(...)
              - pattern: gr.File(...)
              - pattern: gr.UploadButton(...)
      # rowan-registry:end source=user_input
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $INDEX.query(..., filter=$FILT, ...)
              - patterns:
                  - pattern-either:
                      - pattern: $COLLECTION.query(..., where=$FILT, ...)
                      - pattern: $COLLECTION.get(..., where=$FILT, ...)
                  - metavariable-regex:
                      metavariable: $COLLECTION
                      regex: (?i).*(collection|chroma|coll).*
              - patterns:
                  - pattern-either:
                      - pattern: $CLIENT.search(..., query_filter=$FILT, ...)
                      - pattern: $CLIENT.query_points(..., query_filter=$FILT, ...)
                  - metavariable-regex:
                      metavariable: $CLIENT
                      regex: (?i).*(client|qdrant).*
              - patterns:
                  - pattern-either:
                      - pattern: $COLLECTION.search(..., expr=$FILT, ...)
                      - pattern: $COLLECTION.query(..., expr=$FILT, ...)
                  - metavariable-regex:
                      metavariable: $COLLECTION
                      regex: (?i).*(collection|milvus|coll).*
    pattern-sanitizers:
      - patterns:
          - pattern-either:
              - pattern: $MODEL.model_validate(...)
              - pattern: $MODEL.model_validate_json(...)
              - pattern: $MODEL.parse_obj(...)
              - pattern: $MODEL.parse_raw(...)

  # ── Weaviate GraphQL / where-filter injection (issue #138) ──────
  # Extends ns-aiml-017 (bare weaviate.Client() with no auth config,
  # rules/ai_ml_neuroscan.yaml) into injection territory: ns-aiml-017 is
  # auth-CONFIG-presence only, and says nothing about whether an
  # (authenticated) client's own query/filter is built from untrusted
  # data. This rule is the genuine extension the issue asks for, not a
  # duplicate.
  - id: TNT-ML-021
    mode: taint
    message: |
      A request-supplied value reaches a raw Weaviate GraphQL query
      (client.query.raw(...)) or a .with_where(...) filter built from
      untrusted data. Extends ns-aiml-017 (bare weaviate.Client() with no
      auth config) into injection territory: even an authenticated client
      is vulnerable if the GraphQL query string or where-filter is built
      from attacker-controlled data -- the attacker can rewrite the query
      to cross tenant/class boundaries or bypass a document-level ACL
      (OWASP LLM08:2025 Vector and Embedding Weaknesses).
    severity: ERROR
    languages: [python]
    metadata:
      cwe: [74, 285]
      category: injection
      fix: "Never interpolate request data directly into a raw GraphQL query string or a with_where() filter. Use Weaviate's parameterized query builder (.with_near_text()/.with_where() with a server-constructed, schema-validated filter dict) and scope every query to the caller's tenant via multi-tenancy (.with_tenant()), not string concatenation."
    pattern-sources:
      # rowan-registry:begin source=user_input
      - patterns:
          - pattern-either:
              - pattern: request.args.get(...)
              - pattern: request.args[...]
              - pattern: request.form.get(...)
              - pattern: request.form[...]
              - pattern: request.json.get(...)
              - pattern: request.json[...]
              - pattern: request.data
              - pattern: request.stream
              - pattern: request.get_json(...)
              - pattern: request.values.get(...)
              - pattern: request.files.get(...)
              - pattern: request.cookies.get(...)
              - pattern: request.headers.get(...)
              - pattern: request.GET.get(...)
              - pattern: request.GET[...]
              - pattern: request.POST.get(...)
              - pattern: request.POST[...]
              - pattern: request.body
              - pattern: request.query_params
              - pattern: input(...)
              - pattern: await request.json(...)
              - pattern: await request.form(...)
              - pattern: await request.body(...)
              - pattern: await websocket.recv(...)
              - pattern: await websocket.receive_text(...)
              - pattern: st.chat_input(...)
              - pattern: st.text_input(...)
              - pattern: st.file_uploader(...)
              - pattern: gr.File(...)
              - pattern: gr.UploadButton(...)
      # rowan-registry:end source=user_input
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $CLIENT.query.raw($QUERY)
              - pattern: $QUERY_BUILDER.with_where($FILT)
    pattern-sanitizers:
      - patterns:
          - pattern-either:
              - pattern: $MODEL.model_validate(...)
              - pattern: $MODEL.model_validate_json(...)
              - pattern: $MODEL.parse_obj(...)
              - pattern: $MODEL.parse_raw(...)

  # ── RediSearch / redisvl query-DSL injection (issue #292) ───────
  # CVE-2026-27022 class: a request-derived value is interpolated into a
  # RediSearch query STRING (the FT.SEARCH query language) rather than
  # passed as a bound/escaped filter, letting an attacker rewrite the
  # query to cross an index/tenant boundary or bypass a document-level
  # ACL. The CVE shipped in @langchain/langgraph-checkpoint-redis (JS), so
  # this rule is multi-language: redis-py / redisvl (Python) and
  # node-redis / ioredis (JS/TS) all expose the same DSL surface.
  #
  # Disjoint from TNT-ML-020/021 by construction (BACKLOG.md DEF-15/19
  # (file,line)-overlap method): those rules own the Pinecone `filter=`,
  # Chroma `where=`, Qdrant `query_filter=`, Milvus `expr=`, and Weaviate
  # `query.raw`/`with_where` sinks. This rule owns the RediSearch surface
  # only -- `.ft(...).search(...)`, node-redis `.ft.search`/`.ft.aggregate`,
  # the `FT.SEARCH`/`FT.AGGREGATE` raw command via
  # execute_command/call, and redisvl `FilterQuery(...)` construction --
  # none of which appears in TNT-ML-020/021, so a given (file,line) can be
  # claimed by at most one of the two families.
  #
  # No structured-vs-string discriminator is needed here (unlike
  # TNT-ML-027): the RediSearch query is *always* a DSL string, so any
  # tainted value reaching it is suspect. The safe path is a bound
  # parameter -- numeric coercion, or redisvl's escaping filter builder
  # (`Tag(field) == value` / `Num(field) == value` / `Text(field) % value`,
  # which escape the value) -- so those are the sanitizers.
  - id: TNT-ML-026
    mode: taint
    message: |
      A request-supplied value is interpolated into a RediSearch query
      string (the FT.SEARCH query DSL) and reaches a search/aggregate call
      -- redis-py `.ft(index).search(...)`, node-redis `.ft.search(...)`,
      a raw `FT.SEARCH`/`FT.AGGREGATE` command, or a redisvl
      `FilterQuery(...)` -- with no escaping or parameterization in
      between. CVE-2026-27022 class: unlike a bound filter value, an
      interpolated query string hands the attacker the query grammar
      itself, so they can rewrite the filter to cross an index/tenant
      boundary or bypass a document-level ACL (OWASP LLM08:2025 Vector and
      Embedding Weaknesses). Distinct from TNT-ML-004 (query TEXT taint /
      RAG poisoning): this is the filter STRUCTURE being attacker-built.
    severity: ERROR
    languages: [python, javascript, typescript]
    metadata:
      cwe: [74, 285]
      category: injection
      fix: "Never interpolate request data into a RediSearch query string. Pass the value as a bound, escaped filter -- redisvl's filter builder (Tag(field) == value, Num(field) == value) escapes it for you -- or numerically coerce it. Scope every search to the caller's tenant server-side, not via string concatenation."
    pattern-sources:
      - patterns:
          - pattern-either:
              # Python (Flask/FastAPI/Django) request inputs.
              # rowan-registry:begin source=http_request
              - patterns:
                  - pattern-either:
                      - pattern: request.args.get(...)
                      - pattern: request.args[...]
                      - pattern: request.form.get(...)
                      - pattern: request.form[...]
                      - pattern: request.json.get(...)
                      - pattern: request.json[...]
                      - pattern: request.data
                      - pattern: request.stream
                      - pattern: request.get_json(...)
                      - pattern: request.values.get(...)
                      - pattern: request.files.get(...)
                      - pattern: request.cookies.get(...)
                      - pattern: request.headers.get(...)
                      - pattern: request.GET.get(...)
                      - pattern: request.GET[...]
                      - pattern: request.POST.get(...)
                      - pattern: request.POST[...]
                      - pattern: request.body
                      - pattern: request.query_params
                      - pattern: await request.json(...)
                      - pattern: await request.form(...)
                      - pattern: await request.body(...)
                      - pattern: await websocket.recv(...)
                      - pattern: await websocket.receive_text(...)
              # rowan-registry:end source=http_request
              # JS/TS (Express/Koa) request inputs -- same set
              # rules/javascript_taint.yaml uses.
              - pattern: req.query
              - pattern: req.body
              - pattern: req.params
              - pattern: req.headers
              - pattern: request.query
              - pattern: request.params
              - pattern: ctx.query
              - pattern: ctx.request.body
              - pattern: ctx.params
              - pattern: ctx.headers
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $C.ft($IDX).search($Q)
              - pattern: $C.ft.search(...)
              - pattern: $C.ft.aggregate(...)
              - pattern: $C.execute_command("FT.SEARCH", ...)
              - pattern: $C.execute_command("FT.AGGREGATE", ...)
              - patterns:
                  - pattern: $C.call($CMD, ...)
                  - metavariable-regex:
                      metavariable: $CMD
                      regex: (?i)^["']FT\.(SEARCH|AGGREGATE)["']$
              - pattern: FilterQuery(...)
    pattern-sanitizers:
      - patterns:
          - pattern-either:
              - pattern: int(...)
              - pattern: float(...)
              - pattern: Number(...)
              - pattern: parseInt(...)
              - pattern: Tag(...) == $V
              - pattern: Tag(...) != $V
              - pattern: Num(...) == $V
              - pattern: Text(...) % $V
              - pattern: $MODEL.model_validate(...)
              - pattern: $MODEL.model_validate_json(...)

  # ── Pinecone / Qdrant metadata-filter STRING injection (issue #292) ──
  # Sibling of TNT-ML-020 (structured filter dict) and of TNT-ML-026
  # (RediSearch). TNT-ML-020 owns the Pinecone `.query(filter=)` /
  # Qdrant `.search(query_filter=)` sinks and, per its own engine note,
  # deliberately fires even on a value-only-tainted dict LITERAL. This
  # rule is the complementary, higher-precision case the issue asks for:
  # a request value CONCATENATED / f-STRINGED into a metadata-filter
  # *string* (the string-DSL form of a Pinecone/Qdrant filter), as opposed
  # to a structured dict with request values in its VALUES, which is the
  # safe path Pinecone/Qdrant intend and MUST NOT fire.
  #
  # Disjoint from TNT-ML-020/021 (BACKLOG.md DEF-15/19 (file,line) method):
  # this rule's sinks are the framework retrieval surface
  # (`.similarity_search(filter=)`, `.similarity_search_with_score(...)`,
  # `.max_marginal_relevance_search(...)`) plus Qdrant's
  # `scroll(scroll_filter=)` / `count(count_filter=)` -- none of which is a
  # TNT-ML-020 sink (020 owns `.query(filter=)`, `.query/get(where=)`,
  # `.search/query_points(query_filter=)`, `.search/query(expr=)`). So no
  # single (file,line) is reported by both families.
  #
  # The structured-vs-string discriminator is a positive string-shape gate
  # on the filter metavariable ($F must be an f-string / concatenation /
  # .format / % expression). A dict literal -- inline OR held in a variable
  # -- never matches that gate, so the "structured filter dict carrying
  # request values in its values" safe path never fires, which is the
  # precision guarantee this rule adds over TNT-ML-020.
  #
  # Engine-limitation note (empirically confirmed against opengrep
  # 1.22.0): this rule is python-only, NOT multi-language like TNT-ML-026.
  # A Python f-string pattern (`f"..."`) is not a valid JavaScript pattern
  # and makes the whole rule fail to parse under JS/TS; and a `{...}`
  # dict-exclusion silently over-subtracts under Python once JS/TS are
  # added to the same rule's `languages`. There is therefore no single
  # opengrep rule that is python+js+ts, catches Python f-strings, AND
  # excludes structured dicts. Soundness on Python (where Pinecone/Qdrant
  # metadata filters overwhelmingly live) is chosen over a broader language
  # list that would silently miss the dominant Python f-string idiom. The
  # JS/TS RediSearch DSL-injection case IS covered, by TNT-ML-026;
  # JS/TS Pinecone/Qdrant filter-string interpolation is an accepted
  # coverage gap, same class as the documented engine-limitation gaps on
  # TNT-ML-020 (value-tainted dict literal) and TNT-ML-018 elsewhere.
  - id: TNT-ML-027
    mode: taint
    message: |
      A request-supplied value is concatenated or f-stringed into a
      vector-store metadata-filter STRING (Pinecone / Qdrant / LangChain
      retriever `filter=`, or Qdrant `scroll_filter=` / `count_filter=`)
      rather than passed as a structured dict with bound values. Unlike a
      structured filter dict (the safe path Pinecone/Qdrant intend, which
      this rule deliberately does not flag), a filter string built from
      untrusted data hands the attacker the filter grammar, so they can
      widen it to retrieve another tenant's chunks or bypass a
      document-level ACL (OWASP LLM08:2025 Vector and Embedding
      Weaknesses). Complements TNT-ML-020 (structured filter-dict sinks):
      the sinks here are disjoint and the shape flagged is the string-DSL
      form specifically.
    severity: ERROR
    languages: [python]
    metadata:
      cwe: [74, 285]
      category: nosql_injection
      fix: "Never build a vector-store metadata filter by string concatenation/f-string from request data. Pass a structured filter dict with bound values (filter={\"tenant\": {\"$eq\": g.tenant_id}}), validated through a Pydantic model with an allowed-field schema, and scope it to the caller's tenant server-side."
    pattern-sources:
      # rowan-registry:begin source=user_input
      - patterns:
          - pattern-either:
              - pattern: request.args.get(...)
              - pattern: request.args[...]
              - pattern: request.form.get(...)
              - pattern: request.form[...]
              - pattern: request.json.get(...)
              - pattern: request.json[...]
              - pattern: request.data
              - pattern: request.stream
              - pattern: request.get_json(...)
              - pattern: request.values.get(...)
              - pattern: request.files.get(...)
              - pattern: request.cookies.get(...)
              - pattern: request.headers.get(...)
              - pattern: request.GET.get(...)
              - pattern: request.GET[...]
              - pattern: request.POST.get(...)
              - pattern: request.POST[...]
              - pattern: request.body
              - pattern: request.query_params
              - pattern: input(...)
              - pattern: await request.json(...)
              - pattern: await request.form(...)
              - pattern: await request.body(...)
              - pattern: await websocket.recv(...)
              - pattern: await websocket.receive_text(...)
              - pattern: st.chat_input(...)
              - pattern: st.text_input(...)
              - pattern: st.file_uploader(...)
              - pattern: gr.File(...)
              - pattern: gr.UploadButton(...)
      # rowan-registry:end source=user_input
    # The filter arg must be a string-DSL expression, either written inline at
    # the call OR held in a variable assigned such an expression above. A
    # structured dict (`filter={...}` or a dict-valued variable) matches none of
    # these forms, so the safe path still never fires.
    pattern-sinks:
      - patterns:
          - pattern-either:
              # Inline string-DSL filter at the call site.
              - patterns:
                  - pattern-either:
                      - pattern: $VS.similarity_search(..., filter=$F, ...)
                      - pattern: $VS.similarity_search_with_score(..., filter=$F, ...)
                      - pattern: $VS.max_marginal_relevance_search(..., filter=$F, ...)
                      - pattern: $C.scroll(..., scroll_filter=$F, ...)
                      - pattern: $C.count(..., count_filter=$F, ...)
                  - metavariable-pattern:
                      metavariable: $F
                      patterns:
                        - pattern-either:
                            - pattern: f"..."
                            - pattern: f'...'
                            - pattern: $A + $B
                            - pattern: $S.format(...)
                            - pattern: $S % $ARGS
              # Filter held in a variable assigned a string-DSL expression above.
              - patterns:
                  - pattern-either:
                      - pattern: $VS.similarity_search(..., filter=$F, ...)
                      - pattern: $VS.similarity_search_with_score(..., filter=$F, ...)
                      - pattern: $VS.max_marginal_relevance_search(..., filter=$F, ...)
                      - pattern: $C.scroll(..., scroll_filter=$F, ...)
                      - pattern: $C.count(..., count_filter=$F, ...)
                  - pattern-either:
                      - pattern-inside: |
                          $F = f"..."
                          ...
                      - pattern-inside: |
                          $F = $A + $B
                          ...
                      - pattern-inside: |
                          $F = $S.format(...)
                          ...
                      - pattern-inside: |
                          $F = $S % $ARGS
                          ...
    pattern-sanitizers:
      - patterns:
          - pattern-either:
              - pattern: $MODEL.model_validate(...)
              - pattern: $MODEL.model_validate_json(...)
              - pattern: $MODEL.parse_obj(...)
              - pattern: $MODEL.parse_raw(...)

