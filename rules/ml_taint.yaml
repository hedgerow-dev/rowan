              - pattern: conint(lt=$LIMIT, ...)

  # ── LangGraph checkpoint metadata-KEY SQL injection (CVE-2025-67644) ─
  # GitHub issue #290. A checkpoint/store saver builds a query from the
  # KEYS of an attacker-controlled metadata `filter` dict, not just the
  # values: `for k in filter: query += k` interpolates a request-supplied
  # column/operator name straight into the SQL string. This is the actual
  # CVE (CVSS 7.3) and chains with the msgpack object-hook bug
  # (TNT-DESER-007 / CVE-2026-28277) to RCE on self-hosted LangGraph.
  # Rowan's ns-aiml-024 (LangGraph saver without validation) is a
  # presence signal that does not model this key-based dataflow.
  #
  # Generality: the shape is not LangGraph-specific. Any store/saver that
  # iterates an untrusted filter's keys into a query has the bug, so the
  # rule fires on a plain DB cursor doing `for col in request-filter:
  # cur.execute(... + col + ...)` just as it does on a named
  # SqliteSaver/PostgresSaver. LangGraph savers are one instance, matched
  # by the checkpointer-API sink below; the raw key-loop sink covers the
  # rest.
  #
  # Disjointness vs. TNT-SQLI-001/002 (BACKLOG DEF-15/19 method, audited
  # by (file,line) overlap): the novelty here is a tainted filter KEY, not
  # a tainted value. The value-only shape `cur.execute("... '" + val +
  # "'")` is already owned by TNT-SQLI-* and MUST NOT be double-reported
  # here -- so the raw-execute sink is gated by `pattern-inside: for $K in
  # $FILTER:`, which a value-only execute (no key loop) never satisfies.
  # Verified empirically against the opengrep binary: the value-only
  # fixture fires TNT-SQLI-001/002 and NOT this rule. On the genuine
  # key-loop shape both this rule and TNT-SQLI may fire on the same line
  # (it is a real SQLi as well as a key-injection); that co-fire is the
  # intended value-add lens, not the value-only duplication DEF-19
  # eliminated, and is deduplicated at the pass layer, not here. The
  # checkpointer-API sink (`$SAVER.list(filter=...)`) has no execute at
  # all, so it never overlaps TNT-SQLI.
  #
  # Sanitizer: a per-key allow-list lookup that REASSIGNS the key
  # (`k = ALLOWED[k]`, which raises on an unlisted column) clears taint;
  # this is the reassignment-style shape this engine honors (a bare
  # `if k in ALLOWED:` guard clause would not -- see agent_taint.yaml's
  # header engine note). A parameterized query (`cur.execute(sql,
  # params)`, two-arg) is naturally not matched by the single-arg
  # `$CUR.execute($Q)` sink.
  - id: TNT-LG-001
    mode: taint
    message: |
      An attacker-controlled metadata/filter KEY is interpolated into a
      checkpoint-store query. CVE-2025-67644: LangGraph SQLite/Postgres
      checkpoint savers build queries from the KEYS of a request-supplied
      `filter` dict (`for k in filter: query += k`), not just the values,
      so an attacker who controls the filter keys achieves SQL injection.
      Distinct from value-based SQLi (TNT-SQLI-*): the injected token is a
      column/operator name, not a bound value. Chains with the msgpack
      object-hook deserialization bug (TNT-DESER-007) to RCE.
    severity: ERROR
    languages: [python]
    metadata:
      cwe: [89]
      category: nosql_injection
      fix: "Validate every filter/metadata key against an explicit allow-list of real column names before it reaches the query (e.g. k = ALLOWED_COLUMNS[k], which raises on an unlisted key), and pass values as bound parameters (cursor.execute(sql, params)). Never concatenate a caller-supplied dict key into a SQL string."
    pattern-sources:
      # rowan-registry:begin source=web_request
      - patterns:
          - pattern-either:
              - pattern: request.args.get(...)
              - pattern: request.args[...]
              - pattern: request.form.get(...)
              - pattern: request.form[...]
              - pattern: request.json.get(...)
              - pattern: request.json[...]
              - pattern: request.data
              - pattern: request.stream
              - pattern: request.get_json(...)
              - pattern: request.values.get(...)
              - pattern: request.files.get(...)
              - pattern: request.cookies.get(...)
              - pattern: request.headers.get(...)
              - pattern: request.GET.get(...)
              - pattern: request.GET[...]
              - pattern: request.POST.get(...)
              - pattern: request.POST[...]
              - pattern: request.body
              - pattern: request.query_params
              - pattern: input(...)
              - pattern: sys.argv
              - pattern: os.environ[...]
              - pattern: os.getenv(...)
              - pattern: await request.json(...)
              - pattern: await request.form(...)
              - pattern: await request.body(...)
              - pattern: await websocket.recv(...)
              - pattern: await websocket.receive_text(...)
              - pattern: st.chat_input(...)
              - pattern: st.text_input(...)
              - pattern: st.file_uploader(...)
              - pattern: gr.File(...)
              - pattern: gr.UploadButton(...)
      # rowan-registry:end source=web_request
    pattern-sinks:
      - patterns:
          - pattern-either:
              # Raw key-injection shape: an execute whose query was built by
              # iterating the tainted filter's keys. `pattern-inside` on the
              # key loop is what keeps this off the value-only shape that
              # TNT-SQLI-* already owns.
              - patterns:
                  - pattern: $CUR.execute($Q)
                  - pattern-inside: |
                      for $K in $FILTER:
                          ...
              # Checkpointer/store API consuming an untrusted filter. No
              # execute, so no overlap with TNT-SQLI-*; receiver constrained
              # to a saver/checkpoint/store-shaped name to avoid matching an
              # unrelated `.list(filter=...)` on some other object.
              - patterns:
                  - pattern-either:
                      - pattern: $SAVER.list(..., filter=$F, ...)
                      - pattern: $SAVER.alist(..., filter=$F, ...)
                      - pattern: $SAVER.search(..., filter=$F, ...)
                      - pattern: $SAVER.asearch(..., filter=$F, ...)
                  - metavariable-regex:
                      metavariable: $SAVER
                      regex: (?i).*(saver|checkpoint|store|memory).*
    pattern-sanitizers:
      - patterns:
          - pattern-either:
              - pattern: $K = $ALLOWLIST[$K]
              - pattern: $K = $ALLOWLIST.get($K)

  # ── Unsandboxed Jinja env SSTI, generalized beyond chat_template ──
  # SGLang CVE-2026-5760 class (also CVE-2025-61620 vLLM, CVE-2024-34359
  # "Llama Drama"): inference/serving code builds a plain jinja2.Environment
  # (not a SandboxedEnvironment) and renders ANY attacker-publishable model-
  # metadata field, not only chat_template. TNT-ML-008 already owns the
  # chat_template attribute reads (tokenizer.chat_template / self.chat_template /
  # tokenizer_config.get(...)); this rule broadens the *source* surface to the
  # other metadata fields (generation_config, adapter/LoRA config, AutoConfig/
  # AutoProcessor fields, hf_hub_download contents) via the registry's
  # `model_metadata` fragment, which deliberately omits the chat_template
  # patterns so the canonical chat_template flow keeps its TNT-ML-008
  # attribution. Sink adds `$ENV.from_string($T)`, which TNT-ML-008 (Template()/
  # .render() only) does not cover.
  #
  # Sanitizer note: the tainted value is the template STRING, so sandboxing the
  # env is orthogonal to that value's dataflow -- a bare `SandboxedEnvironment`
  # pattern-sanitizer (the shape TNT-ML-001/008 use) does NOT actually suppress
  # the safe case (verified empirically against opengrep 1.22.0). The working
  # form is to sanitize the from_string CALL when its receiver is a sandboxed
  # env: inline construction (`SandboxedEnvironment().from_string($T)`) and the
  # function-local assigned form (`env = ImmutableSandboxedEnvironment(); ...;
  # env.from_string($T)`) are both handled below. Known residual gap: an env
  # assigned to `self.env` in __init__ and used in a *different* method is not
  # correlated by opengrep's intrafile taint, so that cross-method sandboxed
  # shape is a documented false positive (same class of accepted engine-limit
  # gap as TNT-ML-020's filter-value note above).
  - id: TNT-ML-028
    mode: taint
    message: |
      Attacker-publishable model metadata (generation/tokenizer/adapter config,
      AutoConfig fields, Hub-downloaded file contents) flows into an unsandboxed
      Jinja2 render. CVE-2026-5760 (SGLang) class, generalized beyond
      chat_template: any model-metadata string rendered through
      jinja2.Environment().from_string(...).render() / Template(...).render()
      without a SandboxedEnvironment is SSTI -> RCE, since a malicious model can
      set the field to a template payload.
    severity: ERROR
    languages: [python]
    metadata:
      cwe: [94, 1336]
      category: ssti
      fix: "Render any model-metadata-sourced template in a sandboxed Jinja2 environment (jinja2.sandbox.ImmutableSandboxedEnvironment); never build a plain jinja2.Environment() and render a string taken from tokenizer/generation/adapter config or a downloaded model file."
    pattern-sources:
      # rowan-registry:begin source=model_metadata
      - patterns:
          - pattern-either:
              - pattern: AutoConfig.from_pretrained(...)
              - pattern: AutoProcessor.from_pretrained(...)
              - pattern: PretrainedConfig.from_pretrained(...)
              - pattern: hf_hub_download(...)
              - pattern: snapshot_download(...)
              - pattern: generation_config.get(...)
              - pattern: generation_config[...]
              - pattern: gen_config.get(...)
              - pattern: gen_config[...]
              - pattern: model_config.get(...)
              - pattern: model_config[...]
              - pattern: adapter_config.get(...)
              - pattern: adapter_config[...]
              - pattern: lora_config.get(...)
              - pattern: lora_config[...]
      # rowan-registry:end source=model_metadata
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $ENV.from_string($T)
              - pattern: jinja2.Template($T)
              - pattern: Template($T)
    pattern-sanitizers:
      # Function-local assigned sandboxed env: env = ImmutableSandboxedEnvironment(); env.from_string(t)
      - patterns:
          - pattern: $ENV.from_string($T)
          - pattern-inside: |
              $ENV = $SB(...)
              ...
          - metavariable-regex:
              metavariable: $SB
              regex: .*SandboxedEnvironment.*
      # Inline sandboxed construction: SandboxedEnvironment().from_string(t)
      - patterns:
          - pattern: $SB2(...).from_string($T)
          - metavariable-regex:
              metavariable: $SB2
              regex: .*SandboxedEnvironment.*

  # ── ML-specific sanitizers ───────────────────────────────────────
  # (Defined as pattern-sanitizers in other rules but documented here)
  # - safetensors.torch.load_file(...): safe alternative to torch.load
  # - jinja2.sandbox.SandboxedEnvironment: SSTI protection
  # - OmegaConf.structured(...): config schema validation
  # - shlex.quote(...): shell argument sanitization
  # - werkzeug.utils.secure_filename(...): file upload sanitization
  # - html.escape(...) / markupsafe.escape(...): XSS sanitization
  # - torch.load(..., weights_only=True): safe pickle alternative
  - id: TNT-ML-030
    mode: taint
    message: |
      User-controlled data flows into a training/fine-tuning dataset with
      no schema validation in between. Training-time compromise (label
      flipping, backdoor triggers, DPO/RLHF preference-data poisoning)
      survives every runtime control -- including the model's own
      guardrails -- because it is baked into the weights before the model
      is ever served.
    severity: ERROR
    languages: [python]
    metadata:
      cwe: [20, 829]
      category: supply_chain
      fix: "Validate every record against an explicit schema (a pydantic model's model_validate() or equivalent) before it reaches Dataset.from_*, a Trainer's train_dataset, or a fine-tune file upload -- never assume request/upload data is already well-formed training data."
    pattern-sources:
      # rowan-registry:begin source=user_input
      - patterns:
          - pattern-either:
              - pattern: request.args.get(...)
              - pattern: request.args[...]
              - pattern: request.form.get(...)
              - pattern: request.form[...]
              - pattern: request.json.get(...)
              - pattern: request.json[...]
              - pattern: request.data
              - pattern: request.stream
              - pattern: request.get_json(...)
              - pattern: request.values.get(...)
              - pattern: request.files.get(...)
              - pattern: request.cookies.get(...)
              - pattern: request.headers.get(...)
              - pattern: request.GET.get(...)
              - pattern: request.GET[...]
              - pattern: request.POST.get(...)
              - pattern: request.POST[...]
              - pattern: request.body
              - pattern: request.query_params
              - pattern: input(...)
              - pattern: await request.json(...)
              - pattern: await request.form(...)
              - pattern: await request.body(...)
              - pattern: await websocket.recv(...)
              - pattern: await websocket.receive_text(...)
              - pattern: st.chat_input(...)
              - pattern: st.text_input(...)
              - pattern: st.file_uploader(...)
              - pattern: gr.File(...)
              - pattern: gr.UploadButton(...)
      # rowan-registry:end source=user_input
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: Dataset.from_dict(...)
              - pattern: Dataset.from_list(...)
              - pattern: Dataset.from_pandas(...)
              - pattern: Dataset.from_generator(...)
              - pattern: datasets.concatenate_datasets(...)
              - pattern: Trainer(..., train_dataset=$DATA, ...)
              - pattern: DPOTrainer(..., train_dataset=$DATA, ...)
              - pattern: $CLIENT.fine_tuning.jobs.create(..., training_file=$DATA, ...)
              - pattern: openai.files.create(file=$DATA, purpose="fine-tune")
    pattern-sanitizers:
      - patterns:
          - pattern-either:
              - pattern: $DATA = $SCHEMA.model_validate($DATA)
              - pattern: $DATA = $SCHEMA.model_validate_json($DATA)
              - pattern: $DATA = $SCHEMA.parse_obj($DATA)
              - pattern: $DATA = $SCHEMA.parse_raw($DATA)

  # ── ML-specific sanitizers ───────────────────────────────────────
  # (Defined as pattern-sanitizers in other rules but documented here)
  # - safetensors.torch.load_file(...): safe alternative to torch.load
  # - jinja2.sandbox.SandboxedEnvironment: SSTI protection
  # - OmegaConf.structured(...): config schema validation
  # - shlex.quote(...): shell argument sanitization
  # - werkzeug.utils.secure_filename(...): file upload sanitization
  # - html.escape(...) / markupsafe.escape(...): XSS sanitization
  # - torch.load(..., weights_only=True): safe pickle alternative
  - id: TNT-ML-031
    mode: taint
    message: |
      Untrusted input is used as a semantic/response cache key that a
      later cache read serves back. Same threat model as ns-aiml-112's
      memory-insert case: an attacker who shapes one prompt seeds a cache
      entry a later lookup can hit, turning a one-shot injection into a
      persistent one. Modeled as the same same-function write-then-read
      shape TNT-PATH-003 uses -- the real exploit is cross-REQUEST (one
      caller's write, a different caller's later read), which a
      single-function taint engine cannot trace; this is a same-function
      proxy for that shape, the same honest limitation as every other
      cache/memory presence signal in this corpus.
    severity: WARNING
    languages: [python]
    metadata:
      cwe: [94, 349]
      category: prompt_injection
      fix: "Scope every cache key to the requesting user/session/tenant (see ns-aiml-152) -- an attacker's own poisoned entry then only ever serves back within that same scope, never cross-tenant."
    # Engine note: no pattern-propagators here. $CACHE.get($KEY) must be
    # metavariable-regex-constrained to receiver names containing "cache"
    # -- unconstrained, it collides with any other .get() method
    # (request.json.get(), a dict, an unrelated object), including the
    # SOURCE call itself (request.json.get('prompt') matches its own sink
    # pattern with $CACHE=request.json, $KEY='prompt' -- a reflexive false
    # positive with no cache read anywhere in the file, caught by this
    # rule's own negative test fixture). Verified empirically that
    # Opengrep's propagator `to:` binding does not compose with a
    # metavariable-regex-constrained sink: a cache.set($KEY, $VALUE) ->
    # from:$VALUE,to:$KEY propagator correctly taints $KEY against an
    # UNCONSTRAINED $CACHE.get($KEY) sink, but produces zero findings
    # against the identical sink once metavariable-regex is added --
    # reproduced in isolation, not a fixture bug. Accepted false-negative
    # gap: this rule only catches the KEY itself being tainted (the
    # dominant real shape -- the prompt IS the key), not "attacker
    # controls only the cached VALUE under an otherwise-benign key",
    # which plain intraprocedural taint (no propagator needed) already
    # covers when $KEY is directly source-derived.
    pattern-sources:
      # rowan-registry:begin source=user_input
      - patterns:
          - pattern-either:
              - pattern: request.args.get(...)
              - pattern: request.args[...]
              - pattern: request.form.get(...)
              - pattern: request.form[...]
              - pattern: request.json.get(...)
              - pattern: request.json[...]
              - pattern: request.data
              - pattern: request.stream
              - pattern: request.get_json(...)
              - pattern: request.values.get(...)
              - pattern: request.files.get(...)
              - pattern: request.cookies.get(...)
              - pattern: request.headers.get(...)
              - pattern: request.GET.get(...)
              - pattern: request.GET[...]
              - pattern: request.POST.get(...)
              - pattern: request.POST[...]
              - pattern: request.body
              - pattern: request.query_params
              - pattern: input(...)
              - pattern: await request.json(...)
              - pattern: await request.form(...)
              - pattern: await request.body(...)
              - pattern: await websocket.recv(...)
              - pattern: await websocket.receive_text(...)
              - pattern: st.chat_input(...)
              - pattern: st.text_input(...)
              - pattern: st.file_uploader(...)
              - pattern: gr.File(...)
              - pattern: gr.UploadButton(...)
      # rowan-registry:end source=user_input
    pattern-sinks:
      - patterns:
          - pattern: $CACHE.get($KEY)
          - metavariable-regex:
              metavariable: $CACHE
              regex: (?i).*cache.*

  # ── ML-specific sanitizers ───────────────────────────────────────
  # (Defined as pattern-sanitizers in other rules but documented here)
  # - safetensors.torch.load_file(...): safe alternative to torch.load
  # - jinja2.sandbox.SandboxedEnvironment: SSTI protection
  # - OmegaConf.structured(...): config schema validation
  # - shlex.quote(...): shell argument sanitization
  # - werkzeug.utils.secure_filename(...): file upload sanitization
  # - html.escape(...) / markupsafe.escape(...): XSS sanitization
  # - torch.load(..., weights_only=True): safe pickle alternative
  - id: TNT-ML-033
    mode: taint
    message: |
      Content extracted from an ingested document (OCR, PDF text layer,
      audio transcript, EXIF/XMP metadata, an Office/HTML loader) flows
      into a completion or agent call with no delimiter-fencing,
      moderation gate, structured-extraction schema, or
      prompt-injection classifier in between. Indirect prompt injection
      through documents is the dominant real-world delivery vector: the
      untrusted party is whoever authored the file being ingested, not
      necessarily the caller of this endpoint.
    severity: WARNING
    languages: [python]
    metadata:
      cwe: [94]
      category: prompt_injection
      fix: "Wrap ingested document content in an explicit delimiter the system prompt tells the model to treat as data, not instructions (e.g. an XML tag); run it through a moderation/prompt-injection classifier; or extract it into a strict structured schema before use."
    pattern-sources:
      - patterns:
          - pattern-either:
              # rowan-registry:begin source=document_ingest
              - patterns:
                  - pattern-either:
                      - pattern: pytesseract.image_to_string(...)
                      - pattern: $READER.readtext(...)
                      - pattern: $CLIENT.detect_document_text(...)
                      - pattern: $CLIENT.analyze_document(...)
                      - pattern: $VISION_CLIENT.text_detection(...)
                      - pattern: $VISION_CLIENT.document_text_detection(...)
                      - pattern: $PAGE.extract_text(...)
                      - pattern: $PDF.pages[...].extract_text(...)
                      - pattern: $PDF.extract_text(...)
                      - pattern: partition(...)
                      - pattern: partition_pdf(...)
                      - pattern: $IMG._getexif(...)
                      - pattern: $IMG.getexif(...)
                      - pattern: exifread.process_file(...)
                      - pattern: piexif.load(...)
                      - pattern: $MODEL.transcribe(...)
                      - pattern: $CLIENT.audio.transcriptions.create(...)
                      - pattern: $CLIENT.audio.translations.create(...)
                      - pattern: UnstructuredWordDocumentLoader(...).load(...)
                      - pattern: UnstructuredHTMLLoader(...).load(...)
                      - pattern: BSHTMLLoader(...).load(...)
                      - pattern: Docx2txtLoader(...).load(...)
                      - pattern: PyPDFLoader(...).load(...)
                      - pattern: UnstructuredExcelLoader(...).load(...)
              # rowan-registry:end source=document_ingest
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $CLIENT.chat.completions.create(...)
              - pattern: $CLIENT.completions.create(...)
              - pattern: $CLIENT.messages.create(...)
              - pattern: openai.ChatCompletion.create(...)
              - pattern: litellm.completion(...)
              - pattern: litellm.acompletion(...)
              - patterns:
                  - pattern-either:
                      - pattern: $AGENT.run(...)
                      - pattern: $AGENT.invoke(...)
                  - metavariable-regex:
                      metavariable: $AGENT
                      regex: (?i).*(agent|chain|crew).*
    pattern-sanitizers:
      - patterns:
          - pattern-either:
              - pattern: $TEXT = $MODERATOR.moderate($TEXT)
              - pattern: $TEXT = moderation(...)
              - pattern: $TEXT = classify_prompt_injection($TEXT)
              - pattern: $TEXT = $CLASSIFIER.classify($TEXT)
              - pattern: $TEXT = $SCHEMA.model_validate($TEXT)
              - pattern: $TEXT = $SCHEMA.model_validate_json($TEXT)
              - pattern: $TEXT = f"<document>{$TEXT}</document>"
              - pattern: $TEXT = f"<untrusted_content>{$TEXT}</untrusted_content>"
              - pattern: $TEXT = f"<untrusted_document>{$TEXT}</untrusted_document>"

  - id: TNT-ML-034
    mode: taint
    message: |
      Content extracted from an ingested document (OCR, PDF text layer,
      audio transcript, an Office/HTML loader) flows into a vector-store
      write with no visible content-moderation or prompt-injection
      classification in between. NS-AIML-015 flags raw insertion without
      embedding, but a PROPERLY embedded poisoned document is the actual
      attack -- it reads back as an ordinary RAG chunk and reaches every
      future query that retrieves it (see TNT-ML-016's memory read-back,
      the other half of this loop).
    severity: WARNING
    languages: [python]
    metadata:
      cwe: [94]
      category: prompt_injection
      fix: "Run ingested document text through a moderation/prompt-injection classifier before it is embedded and written to the vector store -- poisoning at write time reaches every future query that retrieves the chunk, not just the ingesting request."
    pattern-sources:
      - patterns:
          - pattern-either:
              # rowan-registry:begin source=document_ingest
              - patterns:
                  - pattern-either:
                      - pattern: pytesseract.image_to_string(...)
                      - pattern: $READER.readtext(...)
                      - pattern: $CLIENT.detect_document_text(...)
                      - pattern: $CLIENT.analyze_document(...)
                      - pattern: $VISION_CLIENT.text_detection(...)
                      - pattern: $VISION_CLIENT.document_text_detection(...)
                      - pattern: $PAGE.extract_text(...)
                      - pattern: $PDF.pages[...].extract_text(...)
                      - pattern: $PDF.extract_text(...)
                      - pattern: partition(...)
                      - pattern: partition_pdf(...)
                      - pattern: $IMG._getexif(...)
                      - pattern: $IMG.getexif(...)
                      - pattern: exifread.process_file(...)
                      - pattern: piexif.load(...)
                      - pattern: $MODEL.transcribe(...)
                      - pattern: $CLIENT.audio.transcriptions.create(...)
                      - pattern: $CLIENT.audio.translations.create(...)
                      - pattern: UnstructuredWordDocumentLoader(...).load(...)
                      - pattern: UnstructuredHTMLLoader(...).load(...)
                      - pattern: BSHTMLLoader(...).load(...)
                      - pattern: Docx2txtLoader(...).load(...)
                      - pattern: PyPDFLoader(...).load(...)
                      - pattern: UnstructuredExcelLoader(...).load(...)
              # rowan-registry:end source=document_ingest
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $STORE.add_texts(...)
              - pattern: $STORE.add_documents(...)
              - patterns:
                  - pattern-either:
                      - pattern: $INDEX.upsert(...)
                  - metavariable-regex:
                      metavariable: $INDEX
                      regex: (?i).*(index|pinecone).*
              - patterns:
                  - pattern-either:
                      - pattern: $COLLECTION.add(...)
                  - metavariable-regex:
                      metavariable: $COLLECTION
                      regex: (?i).*(collection|chroma|coll).*
    pattern-sanitizers:
      - patterns:
          - pattern-either:
              - pattern: $TEXT = $MODERATOR.moderate($TEXT)
              - pattern: $TEXT = moderation(...)
              - pattern: $TEXT = classify_prompt_injection($TEXT)
              - pattern: $TEXT = $CLASSIFIER.classify($TEXT)

  - id: TNT-ML-035
    mode: taint
    message: |
      A request-supplied URL is assembled into a multimodal message part
      (an image_url/input_audio content block) with no visible
      allowlist/domain-validation check in between. The model
      provider's own infrastructure becomes the fetching agent for that
      URL -- SSRF (the provider's servers probe wherever the URL points)
