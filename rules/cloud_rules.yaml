# Cloud Infrastructure Security Rules: neuroscan format
# Covers AWS, GCP, Azure misconfigurations detectable in application code

rules:

  # ── CLOUD001: S3 public access ────────────────────────────────────

  - id: ns-cloud-001
    name: S3 bucket with public access
    severity: ERROR
    category: config
    cwe: [284]
    languages: [python, javascript, typescript, java, go]
    patterns:
      # The ACL value, not a bucket that happens to be named public-*.
      - 'ACL[''"]?\s*[=:]\s*[''"]public-read(?:-write)?[''"]'
      - 'BlockPublicAccess.*false'
      # CDK, AWS SDK for Java, AWS SDK for Go.
      - 'publicReadAccess\s*:\s*true'
      - 'CannedAccessControlList\.PublicRead(?:Write)?\b'
      - '(?:Bucket|Object)CannedACLPublicRead(?:Write)?\b'
    pattern-not:
      - '(?m)^\s*#'
      - '(?m)^\s*//.*'
      - '(?:def test_|conftest|unittest)'
    message: |
      S3 bucket configured with public access. Use private ACLs and explicit
      bucket policies with least-privilege access.

  # ── CLOUD002: IAM wildcard permissions ────────────────────────────

  - id: ns-cloud-002
    name: IAM policy with wildcard action or resource
    severity: WARNING
    category: auth
    cwe: [285]
    languages: [python, javascript, typescript, java, go, json]
    patterns:
      # Resource "*" alone is required for many actions
      # (ecr:GetAuthorizationToken, sts:GetCallerIdentity), so only a
      # wildcard Action is flagged: everything, or every action of a service.
      - '"Action"\s*:\s*"(?:[a-z0-9-]+:)?\*"'
      - '"Action"\s*:\s*\[\s*"(?:[a-z0-9-]+:)?\*"'
    pattern-not:
      - '(?m)^\s*#'
      - '(?m)^\s*//.*'
      - '(?:def test_|conftest|unittest)'
    message: |
      IAM policy with wildcard Action or Resource grants unrestricted access.
      Scope to specific actions and resources per least-privilege principle.

  # ── CLOUD003: Unencrypted storage / transport ─────────────────────

  - id: ns-cloud-003
    name: Unencrypted cloud storage or transport
    severity: ERROR
    category: crypto
    cwe: [311]
    languages: [python, javascript, typescript, java, go]
    patterns:
      - 'ServerSideEncryption\s*[=:]\s*(?:None|none|"")'
      - 'encrypted\s*[=:]\s*[Ff]alse'
      - 'SSEAlgorithm\s*[=:]\s*(?:None|none|"")'
    pattern-not:
      - '(?m)^\s*#'
      - '(?m)^\s*//.*'
      - '(?:def test_|conftest|unittest)'
    message: |
      Cloud storage configured without server-side encryption. Enable SSE-S3,
      SSE-KMS, or SSE-C and use HTTPS endpoints.

  # ── CLOUD004: Publicly accessible database ────────────────────────

  - id: ns-cloud-004
    name: Cloud database publicly accessible
    severity: ERROR
    category: config
    cwe: [668]
    languages: [python, javascript, typescript, java, go]
    patterns:
      - '(?i)publicly_?accessible[''"]?\s*[=:]\s*true'
      - 'authorized_networks.*(?<![\d.])0\.0\.0\.0'
    pattern-not:
      - '(?m)^\s*#'
      - '(?m)^\s*//.*'
      - '(?:def test_|conftest|unittest)'
    message: |
      Cloud database configured as publicly accessible. Restrict to private
      subnets and use VPC peering or Private Link for access.

  # ── CLOUD005: Missing logging / audit trail ───────────────────────

  - id: ns-cloud-005
    name: Cloud logging or audit trail disabled
    severity: WARNING
    category: config
    cwe: [778]
    languages: [python, javascript, typescript, java, go]
    patterns:
      - 'access_log_enabled\s*[=:]\s*false'
      - 'cloudtrail.*IsLogging.*false'
      - 'log_analytics.*enabled.*false'
    pattern-not:
      - '(?m)^\s*#'
      - '(?m)^\s*//.*'
      - '(?:def test_|conftest|unittest)'
    message: |
      Cloud logging or audit trail disabled. Enable CloudTrail, Cloud Audit Logs,
      or Azure Monitor for security event tracking and compliance.

  # ── CLOUD006: Overprivileged service account ──────────────────────

  - id: ns-cloud-006
    name: Overprivileged cloud service account or role
    severity: WARNING
    category: auth
    cwe: [250]
    languages: [python, javascript, typescript, java, go]
    patterns:
      - 'roles/owner'
      - 'roles/editor'
      - 'AdministratorAccess'
      - 'PowerUserAccess'
      - 'AmazonS3FullAccess'
      - 'arn:aws:iam::.*:policy/Admin'
    pattern-not:
      - '(?m)^\s*#'
      - '(?m)^\s*//.*'
      - '(?:def test_|conftest|unittest)'
    message: |
      Overprivileged cloud role or service account detected. Use custom roles
      with minimum required permissions following least-privilege principle.

  # ── CLOUD007: Insecure network / security group ───────────────────

  - id: ns-cloud-007
    name: Cloud security group open to all traffic
    severity: ERROR
    category: config
    cwe: [284]
    languages: [python, javascript, typescript, java, go]
    patterns:
      - 'CidrIp.*0\.0\.0\.0/0'
      - 'cidr_blocks.*0\.0\.0\.0/0'
      - 'source_ranges.*0\.0\.0\.0/0'
      - 'IpProtocol\W+-1\b'
      - 'from_port\s*[=:]\s*0\b.*to_port\s*[=:]\s*65535'
    pattern-not:
      - '(?m)^\s*#'
      - '(?m)^\s*//.*'
      - '(?:def test_|conftest|unittest)'
    message: |
      Security group or firewall rule allows traffic from 0.0.0.0/0.
      Restrict inbound rules to specific trusted IP ranges and required ports.
