    pattern-sinks:
      - patterns:
          # `exec(code, {})` and `eval(code, {"__builtins__": {}})` are what
          # people write and are still escapable; only the code argument is
          # the sink (#72).
          - pattern-either:
              - pattern: eval($CODE, ...)
              - pattern: exec($CODE, ...)
              - pattern: compile($CODE, ...)
          - focus-metavariable: $CODE
    pattern-sanitizers:
      - patterns:
          - pattern-either:
              - pattern: ast.literal_eval(...)
              - pattern: int($CODE)
              - pattern: float($CODE)

