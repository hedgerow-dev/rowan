                          - pattern: $P
              # rowan-registry:end source=web_request
              - pattern: request.files[...]
    pattern-sinks:
      - patterns:
          # Real calls pass a Loader (`yaml.load(d, Loader=yaml.Loader)`);
          # only SafeLoader / CSafeLoader are safe (#72).
          - pattern-either:
              - pattern: yaml.load($DATA, ...)
              - pattern: yaml.load_all($DATA, ...)
              - pattern: yaml.unsafe_load($DATA, ...)
              - pattern: yaml.unsafe_load_all($DATA, ...)
              - pattern: yaml.full_load($DATA, ...)
              - pattern: yaml.full_load_all($DATA, ...)
          - pattern-not: yaml.$F($DATA, Loader=yaml.SafeLoader)
          - pattern-not: yaml.$F($DATA, Loader=yaml.CSafeLoader)
