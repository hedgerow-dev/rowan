# Java Security Rules
rules:

  - id: JA-INJECT-001
    name: Runtime.exec() command injection
    severity: high
    category: command_injection
    cwe: [78]
    languages: [java]
    patterns:
      - 'Runtime\.getRuntime\(\)\.exec\s*\('
    pattern-not:
      - '(?m)^\s*//.*'
    message: |
      Runtime.exec() executes OS commands. User-controlled arguments enable
      shell injection. Use ProcessBuilder with separate argument array.

  - id: JA-INJECT-002
    name: ProcessBuilder command injection
    severity: high
    category: command_injection
    cwe: [78]
    languages: [java]
    patterns:
      - 'new\s+ProcessBuilder\s*\('
    pattern-not:
      - '\.command\s*\(\s*\['
      - '(?m)^\s*//.*'
    message: |
      ProcessBuilder with string concatenation allows command injection.
      Prefer array form: new ProcessBuilder(["cmd", "arg1", "arg2"]).

  - id: JA-DESER-001
    name: Unsafe ObjectInputStream deserialization
    severity: critical
    category: deserialization
    cwe: [502]
    fix: "Avoid Java native deserialization (ObjectInputStream) on untrusted data; use a JSON library with a known target type, or an allowlisting ObjectInputFilter."
    languages: [java]
    patterns:
      - 'new\s+ObjectInputStream\s*\('
    pattern-not:
      - '\.readObject\s*\(\s*\)\s*\{'
      - '(?m)^\s*//.*'
    message: |
      ObjectInputStream.readObject() deserializes arbitrary classes.
      RCE possible via gadget chains. Use a whitelist-based ObjectInputFilter.

  - id: JA-CRYPTO-002
    name: java.util.Random for security
    severity: medium
    category: crypto
    cwe: [330]
    languages: [java]
    patterns:
      - 'new\s+Random\s*\('
    pattern-not:
      - 'new\s+SecureRandom\s*\('
      - '(?m)^\s*//.*'
    message: |
      java.util.Random is predictable. Use java.security.SecureRandom
      for tokens, nonces, and cryptographic keys.

  - id: JA-XXE-001
    name: XML parser without XXE protection
    severity: high
    category: injection
    cwe: [611]
    languages: [java]
    patterns:
      - 'DocumentBuilderFactory\.newInstance\(\)'
      - 'SAXParserFactory\.newInstance\(\)'
    pattern-not:
      - 'setFeature.*EXTERNAL_GENERAL_ENTITIES.*false'
      - 'setFeature.*EXTERNAL_PARAMETER_ENTITIES.*false'
      - '(?m)^\s*//.*'
    message: |
      XML parser without XXE protections. Set FEATURE_SECURE_PROCESSING,
      disallow DOCTYPE, and set external-general-entities/parameter-entities to false.

  - id: JA-AUTH-001
    name: Cookie without Secure/HttpOnly
    severity: medium
    category: auth
    cwe: [614]
    languages: [java]
    patterns:
      - 'new\s+Cookie\s*\('
    pattern-not:
      - '\.setSecure\s*\(true\)'
      - '\.setHttpOnly\s*\(true\)'
      - '(?m)^\s*//.*'
    message: |
      Cookie created without setSecure(true) and setHttpOnly(true).
      Session hijacking risk via MITM or XSS.

  - id: JA-INJECT-004
    name: XPath injection
    severity: medium
    category: injection
    cwe: [643]
    languages: [java]
    patterns:
      - 'XPathExpression.*\.compile\s*\(.*\+'
    pattern-not:
      - '(?m)^\s*//.*'
    message: |
      User input in XPath expression allows data exfiltration.
      Use parameterized XPath or validate/escape input.

  - id: JA-PATH-001
    name: Filesystem path built by concatenation
    severity: high
    category: path_traversal
    cwe: [22]
    languages: [java]
    patterns:
      - 'new\s+File\s*\(\s*["''][^"'']*["'']\s*\+'
      - 'Paths\.get\s*\(\s*["''][^"'']*["'']\s*\+'
    pattern-not:
      - '(?m)^\s*//.*'
    message: |
      A filesystem path is built by concatenating a value onto a fixed base.
      If that value is externally controlled, traversal sequences can escape
      the intended directory. Resolve the path and verify it stays under the
      allowed base directory.

  - id: JA-CONFIG-001
    name: Insecure TLS configuration
    severity: medium
    category: config
    cwe: [295]
    languages: [java]
    patterns:
      - 'TrustManager.*X509TrustManager'
    pattern-not:
      - 'checkClientTrusted'
      - 'checkServerTrusted'
      - '(?m)^\s*//.*'
    message: |
      Custom TrustManager detected. Ensure proper certificate validation
      is implemented: empty checkServerTrusted() disables all TLS verification.
