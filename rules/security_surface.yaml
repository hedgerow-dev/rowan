  - id: NS-CRYPTO-102
    message: >
      Weak cryptographic hash: MD5 or SHA-1 (JavaScript/TypeScript).
    severity: WARNING
    # DEF-18: hashlib.md5(...)/hashlib.sha1(...) (Python) were removed --
    # they duplicated NS-CRYPTO-001 (MD5, severity medium) and NS-CRYPTO-002
    # (SHA-1, severity low) exactly, but at a single uniform "WARNING"
    # severity, losing the MD5-is-worse-than-SHA-1 distinction those two
    # rules preserve. Confirmed on a corpus scan: 38/39 of this rule's
    # fires were Python (pure duplicates), only 1 was the genuine
    # JS/TS-only crypto.createHash(...) signal this rule now scopes to.
    languages: [javascript, typescript]
    patterns:
      - crypto\.createHash\(["']md5["']
      - crypto\.createHash\(["']sha1["']
    pattern-not:
      - '(?m)^\s*#'
      - '(?m)^\s*//.*'
      - '(?:def test_|conftest|unittest)'
    metadata:
      cwe: [327]
      category: crypto

