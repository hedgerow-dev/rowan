# Structural companions to framework_rules.yaml. "X without Y" checks whose Y
# sits on another line cannot be regex rules: pattern-not only sees the
# finding's own line (#71). These keep their original rule IDs.

rules:
  - id: ns-fw-py-004
    message: >
      Django MIDDLEWARE does not include CsrfViewMiddleware, so POST forms and
      views are not protected against cross-site request forgery. Add
      django.middleware.csrf.CsrfViewMiddleware to MIDDLEWARE.
    severity: WARNING
    languages: [python]
    metadata:
      cwe: [352]
      category: auth
      fix: "Add \"django.middleware.csrf.CsrfViewMiddleware\" to MIDDLEWARE."
    patterns:
      - pattern-either:
          - pattern: MIDDLEWARE = [...]
          - pattern: MIDDLEWARE = (...)
      - pattern-not: MIDDLEWARE = [..., "django.middleware.csrf.CsrfViewMiddleware", ...]
      - pattern-not: MIDDLEWARE = (..., "django.middleware.csrf.CsrfViewMiddleware", ...)

  - id: ns-fw-js-001
    message: >
      Express app without Helmet middleware in the same file. Helmet sets
      security-related HTTP headers. If headers are set elsewhere, ignore
      this; otherwise add app.use(helmet()).
    severity: INFO
    languages: [javascript, typescript]
    metadata:
      cwe: [693]
      category: config
      fix: "Install helmet and add app.use(helmet()) before the routes."
    patterns:
      - pattern: $APP = express()
      - pattern-not-inside: |
          $APP = express();
          ...
          $APP.use(helmet(...));

  - id: ns-fw-sess-001
    message: >
      A login-style key (user_id, uid, ...) is written into the session without
      rotating the session in the same function. An attacker who planted a
      session ID before login keeps it after the victim authenticates (session
      fixation). Rotate first: session.clear() (Flask), new_session() (aiohttp),
      request.session.cycle_key() or login() (Django).
    severity: WARNING
    languages: [python]
    paths:
      exclude:
        - "**/tests/**"
        - "**/test_*.py"
    metadata:
      cwe: [384]
      category: auth
      fix: "Issue a fresh session at login before storing the user's identity in it."
    patterns:
      - pattern: $SESSION[$KEY] = $VALUE
      - metavariable-regex:
          metavariable: $SESSION
          regex: ^(session|sess|request\.session)$
      - metavariable-regex:
          metavariable: $KEY
          regex: ^["'](user_id|uid|user|username|account_id|auth_user_id|logged_in)["']$
      # `def` also matches `async def`.
      - pattern-inside: |
          def $F(...):
            ...
      - pattern-not-inside: |
          def $F(...):
            ...
            $S.clear()
            ...
      - pattern-not-inside: |
          def $F(...):
            ...
            $S.cycle_key()
            ...
      - pattern-not-inside: |
          def $F(...):
            ...
            $S.invalidate()
            ...
      - pattern-not-inside: |
          def $F(...):
            ...
            $S.regenerate(...)
            ...
      - pattern-not-inside: |
          def $F(...):
            ...
            $S = await new_session(...)
            ...
      - pattern-not-inside: |
          def $F(...):
            ...
            $S = new_session(...)
            ...
      - pattern-not-inside: |
          def $F(...):
            ...
            login(...)
            ...
