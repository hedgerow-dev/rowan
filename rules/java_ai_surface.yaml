# Java AI/MCP surface rules (BACKLOG.md JG-07).
#
# These are bounded, line-local presence signals. They deliberately avoid
# pretending that regex can prove request-to-sink flow or whole-class auth
# absence; the Java taint rules own those stronger claims.
rules:
  - id: ns-aiml-169
    name: Java MCP HTTP transport bound to all interfaces
    severity: WARNING
    category: ai_ml
    cwe: [306, 668]
    languages: [java]
    patterns:
      - '(?:WebMvcSseServerTransportProvider|HttpServletSseServerTransportProvider)[^;\n]{0,240}(?:0\.0\.0\.0|server\.address)'
      - '(?:server\.address|setServerAddress|serverAddress)\s*\(?\s*[=:]?\s*["'']0\.0\.0\.0["'']'
    pattern-not:
      - '(?m)^\s*//'
      - '(?i)(?:Bearer|OAuth|Authorization|SecurityFilterChain|authenticated)'
      - '(?:127\.0\.0\.1|localhost)'
    message: |
      A Java MCP SSE/HTTP transport is configured to listen on every network
      interface, with no authentication marker on the same configuration
      statement. Confirm that a Spring Security/OAuth filter protects the MCP
      endpoint; otherwise remote clients can invoke every exposed tool.

  - id: ns-aiml-170
    name: Java AI provider API key embedded as a literal
    severity: critical
    category: secrets
    cwe: [798]
    languages: [java]
    # The key-name suffix is required: without it `openAiModel = "..."`
    # (a model name) was reported as a CRITICAL secret.
    patterns:
      - '(?i)\b(?:openai|anthropic|gemini|cohere|mistral|groq|langsmith|langfuse)[A-Za-z0-9_]*(?:Api_?Key|Secret_?Key|Token|Secret|Key)\s*=\s*["''][A-Za-z0-9_\-]{16,}["'']'
      - '(?i)\.(?:apiKey|secretKey|accessToken)\s*\(\s*["''][A-Za-z0-9_\-]{16,}["'']\s*\)'
    pattern-not:
      - '(?m)^\s*//'
      - '(?i)(?:example|placeholder|your[-_ ]?(?:api[-_ ]?)?key|changeme|dummy|test[-_ ]?key)'
      - '(?:System\.getenv|System\.getProperty|@Value\s*\()'
    message: |
      A literal API credential is embedded in Java AI client configuration.
      Move it to an injected secret and rotate the exposed credential.
    fix: |
      Remove the literal from source, load the credential from a secret manager
      or injected environment variable, and rotate the exposed credential.

  - id: ns-aiml-171
    name: Java AI/MCP tool description is non-literal
    severity: WARNING
    category: prompt_injection
    cwe: [829]
    languages: [java]
    patterns:
      - '@Tool\s*\([^\n)]*\bdescription\s*=\s*(?!["''])[A-Za-z_]\w*(?:\.\w+)*'
      - '\.(?:description|setDescription)\s*\(\s*(?!["''])[A-Za-z_]\w*(?:\.\w+)*\s*\)'
      - 'new\s+(?:ToolSpecification|ToolDefinition)\s*\([^\n,]+,\s*(?!["''])[A-Za-z_]\w*(?:\.\w+)*\s*\)'
    pattern-not:
      - '(?m)^\s*//'
      - '\bdescription\s*=\s*["'']'
      - '\.(?:description|setDescription)\s*\(\s*["'']'
    message: |
      A Java agent/MCP tool description is supplied by a variable rather than
      a reviewed literal. If mutable or remotely sourced, it can silently
      inject instructions into the model context when tool metadata is loaded.

  - id: ns-aiml-172
    name: DJL model downloaded over HTTP without pinned integrity
    severity: WARNING
    category: supply_chain
    cwe: [494]
    languages: [java]
    patterns:
      - '\.optModelUrls?\s*\(\s*["'']https?://'
    pattern-not:
      - '(?m)^\s*//'
      - '(?i)(?:sha256|checksum|digest|integrity)'
    message: |
      DJL Criteria loads model content from an HTTP(S) URL with no integrity
      value visible on the same statement. Pin a trusted digest or package the
      reviewed model artifact locally to prevent upstream replacement.

  - id: ns-aiml-173
    name: Java model loaded from a non-literal path
    severity: WARNING
    category: path_traversal
    cwe: [22, 494]
    languages: [java]
    patterns:
      - '\bModel\.load\s*\(\s*(?!["''])[A-Za-z_]\w*(?:\.\w+)*\s*\)'
      - '\bModel\.load\s*\([^,\n]+,\s*(?!["''])[A-Za-z_]\w*(?:\.\w+)*\s*\)'
    pattern-not:
      - '(?m)^\s*//'
      - '\bModel\.load\s*\([^)]*["''][^"'']+["'']\s*\)'
    message: |
      Model.load receives a non-literal path. Confirm the value cannot be
      chosen by a request or model output and confine it to a trusted model
      directory with an integrity check before loading.
