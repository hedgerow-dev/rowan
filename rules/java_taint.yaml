rules:
  - id: tnt-ja-sqli-001
    mode: taint
    languages: [java]
    severity: ERROR
    message: >-
      User input flows into a SQL query without parameterization, enabling SQL injection.
    metadata:
      cwe:
        - "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      confidence: HIGH
      category: injection
      fix: "Use PreparedStatement with bound parameters (setString/setInt) instead of concatenating input into SQL text."
    pattern-sources:
      # rowan-registry:begin source=web_request_java
      - patterns:
          - pattern-either:
              - pattern: (HttpServletRequest $REQ).getParameter(...)
              - pattern: request.getParameter(...)
              - patterns:
                  - pattern: $PARAM
                  - pattern-inside: |
                      $RET $METHOD(..., @RequestParam $TYPE $PARAM, ...) {
                        ...
                      }
              - patterns:
                  - pattern: $PARAM
                  - pattern-inside: |
                      $RET $METHOD(..., @RequestParam(...) $TYPE $PARAM, ...) {
                        ...
                      }
              - patterns:
                  - pattern: $PARAM
                  - pattern-inside: |
                      $RET $METHOD(..., @PathVariable $TYPE $PARAM, ...) {
                        ...
                      }
              - patterns:
                  - pattern: $PARAM
                  - pattern-inside: |
                      $RET $METHOD(..., @PathVariable(...) $TYPE $PARAM, ...) {
                        ...
                      }
              - patterns:
                  - pattern: $PARAM
                  - pattern-inside: |
                      $RET $METHOD(..., @RequestBody $TYPE $PARAM, ...) {
                        ...
                      }
              - patterns:
                  - pattern: $PARAM
                  - pattern-inside: |
                      $RET $METHOD(..., @RequestBody(...) $TYPE $PARAM, ...) {
                        ...
                      }
              - patterns:
                  - pattern: $PARAM
                  - pattern-inside: |
                      $RET $METHOD(..., @QueryParam $TYPE $PARAM, ...) {
                        ...
                      }
              - patterns:
                  - pattern: $PARAM
                  - pattern-inside: |
                      $RET $METHOD(..., @QueryParam(...) $TYPE $PARAM, ...) {
                        ...
                      }
              - patterns:
                  - pattern: $PARAM
                  - pattern-inside: |
                      @$MAPPING(...)
                      $RET $METHOD(..., String $PARAM, ...) {
                        ...
                      }
                  - metavariable-regex:
                      metavariable: $MAPPING
                      regex: ^(GetMapping|PostMapping|PutMapping|DeleteMapping|RequestMapping|PatchMapping)$
      # rowan-registry:end source=web_request_java
    pattern-sinks:
      - pattern: (Statement $S).executeQuery(...)
      - pattern: (Statement $S).executeUpdate(...)
      - pattern: (Statement $S).execute(...)
      - pattern: (Connection $C).prepareStatement(...)
      - pattern: $C.prepareStatement(...)
      - pattern: $C.createStatement().executeQuery(...)
      - pattern: $C.createStatement().executeUpdate(...)
      - pattern: $C.createStatement().execute(...)
      - pattern: $EM.createQuery(...)
    pattern-sanitizers:
      - pattern: (PreparedStatement $PS).setString(...)
      - pattern: (PreparedStatement $PS).setInt(...)
      - pattern: Integer.parseInt(...)
      - pattern: Long.parseLong(...)

  # EXT-19: operator-controlled sources (System.getenv / getProperty, argv,
  # Spring Environment and @Value) are split out of the -001 rules the
  # EXT-08 way. ADR-0005 traced every dubbo Java FP to System.getenv, a
  # deployment-time value, not attacker input. Same sinks and sanitizers as
  # the -001; WARNING and source_kind operator_input so enrichment scores
  # it as cli_input rather than http_input.
  - id: tnt-ja-sqli-002
    mode: taint
    languages: [java]
    severity: WARNING
    message: >-
      Configuration or command-line input (env var, system property, argv, Spring
      Environment or @Value) flows into a
      SQL query unchanged. Operator-controlled, so lower risk than request
      input, but the same SQL injection sink built from untrusted text.
    metadata:
      cwe:
        - "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      confidence: MEDIUM
      category: injection
      source_kind: operator_input
      fix: "Use PreparedStatement with bound parameters (setString/setInt) instead of concatenating input into SQL text."
    pattern-sources:
      # rowan-registry:begin source=operator_input_java
      - patterns:
          - pattern-either:
              - pattern: System.getenv(...)
              - patterns:
                  - pattern: System.getProperty($KEY, ...)
                  - pattern-not: System.getProperty("=~/^(java|os|file|path|line|user)\./", ...)
              - pattern: args[$I]
              - pattern: (Environment $E).getProperty(...)
              - patterns:
                  - pattern: $FIELD
                  - pattern-inside: |
                      class $C {
                        ...
                        @Value("...") $TYPE $FIELD;
                        ...
                      }
      # rowan-registry:end source=operator_input_java
    pattern-sinks:
      - pattern: (Statement $S).executeQuery(...)
      - pattern: (Statement $S).executeUpdate(...)
      - pattern: (Statement $S).execute(...)
      - pattern: (Connection $C).prepareStatement(...)
      - pattern: $C.prepareStatement(...)
      - pattern: $C.createStatement().executeQuery(...)
      - pattern: $C.createStatement().executeUpdate(...)
      - pattern: $C.createStatement().execute(...)
      - pattern: $EM.createQuery(...)
    pattern-sanitizers:
      - pattern: (PreparedStatement $PS).setString(...)
      - pattern: (PreparedStatement $PS).setInt(...)
      - pattern: Integer.parseInt(...)
      - pattern: Long.parseLong(...)

