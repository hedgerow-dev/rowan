  - id: tnt-ja-xss-001
    mode: taint
    languages: [java]
    severity: ERROR
    message: >-
      User input flows into an HTML response without encoding, enabling cross-site scripting.
    metadata:
      cwe:
        - "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      confidence: HIGH
      category: xss
      fix: "HTML-encode output with StringEscapeUtils.escapeHtml4()/Encode.forHtml() (or the framework's auto-escaping template engine) instead of writing user input directly into the response."
    # EXT-19: no operator-input sibling. An env var echoed into a response
    # is not a reflected-XSS class worth a rule.
    pattern-sources:
      # rowan-registry:begin source=web_request_java
      - patterns:
          - pattern-either:
              - pattern: (HttpServletRequest $REQ).getParameter(...)
              - pattern: request.getParameter(...)
              - patterns:
                  - pattern: $PARAM
                  - pattern-inside: |
                      $RET $METHOD(..., @RequestParam $TYPE $PARAM, ...) {
                        ...
                      }
              - patterns:
                  - pattern: $PARAM
                  - pattern-inside: |
                      $RET $METHOD(..., @RequestParam(...) $TYPE $PARAM, ...) {
                        ...
                      }
              - patterns:
                  - pattern: $PARAM
                  - pattern-inside: |
                      $RET $METHOD(..., @PathVariable $TYPE $PARAM, ...) {
                        ...
                      }
              - patterns:
                  - pattern: $PARAM
                  - pattern-inside: |
                      $RET $METHOD(..., @PathVariable(...) $TYPE $PARAM, ...) {
                        ...
                      }
              - patterns:
                  - pattern: $PARAM
                  - pattern-inside: |
                      $RET $METHOD(..., @RequestBody $TYPE $PARAM, ...) {
                        ...
                      }
              - patterns:
                  - pattern: $PARAM
                  - pattern-inside: |
                      $RET $METHOD(..., @RequestBody(...) $TYPE $PARAM, ...) {
                        ...
                      }
              - patterns:
                  - pattern: $PARAM
                  - pattern-inside: |
                      $RET $METHOD(..., @QueryParam $TYPE $PARAM, ...) {
                        ...
                      }
              - patterns:
                  - pattern: $PARAM
                  - pattern-inside: |
                      $RET $METHOD(..., @QueryParam(...) $TYPE $PARAM, ...) {
                        ...
                      }
              - patterns:
                  - pattern: $PARAM
                  - pattern-inside: |
                      @$MAPPING(...)
                      $RET $METHOD(..., String $PARAM, ...) {
                        ...
                      }
                  - metavariable-regex:
                      metavariable: $MAPPING
                      regex: ^(GetMapping|PostMapping|PutMapping|DeleteMapping|RequestMapping|PatchMapping)$
      # rowan-registry:end source=web_request_java
    pattern-sinks:
      - pattern: $OUT.print(...)
      - pattern: $OUT.println(...)
      - pattern: (HttpServletResponse $R).getWriter().print(...)
      - pattern: (HttpServletResponse $R).getWriter().println(...)
    pattern-sanitizers:
      - pattern: StringEscapeUtils.escapeHtml4(...)
      - pattern: HtmlUtils.htmlEscape(...)
      - pattern: Encode.forHtml(...)

  - id: tnt-ja-deser-001
    mode: taint
    languages: [java]
    severity: ERROR
    message: >-
      User input flows into a deserialization call, enabling remote code execution via insecure deserialization.
    metadata:
      cwe:
        - "CWE-502: Deserialization of Untrusted Data"
      confidence: HIGH
      category: deserialization
      fix: "Avoid Java native deserialization (ObjectInputStream) on untrusted data; use a JSON library with a known target type, or an allowlisting ObjectInputFilter."
    pattern-sources:
      - pattern: (HttpServletRequest $REQ).getParameter(...)
      - pattern: request.getParameter(...)
      - pattern: (HttpServletRequest $REQ).getInputStream()
      - pattern: (ServletRequest $REQ).getInputStream()
      - patterns:
          - pattern: $PARAM
          - pattern-inside: |
              $RET $METHOD(..., @RequestParam $TYPE $PARAM, ...) {
                ...
              }
      - patterns:
          - pattern: $PARAM
          - pattern-inside: |
              $RET $METHOD(..., @RequestParam(...) $TYPE $PARAM, ...) {
                ...
              }
      - patterns:
          - pattern: $PARAM
          - pattern-inside: |
              $RET $METHOD(..., @RequestBody $TYPE $PARAM, ...) {
                ...
              }
      - patterns:
          - pattern: $PARAM
          - pattern-inside: |
              $RET $METHOD(..., @RequestBody(...) $TYPE $PARAM, ...) {
                ...
              }
    pattern-sinks:
      - pattern: (ObjectInputStream $OIS).readObject()
      - pattern: $XSTREAM.fromXML(...)
      # Jackson readValue(json, Concrete.class) is typed, memory-safe JSON
      # binding, the Java twin of Go's json.Unmarshal into a struct (see
      # DEF-11): it cannot instantiate attacker-chosen classes. Gadget-chain
      # deserialization needs polymorphic default typing switched on, so the
      # sink is the readValue call on a mapper that the same method body
      # (or a field initialiser in the same class) called
      # enableDefaultTyping/activateDefaultTyping on, or readValue into a
      # class annotated @JsonTypeInfo(use = Id.CLASS/MINIMAL_CLASS) in the
      # same file. Bare readValue with JsonNode.class or a concrete class
      # is not a sink. Residual gap: a mapper configured in a separate
      # helper/bean and injected, or a target class declared in another
      # file, is missed.
      - patterns:
          - pattern: $OM.readValue($IN, $CLASS.class)
          - pattern-inside: |
              @JsonTypeInfo(use = JsonTypeInfo.Id.$ID, ...)
              class $CLASS { ... }
              ...
          - metavariable-regex:
              metavariable: $ID
              regex: ^(CLASS|MINIMAL_CLASS)$
      - patterns:
          - pattern-either:
              - pattern: $OM.readValue(...)
              - pattern: this.$OM.readValue(...)
          - pattern-either:
              - pattern-inside: |
                  $OM.enableDefaultTyping(...);
                  ...
              - pattern-inside: |
                  $OM.activateDefaultTyping(...);
                  ...
              - pattern-inside: |
                  $OM = $X.enableDefaultTyping(...);
                  ...
              - pattern-inside: |
                  $OM = $X.activateDefaultTyping(...);
                  ...
              - pattern-inside: |
                  $T $OM = $X.enableDefaultTyping(...);
                  ...
              - pattern-inside: |
                  $T $OM = $X.activateDefaultTyping(...);
                  ...
              - pattern-inside: |
                  class $C {
                    ...
                    $T $OM = $X.enableDefaultTyping(...);
                    ...
                  }
              - pattern-inside: |
                  class $C {
                    ...
                    $T $OM = $X.activateDefaultTyping(...);
                    ...
                  }
    pattern-sanitizers:
      - pattern: (ObjectInputFilter $F).checkInput(...)
      - pattern: (ObjectMapper $OM).disableDefaultTyping()

  - id: tnt-ja-xxe-001
    mode: taint
    languages: [java]
    severity: ERROR
    message: >-
      User input flows into an XML parser whose external-entity and DTD processing is not disabled, enabling XML external entity (XXE) injection.
    metadata:
      cwe:
        - "CWE-611: Improper Restriction of XML External Entity Reference"
      confidence: HIGH
      category: injection
      fix: "Disable DTDs and external entities on the factory before parsing: setFeature(\"http://apache.org/xml/features/disallow-doctype-decl\", true) on DocumentBuilderFactory/SAXParserFactory, setProperty(XMLInputFactory.SUPPORT_DTD, false) on XMLInputFactory, or setProperty(XMLConstants.ACCESS_EXTERNAL_DTD, \"\") on the factory."
    pattern-sources:
      - pattern: (HttpServletRequest $REQ).getParameter(...)
      - pattern: request.getParameter(...)
      - pattern: (HttpServletRequest $REQ).getInputStream()
      - pattern: (ServletRequest $REQ).getInputStream()
      - pattern: (HttpServletRequest $REQ).getReader()
      - pattern: (ServletRequest $REQ).getReader()
      - patterns:
          - pattern: $PARAM
          - pattern-inside: |
              $RET $METHOD(..., @RequestParam $TYPE $PARAM, ...) {
                ...
              }
      - patterns:
          - pattern: $PARAM
          - pattern-inside: |
              $RET $METHOD(..., @RequestParam(...) $TYPE $PARAM, ...) {
                ...
              }
      - patterns:
          - pattern: $PARAM
          - pattern-inside: |
              $RET $METHOD(..., @RequestBody $TYPE $PARAM, ...) {
                ...
              }
      - patterns:
          - pattern: $PARAM
          - pattern-inside: |
              $RET $METHOD(..., @RequestBody(...) $TYPE $PARAM, ...) {
                ...
              }
      - patterns:
          - pattern: $PARAM
          - pattern-inside: |
              @$MAPPING(...)
              $RET $METHOD(..., String $PARAM, ...) {
                ...
              }
          - metavariable-regex:
              metavariable: $MAPPING
              regex: ^(GetMapping|PostMapping|PutMapping|DeleteMapping|RequestMapping|PatchMapping)$
    # XXE hardening is a property of the factory (setFeature/setProperty),
    # not of the tainted XML, so it cannot be a pattern-sanitizer: a
    # sanitizer only clears taint on the expression it wraps, and the
    # factory is never on the source-to-sink data path. It is expressed
    # here as sink-level `pattern-not-inside` guards, the same primitive
    # ai_ml_taint.yaml and agent_taint.yaml use for allowlist exclusions.
    # Residual gap: the guard only sees a hardening call that lexically
    # precedes the parse in the SAME method body. A factory hardened in a
    # shared helper (or a field initialiser) and passed in is still flagged.
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: (DocumentBuilder $B).parse(...)
              - pattern: (DocumentBuilderFactory $F).newDocumentBuilder().parse(...)
              - pattern: DocumentBuilderFactory.newInstance().newDocumentBuilder().parse(...)
              - pattern: (SAXParser $P).parse(...)
              - pattern: (SAXParserFactory $F).newSAXParser().parse(...)
              - pattern: SAXParserFactory.newInstance().newSAXParser().parse(...)
              - pattern: (XMLReader $R).parse(...)
              # createXMLStreamReader/createXMLEventReader/unmarshal are
              # untyped because the receiver is usually declared with `var`
              # (WebGoat CommentsCache.java:79), which the typed form misses.
              # The method names are specific enough to XML APIs to carry it.
              - pattern: $F.createXMLStreamReader(...)
              - pattern: $F.createXMLEventReader(...)
              - pattern: $U.unmarshal(...)
              - pattern: (SAXReader $R).read(...)
              - pattern: (SAXBuilder $B).build(...)
              - pattern: (TransformerFactory $T).newTransformer(new StreamSource(...))
              - pattern: (Transformer $T).transform(new StreamSource(...), ...)
              - pattern: (SchemaFactory $S).newSchema(...)
          - pattern-not-inside: |
              $F.setFeature("http://apache.org/xml/features/disallow-doctype-decl", true);
              ...
          - pattern-not-inside: |
              $F.setFeature("http://xml.org/sax/features/external-general-entities", false);
              ...
          - pattern-not-inside: |
              $F.setExpandEntityReferences(false);
              ...
          - pattern-not-inside: |
              $F.setProperty(XMLInputFactory.SUPPORT_DTD, false);
              ...
          - pattern-not-inside: |
              $F.setProperty(XMLInputFactory.IS_SUPPORTING_EXTERNAL_ENTITIES, false);
              ...
          - pattern-not-inside: |
              $F.setProperty(XMLConstants.ACCESS_EXTERNAL_DTD, "");
              ...
          - pattern-not-inside: |
              $F.setFeature(XMLConstants.FEATURE_SECURE_PROCESSING, true);
              ...

