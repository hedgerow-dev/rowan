# Framework Security Rules: neuroscan format
# Ported from Rowan FW-* rules
# Covers Spring and Gin/Echo. Rules that need more than one line
# (Express, Django, ASP.NET, Spring Security) are in framework_opengrep.yaml.

rules:

  # ── Spring (Java) ─────────────────────────────────────────────────

  - id: ns-fw-java-003
    name: Spring Actuator endpoints exposed
    severity: ERROR
    category: config
    cwe: [200]
    languages: [java]
    # DEF-22: bare `env\b`/`heapdump\b` were removed. Confirmed on a real
    # corpus scan (apache/dubbo): 100% of 102 fires were unrelated uses of
    # the word "env" (Dubbo's own environment-support comments, ?env=gray
    # canary-routing URL query params, YAML routing-rule snippets) -- "env"
    # is far too common an identifier/word to stand alone as a pattern.
    # Now scoped to require actual Spring Actuator config/path context.
    patterns:
      - 'management\.endpoints\.web\.exposure\.include\s*=\s*\*'
      - 'management\.endpoints\.web\.exposure\.include\s*=\s*.*\benv\b'
      - 'management\.endpoints\.web\.exposure\.include\s*=\s*.*\bheapdump\b'
      - '/actuator/env\b'
      - '/actuator/heapdump\b'
    pattern-not:
      - '(?m)^\s*#'
      - '(?m)^\s*//.*'
      - '(?:def test_|conftest|unittest)'
    message: |
      Spring Actuator endpoints exposed (env, heapdump, etc.).
      Restrict exposure to health and info only. Protect with authentication.

  # ── Gin / Echo (Go) ───────────────────────────────────────────────
  - id: ns-fw-go-002
    name: Go CORS wildcard
    severity: WARNING
    category: config
    cwe: [942]
    languages: [go]
    patterns:
      - 'AllowAllOrigins\s*:\s*true'
      - 'AllowOrigins\s*:\s*\[.*\*'
      # gin-contrib/cors Default() and rs/cors AllowAll() allow every origin.
      - '\bcors\.(?:Default|AllowAll)\(\)'
    pattern-not:
      - '(?m)^\s*#'
      - '(?m)^\s*//.*'
      - '(?:def test_|conftest|unittest)'
    message: |
      CORS allows all origins. Restrict AllowOrigins to specific trusted domains.

  - id: ns-fw-go-005
    name: Go open redirect
    severity: WARNING
    category: injection
    cwe: [601]
    languages: [go]
    patterns:
      - 'c\.Redirect\(.*c\.(?:Query|Param|QueryParam|FormValue|PostForm)\('
    pattern-not:
      - '(?m)^\s*#'
      - '(?m)^\s*//.*'
      - '(?:def test_|conftest|unittest)'
    message: |
      Redirect target from user input enables open redirect attacks.
      Validate redirect URLs against an allowlist of trusted destinations.
