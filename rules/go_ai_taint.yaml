      confidence: HIGH
      category: path_traversal
      source_kind: llm_output
      fix: "Resolve the path with filepath.Abs, then filepath.EvalSymlinks, and check the result is under an explicit allowlist of directories before use, or use filepath.Base() to discard directory components entirely."
    pattern-sources:
