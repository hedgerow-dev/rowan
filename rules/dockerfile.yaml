# Dockerfile Security Rules
rules:

  - id: DK-CONFIG-001
    name: Latest tag in FROM
    severity: medium
    category: config
    cwe: [1104]
    languages: [dockerfile]
    patterns:
      - 'FROM\s+\S+:latest\b'
    pattern-not:
      - '(?m)^\s*#'
      - '(?:def test_|conftest|unittest)'
    message: |
      :latest tag is mutable and non-reproducible. Pin to a specific
      version tag or digest (e.g., python:3.12-alpine@sha256:...).

  - id: DK-CONFIG-002
    name: Container running as root
    severity: high
    category: config
    cwe: [250]
    languages: [dockerfile]
    patterns:
      - '^USER\s+root\s*$'
      - '^USER\s+0\s*$'
    pattern-not:
      - '(?m)^\s*#'
      - '(?:def test_|conftest|unittest)'
    message: |
      Container runs as root. If compromised, attacker gains root on host.
      Add 'USER 1000' after installing dependencies.

  - id: DK-SUPPLY-001
    name: curl pipe bash
    severity: high
    category: supply_chain
    cwe: [829]
    languages: [dockerfile]
    patterns:
      - 'curl\s+.*\s*\|\s*(bash|sh)\b'
      - 'wget\s+.*\s*-O\s*-\s*\|\s*(bash|sh)\b'
    pattern-not:
      - '(?m)^\s*#'
      - '(?:def test_|conftest|unittest)'
    message: |
      curl | bash downloads and executes untrusted remote scripts.
      Verify checksums or use signed packages.

  - id: DK-SUPPLY-002
    name: ADD from remote URL
    severity: medium
    category: supply_chain
    cwe: [494]
    languages: [dockerfile]
    patterns:
      - '^ADD\s+https?://'
    pattern-not:
      - '(?m)^\s*#'
      - '(?:def test_|conftest|unittest)'
    message: |
      ADD fetches remote URLs without verification. Use COPY for
      local files, or curl/wget in RUN with checksum verification.

  - id: DK-CONFIG-003
    name: Privileged port exposed
    severity: low
    category: config
    cwe: [250]
    languages: [dockerfile]
    patterns:
      - '^EXPOSE\s+[0-9]{1,4}\s*$'
    pattern-not:
      - '^EXPOSE\s+[1-9][0-9]{3,4}'
      - '(?m)^\s*#'
      - '(?:def test_|conftest|unittest)'
    message: |
      Exposing port < 1024 requires root. Use a high port (>1024)
      and reverse proxy for 80/443 binding.

  - id: DK-CONFIG-004
    name: CAP_ADD=ALL
    severity: high
    category: config
    cwe: [250]
    languages: [dockerfile]
    patterns:
      - '--cap-add\s*=\s*ALL\b'
    pattern-not:
      - '(?m)^\s*#'
      - '(?:def test_|conftest|unittest)'
    message: |
      --cap-add=ALL grants every Linux capability. Use minimal
      capabilities (e.g., NET_BIND_SERVICE only).

  - id: DK-SUPPLY-003
    name: apt-get without cleanup
    severity: low
    category: supply_chain
    cwe: [459]
    languages: [dockerfile]
    patterns:
      - 'apt-get\s+install'
    pattern-not:
      - 'apt-get\s+clean'
      - 'rm\s+-rf\s+/var/lib/apt/lists'
      - '(?m)^\s*#'
      - '(?:def test_|conftest|unittest)'
    message: |
      apt-get install without cleanup bloats image and leaves caches.
      Chain with: && apt-get clean && rm -rf /var/lib/apt/lists/*

  - id: DK-CONFIG-005
    name: sudo installed in container
    severity: medium
    category: config
    cwe: [250]
    languages: [dockerfile]
    patterns:
      - 'install.*\bsudo\b'
    pattern-not:
      - '(?m)^\s*#'
      - '(?:def test_|conftest|unittest)'
    message: |
      sudo installed in container. Unnecessary: the entrypoint
      controls process identity. Remove to reduce attack surface.

  - id: DK-CONFIG-006
    name: Missing HEALTHCHECK
    severity: info
    category: config
    cwe: [665]
    languages: [dockerfile]
    patterns:
      - '^(CMD|ENTRYPOINT)'
    pattern-not:
      - 'HEALTHCHECK'
      - '(?m)^\s*#'
      - '(?:def test_|conftest|unittest)'
    message: |
      Missing HEALTHCHECK instruction. Orchestrator cannot determine
      container health. Add HEALTHCHECK --interval=30s CMD ...

  - id: DK-CONFIG-007
    name: COPY all without .dockerignore
    severity: medium
    category: config
    cwe: [538]
    languages: [dockerfile]
    patterns:
      - '^COPY\s+\.\s+(/app|/opt|/usr/src)'
    pattern-not:
      - '(?m)^\s*#'
      - '(?:def test_|conftest|unittest)'
    message: |
      COPY . . without .dockerignore copies .git/, .env, secrets, and
      keys into the image. Add a .dockerignore file.

  - id: DK-CONFIG-008
    name: Docker socket mounted
    severity: critical
    category: config
    cwe: [250]
    fix: "Do not mount the Docker socket into a container unless absolutely required; if needed, proxy it through a socket-permission gateway that restricts the exposed API surface."
    languages: [dockerfile]
    patterns:
      - '-v\s+/var/run/docker\.sock'
      - '--mount.*docker\.sock'
    pattern-not:
      - '(?m)^\s*#'
      - '(?:def test_|conftest|unittest)'
    message: |
      Docker socket mounted into container. Grants full host Docker API
      access enabling container escape.

  - id: DK-CONFIG-009
    name: Setuid/setgid bit in COPY
    severity: medium
    category: config
    cwe: [250]
    languages: [dockerfile]
    patterns:
      - 'chmod\s+[0-7]*[46][0-7]{2}\s'
    pattern-not:
      - '(?m)^\s*#'
      - '(?:def test_|conftest|unittest)'
    message: |
      setuid/setgid binary in container. Unnecessary privilege escalation
      surface. Remove setuid bit from binaries.
