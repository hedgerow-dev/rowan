  # ── TNT-LLMOUT-006: LLM output -> HTML rendering (XSS / markdown exfil) ──
  # Distinct from a generic innerHTML/XSS rule because the source is the
  # completion text itself, which makes it high-signal: prompt injection
  # -> markdown/HTML render is exploitable purely through content the
  # model was shown, no separate injection vector needed. Structured-
  # output sanitizers (Pydantic/instructor/json.loads) deliberately do
  # NOT apply here (see file header): a schema-validated string is still
  # unescaped HTML. Scoped to Python (Streamlit/Flask/markdown-renderer)
  # sinks; the issue's JS-side sinks (innerHTML, dangerouslySetInnerHTML,
  # v-html) are an explicit, documented follow-up -- see final report --
  # since a same-file Python->JS taint flow does not exist in this
  # engine's model and a proper JS/TS variant needs its own JS SDK source
  # vocabulary (fetch/axios response shapes), not a copy of this one.
  - id: TNT-LLMOUT-006
    mode: taint
    message: |
      LLM completion text reaches an HTML-rendering sink. Chat UIs that
      render assistant output as Markdown/HTML, or set unsafe_allow_html,
      let attacker-influenced completion text (via indirect prompt
      injection) inject script or an auto-loading image tag that
      exfiltrates conversation data on render (XSS; the ChatGPT/Bard/
      Writer.com markdown-image-exfil class). A structured-output
      validator does NOT make this safe -- a schema-valid string is still
      unescaped HTML.
    severity: ERROR
    languages: [python]
    metadata:
      cwe: [79]
      category: ai_ml
      fix: "HTML-escape or sandbox-render LLM completion text before it reaches a markdown/HTML sink; restrict rendered <img>/<a> targets to an allow-list of same-origin or known-safe hosts. Never set unsafe_allow_html=True on model output."
