rules:
  # ==========================================================================
  # Deserialization (NS-AIML-030 .. NS-AIML-041)
  # ==========================================================================

  - id: ns-aiml-030
    message: "torch.load() without weights_only=True enables arbitrary code execution via pickle"
    severity: ERROR
    languages: [python]
    patterns:
      - 'torch\.load\('
    pattern-not:
      - 'weights_only\s*=\s*True'
      - 'safetensors'
      - '(?m)^\s*#'
      - '(?:def test_|conftest|unittest)'
    sanitizers:
      - 'weights_only\s*=\s*True'
      - 'safetensors\.torch\.load_file'
    metadata:
      mode: regex
      cwe: [502]
      category: deserialization
      source_rule: AI001

  - id: ns-aiml-031
    message: "joblib.load() deserializes arbitrary Python objects via pickle"
    severity: ERROR
    languages: [python]
    patterns:
      - 'joblib\.load\('
    pattern-not:
      - '(?m)^\s*#'
      - '(?:def test_|conftest|unittest)'
    metadata:
      mode: regex
      cwe: [502]
      category: deserialization
      source_rule: AI010

  - id: ns-aiml-032
    message: "np.load() with allow_pickle=True enables arbitrary code execution"
    severity: ERROR
    languages: [python]
    patterns:
      - 'np\.load\([^)]*allow_pickle\s*=\s*True'
    pattern-not:
      - '(?m)^\s*#'
      - '(?:def test_|conftest|unittest)'
    metadata:
      mode: regex
      cwe: [502]
      category: deserialization
      source_rule: AI011

  - id: ns-aiml-033
    message: "shelve.open() uses pickle internally and is unsafe with untrusted data"
    severity: ERROR
    languages: [python]
    patterns:
      - 'shelve\.open\('
    pattern-not:
      - '(?m)^\s*#'
      - '(?:def test_|conftest|unittest)'
    metadata:
      mode: regex
      cwe: [502]
      category: deserialization
      source_rule: AI019

  - id: ns-aiml-034
    message: "pickle/cPickle deserialization enables arbitrary code execution. Presence signal; confirm the pickle source is user-controlled."
    severity: ERROR
    languages: [python]
    patterns:
      - '\bpickle\.loads?\('
      - '\bcPickle\.loads?\('
      - '\b_pickle\.loads?\('
    pattern-not:
      - '\.pickle\.load'
      - 'torch\.load'
      - 'model\.load'
      - 'from_pretrained'
      - 'joblib\.load'
      - '(?m)^\s*#'
      - '(?:def test_|conftest|unittest)'
    metadata:
      mode: regex
      cwe: [502]
      category: deserialization
      source_rule: AI023

  - id: ns-aiml-035
    message: "DeepSpeed checkpoint loading may deserialize untrusted pickle data"
    severity: ERROR
    languages: [python]
    patterns:
      - 'load_checkpoint\('
      - 'init_inference\('
      - 'ds_model_config\.pkl'
    pattern-not:
      - '(?m)^\s*#'
      - '(?:def test_|conftest|unittest)'
    metadata:
      mode: regex
      cwe: [502]
      category: deserialization
      source_rule: AI038

  - id: ns-aiml-036
    message: "dill/cloudpickle deserialization enables arbitrary code execution"
    severity: ERROR
    languages: [python]
    patterns:
      - '\bdill\.loads?\('
      - '\bcloudpickle\.loads?\('
    pattern-not:
      - '(?m)^\s*#'
      - '(?:def test_|conftest|unittest)'
    metadata:
      mode: regex
      cwe: [502]
      category: deserialization
      source_rule: AI046

  - id: ns-aiml-037
    message: "pandas read_pickle / numpy allow_pickle deserializes untrusted objects"
    severity: ERROR
    languages: [python]
    patterns:
      - 'pd\.read_pickle\('
      - 'pandas\.read_pickle\('
      - 'np\.load\([^)]*allow_pickle\s*=\s*True'
    pattern-not:
      - '(?m)^\s*#'
      - '(?:def test_|conftest|unittest)'
    metadata:
      mode: regex
      cwe: [502]
      category: deserialization
      source_rule: AI048

  - id: ns-aiml-038
    message: "vLLM with trust_remote_code enables arbitrary code execution from model repos"
    severity: ERROR
    languages: [python]
    patterns:
      - 'vllm\.entrypoints\.openai\.api_server'
      - 'vllm\.LLM\('
      - 'trust_remote_code\s*=\s*True'
    pattern-not:
      - '(?m)^\s*#'
      - '(?:def test_|conftest|unittest)'
    metadata:
      mode: regex
      cwe: [502]
      category: deserialization
      source_rule: AI059

  - id: ns-aiml-039
    message: "torch.jit.load() can execute arbitrary code from TorchScript archives"
    severity: ERROR
    languages: [python]
    patterns:
      - 'torch\.jit\.load\('
    pattern-not:
      - '(?m)^\s*#'
      - '(?:def test_|conftest|unittest)'
    metadata:
      mode: regex
      cwe: [502]
      category: deserialization
      source_rule: AI072

  - id: ns-aiml-040
    message: "marshal.loads() can execute arbitrary bytecode"
    severity: ERROR
    languages: [python]
    patterns:
      - 'marshal\.loads?\('
    pattern-not:
      - '(?m)^\s*#'
      - '(?:def test_|conftest|unittest)'
    metadata:
      mode: regex
      cwe: [502]
      category: deserialization
      source_rule: AI073

  - id: ns-aiml-041
    message: "msgpack with pickle fallback enables arbitrary code execution"
    severity: ERROR
    languages: [python]
    patterns:
      - 'msgpack\.unpackb\('
      - 'msgpack\.loads?\('
    pattern-not:
      - '(?m)^\s*#'
      - '(?:def test_|conftest|unittest)'
    metadata:
      mode: regex
      cwe: [502]
      category: deserialization
      source_rule: AI075

  # ==========================================================================
  # Code Execution (NS-AIML-042 .. NS-AIML-046)
  # ==========================================================================

  - id: ns-aiml-043
    message: "Keras model_from_json/model_from_config can execute arbitrary code via importlib"
    severity: ERROR
    languages: [python]
    patterns:
      - 'keras\.models\.model_from_json\('
      - 'keras\.models\.model_from_config\('
      - 'tf\.keras\.models\.model_from_json\('
    pattern-not:
      - '(?m)^\s*#'
      - '(?:def test_|conftest|unittest)'
    metadata:
      mode: regex
      cwe: [94]
      category: deserialization
      source_rule: AI031

  - id: ns-aiml-114
    message: "keras.models.load_model()/keras.saving.load_model() executes arbitrary code if the loaded archive contains a Lambda layer (CVE-2024-3660) or, in Keras 3 < 3.9, a crafted Model.from_config payload (CVE-2025-1550). Presence signal; confirm the model source is user-controlled. Pass safe_mode=True to reject unsafe layers at load time (safe_mode defaults to True since Keras 2.13 but the kwarg does not exist in earlier versions, so upgrading matters as much as passing it explicitly). The model-file scanner (MFV-KERAS-001) independently flags Lambda layers found inside .h5/.keras archives."
    severity: WARNING
    languages: [python]
    patterns:
      - 'keras\.models\.load_model\('
      - 'tf\.keras\.models\.load_model\('
      - 'keras\.saving\.load_model\('
    pattern-not:
      - '(?m)^\s*#'
      - '(?:def test_|conftest|unittest)'
      - 'safe_mode\s*=\s*False'
    metadata:
      mode: regex
      cwe: [94, 502]
      category: deserialization
      source_rule: AI031

  - id: ns-aiml-115
    message: "keras.models.load_model(..., safe_mode=False) explicitly disables the Lambda-layer/unsafe-deserialization safety check, allowing arbitrary code execution on load (CVE-2024-3660)."
    severity: ERROR
    languages: [python]
    patterns:
      - 'keras\.models\.load_model\([^)]*safe_mode\s*=\s*False'
      - 'tf\.keras\.models\.load_model\([^)]*safe_mode\s*=\s*False'
      - 'keras\.saving\.load_model\([^)]*safe_mode\s*=\s*False'
    pattern-not:
      - '(?m)^\s*#'
      - '(?:def test_|conftest|unittest)'
    metadata:
      mode: regex
      cwe: [94, 502]
      category: deserialization
      source_rule: AI031

  - id: ns-aiml-044
    message: "joblib.Parallel may evaluate untrusted callables"
    severity: ERROR
    languages: [python]
    patterns:
      - 'joblib\.Parallel\('
    pattern-not:
      - '(?m)^\s*#'
      - '(?:def test_|conftest|unittest)'
    metadata:
      mode: regex
      cwe: [94]
      category: ai_ml
      source_rule: AI032

  - id: ns-aiml-045
    message: "operator.attrgetter/itemgetter can be chained as gadgets for code execution: theoretical gadget-chain awareness, not a confirmed vulnerability"
    severity: info
    languages: [python]
    patterns:
      - 'operator\.attrgetter\('
      - 'operator\.itemgetter\('
    pattern-not:
      - '(?m)^\s*#'
      - '(?:def test_|conftest|unittest)'
    metadata:
      mode: regex
      cwe: [94]
      category: ai_ml
      source_rule: AI041

  - id: ns-aiml-046
    message: "exec()/eval()/compile() enables arbitrary code execution. Presence signal; confirm input reaches the call."
    severity: WARNING
    languages: [python]
    patterns:
      - '\bexec\('
      - '\beval\('
      - '\bcompile\('
    pattern-not:
      - '\.eval\('
      - '\.exec\('
      - '\.compile\('
      - '\bexecutor\b'
      - 'eval\([''"](?:True|False|None|0|1|\d+\.?\d*)[''"]\)'
      - '(?m)^\s*#'
      - '(?:def test_|def eval_|conftest|unittest)'
    metadata:
      mode: regex
      cwe: [94, 95]
      category: injection
      source_rule: AI051

  # ==========================================================================
  # Supply Chain (NS-AIML-047 .. NS-AIML-051)
  # ==========================================================================

  - id: ns-aiml-047
    message: "from_pretrained() without revision pin may load tampered model weights. Supply-chain hygiene signal; real RCE risk is trust_remote_code=True (ns-aiml-059)."
    severity: info
    languages: [python]
    patterns:
      - 'from_pretrained\('
    pattern-not:
      - 'revision\s*='
      - 'trust_remote_code'
      - 'local_files_only\s*=\s*True'
      - '(?m)^\s*#'
      - '(?:def test_|conftest|unittest)'
    metadata:
      mode: regex
      cwe: [829, 494]
      category: supply_chain
      source_rule: AI013

  - id: ns-aiml-048
    message: "Dynamic import of untrusted modules enables arbitrary code execution. Presence signal; confirm the module path is user-controlled."
    severity: WARNING
    languages: [python]
    patterns:
      - 'importlib\.import_module\('
      - '__import__\('
      - 'spec_from_file_location\('
      - 'imp\.load_source\('
    pattern-not:
      - 'import_module\([''"](?:os|sys|math|json|collections|itertools|typing|dataclasses|pathlib|logging|datetime|re|string|enum|functools|abc|contextlib|argparse|shutil|tempfile|io|hashlib|base64|uuid|copy|time|socket|struct|textwrap|webbrowser|glob|fnmatch)[''"]'
      - 'pkg_resources'
      - 'importlib_metadata'
      - 'entry_points'
      - 'plugin'
      - 'register'
      - '(?m)^\s*#'
      - '(?:def test_|conftest|unittest)'
    metadata:
      mode: regex
      cwe: [94, 829]
      category: supply_chain
      source_rule: AI016

  - id: ns-aiml-049
    message: "Hydra/OmegaConf resolver with user input enables remote code execution"
    severity: ERROR
    languages: [python]
    patterns:
      - 'OmegaConf\.to_container\([^)]*resolve\s*=\s*True'
      - 'OmegaConf\.create\('
      - 'compose\([^)]*overrides\s*='
    pattern-not:
      - '(?m)^\s*#'
      - '(?:def test_|conftest|unittest)'
    metadata:
      mode: regex
      cwe: [94, 917]
      category: supply_chain
      source_rule: AI034

  - id: ns-aiml-050
    message: "setup.py cmdclass/scripts hooks can execute arbitrary code during install"
    severity: ERROR
    languages: [python]
    patterns:
      - '\bcmdclass\s*=\s*\{'
      - '\bscripts\s*=\s*\['
    pattern-not:
      - '(?m)^\s*#'
      - '(?:def test_|conftest|unittest)'
    metadata:
      mode: regex
      cwe: [829]
      category: supply_chain
      source_rule: AI037

  - id: ns-aiml-051
    message: "Config format routing to pickle/torch.load enables deserialization attacks. Presence signal; confirm the model source is user-controlled."
    severity: WARNING
    languages: [python]
    patterns:
      - "format\\s*==\\s*[\"'](?:pt|pytorch|bin)[\"']"
      - 'torch\.load\('
      - 'pickle\.load\('
    pattern-not:
      - 'weights_only\s*=\s*True'
      - 'safetensors'
      - 'torch\.load\([^)]*map_location\s*='
      - 'torch\.load\([^)]*mmap\s*=\s*True'
      - 'if\s+format\s+in\s+\['
      - '(?m)^\s*#'
      - '(?:def test_|conftest|unittest)'
    sanitizers:
      - 'weights_only\s*=\s*True'
      - 'safetensors\.torch\.load_file'
    metadata:
      mode: regex
      cwe: [502]
      category: supply_chain
      source_rule: AI044

  # ==========================================================================
  # Prompt Injection (NS-AIML-052 .. NS-AIML-056)
  # ==========================================================================

  - id: ns-aiml-052
    message: "RAG pipeline detected: treat retrieved/vector-store content as untrusted (indirect prompt injection surface). Heuristic awareness, not a confirmed vulnerability; real dataflow is covered by TNT-ML-004."
    severity: info
    languages: [python]
    patterns:
      - 'LLMChain\('
      - 'retriever\.get_relevant_documents\('
      - 'similarity_search\('
      - 'VectorStoreRetriever\('
    pattern-not:
      - '(?m)^\s*#'
      - '(?:def test_|conftest|unittest)'
    metadata:
      mode: regex
      cwe: [77]
      category: prompt_injection
      source_rule: AI008

  - id: ns-aiml-053
    message: "Jailbreak prompt pattern detected"
    severity: WARNING
    languages: [python, javascript, typescript, text]
    patterns:
      - 'Do Anything Now'
      - 'DAN\s*6\.0'
      - 'ignore (?:all )?previous instructions'
      - 'Developer Mode'
      - 'stay in character'
    pattern-not:
      - '(?m)^\s*#'
      - '(?m)^\s*//.*'
      - '(?:def test_|conftest|unittest)'
    metadata:
      mode: regex
      cwe: [77]
      category: prompt_injection
      source_rule: AI029

  - id: ns-aiml-054
    message: "Tool-call arguments are model-controlled; review the selected handler's capabilities and authorization"
    severity: INFO
    languages: [python, javascript, typescript]
    patterns:
      - 'action\.tool_input'
      - 'tool\.function\.arguments'
      - 'function_call.*arguments'
    pattern-not:
      - '(?m)^\s*#'
      - '(?m)^\s*//.*'
      - '(?:def test_|conftest|unittest)'
    metadata:
      mode: regex
      cwe: [20]
      category: prompt_injection
      source_rule: AI050

  - id: ns-aiml-055
    message: "Prompt template interpolates a request value without sanitization. Cross-statement flows are covered by the taint rule TNT-ML-009."
    severity: WARNING
    languages: [python]
    patterns:
      - 'PromptTemplate\.from_template\([^)]*\brequest\b'
      - 'ChatPromptTemplate\.from_messages\([^)]*\brequest\b'
    pattern-not:
      - '(?m)^\s*#'
      - '(?:def test_|conftest|unittest)'
    metadata:
      mode: regex
      cwe: [77]
      category: prompt_injection
      source_rule: AI059

  - id: ns-aiml-056
    message: "System prompt may be leaked via debug endpoints or message inspection"
    severity: WARNING
    languages: [python, javascript, typescript]
    patterns:
      - "messages\\[0\\]\\[.content.\\]"
      - "@app\\.route\\(['\"](?:debug|inspect|system|prompt)"
      - "return\\s+(?:json\\w*\\()?\\s*system_prompt\\b"
    pattern-not:
      - '(?m)^\s*#'
      - '(?m)^\s*//.*'
      - '(?:def test_|conftest|unittest)'
    metadata:
      mode: regex
      cwe: [200, 497]
      category: prompt_injection
      source_rule: AI064

  # ==========================================================================
  # Model Integrity (NS-AIML-057 .. NS-AIML-062)
  # ==========================================================================

  - id: ns-aiml-057
    message: "ONNX custom operator registration may execute arbitrary native code. Presence signal; only register_custom_op with untrusted shared libs is a real risk."
    severity: info
    languages: [python]
    patterns:
      - 'register_custom_op\('
      - 'onnxruntime\.InferenceSession\([^)]*custom'
    pattern-not:
      - '(?m)^\s*#'
      - '(?:def test_|conftest|unittest)'
    metadata:
      mode: regex
      cwe: [94]
      category: ai_ml
      source_rule: AI006

  - id: ns-aiml-058
    message: "GGUF model loading may execute embedded code or trigger buffer overflows"
    severity: ERROR
    languages: [python]
    patterns:
      - 'llama_cpp\.Llama\('
      - 'llama\.load_model\('
      - 'llama_cpp_python\.Llama\('
    pattern-not:
      - '(?m)^\s*#'
      - '(?:def test_|conftest|unittest)'
    metadata:
      mode: regex
      cwe: [502]
      category: deserialization
      source_rule: AI007

  - id: ns-aiml-059
    message: "trust_remote_code=True allows arbitrary code execution from model repositories"
    severity: ERROR
    languages: [python]
    patterns:
      - 'trust_remote_code\s*=\s*True'
    pattern-not:
      - '(?m)^\s*#'
      - '(?:def test_|conftest|unittest)'
      - 'load_dataset\('
    metadata:
      mode: regex
      cwe: [829]
      category: supply_chain
      source_rule: AI024

  - id: ns-aiml-113
    message: "datasets.load_dataset(..., trust_remote_code=True) executes the dataset's loading script as arbitrary Python at load time. Unlike model repos, HF datasets no longer requires loading scripts for standard formats (parquet/arrow) -- prefer a dataset revision that ships data files directly over trusting the script, rather than pinning revision= on the script itself (ns-aiml-059 covers the model-repo case)."
    severity: ERROR
    languages: [python]
    patterns:
      - 'load_dataset\([^)]*trust_remote_code\s*=\s*True'
    pattern-not:
      - '(?m)^\s*#'
      - '(?:def test_|conftest|unittest)'
    metadata:
      mode: regex
      cwe: [94, 829]
      category: supply_chain
      source_rule: AI024

  - id: ns-aiml-060
    message: "Model download without integrity verification may load tampered weights. Presence signal, not a confirmed vulnerability."
    severity: info
    languages: [python]
    patterns:
      - 'hf_hub_download\('
      - 'snapshot_download\('
      - 'model\.download\('
    pattern-not:
      - '(?m)^\s*#'
      - '(?:def test_|conftest|unittest)'
    metadata:
      mode: regex
      cwe: [494, 829]
      category: supply_chain
      source_rule: AI028

  - id: ns-aiml-061
    message: "Explicit weights_only=False or allow_pickle=True disables safety guards"
    severity: ERROR
    languages: [python]
    patterns:
      - 'weights_only\s*=\s*False'
      - 'allow_pickle\s*=\s*True'
    pattern-not:
      - '(?m)^\s*#'
      - '(?:def test_|conftest|unittest)'
    metadata:
      mode: regex
      cwe: [502]
      category: deserialization
      source_rule: AI043

  - id: ns-aiml-116
    message: "keras.config.enable_unsafe_deserialization() globally disables Keras's Lambda-layer/unsafe-object safety checks (the CVE-2024-3660 mitigation). Same class of explicit safety-off switch as weights_only=False/allow_pickle=True (ns-aiml-061)."
    severity: ERROR
    languages: [python]
    patterns:
      - 'enable_unsafe_deserialization\('
    pattern-not:
      - '(?m)^\s*#'
      - '(?:def test_|conftest|unittest)'
    metadata:
      mode: regex
      cwe: [502]
      category: deserialization
      source_rule: AI043

  - id: ns-aiml-117
    message: "Lambda(lambda ...) layer embeds a marshalled Python function in the model graph. If this model is saved (model.save/.h5/.keras export) and distributed, safe loaders (safe_mode=True, ns-aiml-114) will refuse it and scanners (MFV-KERAS-001) will flag it -- consider a subclassed Layer instead of Lambda for anything meant to leave this process. Informational nudge; not evidence the artifact is actually distributed."
    severity: info
    languages: [python]
    patterns:
      - 'Lambda\(\s*lambda\b'
    pattern-not:
      - '(?m)^\s*#'
      - '(?:def test_|conftest|unittest)'
    metadata:
      mode: regex
      cwe: [502]
      category: deserialization
      source_rule: AI043

  - id: ns-aiml-062
    message: "Quantization config may mask backdoored weight modifications. Presence signal, not a confirmed vulnerability."
    severity: info
    languages: [python]
    patterns:
      - 'GPTQConfig\('
      - 'BitsAndBytesConfig\('
      - 'load_in_4bit\s*=\s*True'
      - 'load_in_8bit\s*=\s*True'
    pattern-not:
      - '(?m)^\s*#'
      - '(?:def test_|conftest|unittest)'
    metadata:
      mode: regex
      cwe: [345]
      category: ai_ml
      source_rule: AI047

  # ==========================================================================
  # Path Traversal (NS-AIML-063 .. NS-AIML-065)
  # ==========================================================================

  - id: ns-aiml-063
    message: "Archive extraction without path validation enables zip-slip attacks. Presence signal; use filter='data' or members= to prevent traversal."
    severity: WARNING
    languages: [python]
    patterns:
      - '\.extractall\('
      - 'tarfile\.open\('
      - '\.extract\('
    pattern-not:
      - 'filter\s*=\s*["''\w]'
      - 'members\s*='
      - 'tarfile\.open\([^)]*["'']r:'
      - 'tarfile\.open\([^)]*mode\s*=\s*["'']r'
      - 'ZipFile\([^)]*\).*\.extractall\('
      - '(?m)^\s*#'
      - '(?:def test_|conftest|unittest)'
    metadata:
      mode: regex
      cwe: [22]
      category: path_traversal
      source_rule: AI014

  - id: ns-aiml-064
    message: "HDF5 external links can reference arbitrary filesystem paths"
    severity: info
    languages: [python]
    patterns:
      - 'h5py\.File\('
      - 'h5py\.Group\('
    pattern-not:
      - '(?m)^\s*#'
      - '(?:def test_|conftest|unittest)'
    metadata:
      mode: regex
      cwe: [22]
      category: path_traversal
      source_rule: AI022

  - id: ns-aiml-065
    message: "MLflow tracking URI or artifact location may enable path traversal. Presence signal; confirm the path is user-controlled."
    severity: info
    languages: [python]
    patterns:
      - 'mlflow\.set_tracking_uri\('
      - 'mlflow\.create_experiment\('
      - 'artifact_location'
    pattern-not:
      - '(?m)^\s*#'
      - '(?:def test_|conftest|unittest)'
    metadata:
      mode: regex
      cwe: [22]
      category: path_traversal
      source_rule: AI056

  # ==========================================================================
  # MCP / Agent / Secrets (NS-AIML-066 .. NS-AIML-068)
  # ==========================================================================

  - id: ns-aiml-066
    message: "MCP server may be vulnerable to tool-call smuggling via untrusted input"
    severity: ERROR
    languages: [python, javascript, typescript]
    patterns:
      - 'mcp\.run\('
      - 'mcp\.serve\('
      - 'mcp_server\('
    pattern-not:
      - '(?m)^\s*#'
      - '(?m)^\s*//.*'
      - '(?:def test_|conftest|unittest)'
    metadata:
      mode: regex
      cwe: [77]
      category: prompt_injection
