      authentication, and CVE-2024-37032 ("Probllama") is a path-traversal
      RCE reachable through the exposed API. Presence signal; confirm this
      config is production-facing.
    severity: ERROR
    languages: [python, dockerfile, yaml]
    patterns:
      - 'OLLAMA_HOST\s*=\s*["'']?0\.0\.0\.0'
      - '(?m)^\s*ENV\s+OLLAMA_HOST\s*=?\s*["'']?0\.0\.0\.0'
      - '"?0\.0\.0\.0:11434:11434"?'
      - '-\s*["'']?0\.0\.0\.0:11434'
      - '-\s*["'']?11434:11434["'']?\s*$'
    pattern-not:
      - '(?m)^\s*#'
      - '(?:def test_|conftest|unittest)'
    sanitizers:
      - '(?i)nginx'
      - '(?i)traefik'
      - '(?i)oauth2-proxy'
      - '(?i)envoy'
    metadata:
