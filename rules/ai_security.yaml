  # ==========================================================================
  # Model-serving infrastructure exposures (ns-aiml-100 .. ns-aiml-106)
  # Issue #142 -- ShadowRay-style unauthenticated ML-serving infra bound to
  # all interfaces. Sibling rules to ns-aiml-067 (Ray dashboard). Each rule
  # is a presence signal: the pattern alone does not prove the service is
  # internet-facing, only that the config/invocation permits it.
  #
  # FP guard (compose/YAML variants only): if the same compose file also
  # runs a reverse-proxy/auth-proxy service (nginx, traefik, oauth2-proxy),
  # the exposed port is commonly intended to sit behind that proxy rather
  # than be reachable directly. This is expressed via the `sanitizers:`
  # field (not `pattern-not`): NeuroScanRule._sanitizer_in_window checks a
  # +/-10 line window around a match (see _SANITIZER_WINDOW in
  # rowan/core/rules.py) and, because these are bare substrings with no
  # trailing "(", are treated as "call-shape" sanitizers -- present anywhere
  # in the window suppresses the finding regardless of shared identifiers.
  # `pattern-not`, by contrast, only excludes a match on the exact same line
  # it fires on (see NeuroScanRule.check: excluded_lines is keyed by the
  # negative pattern's own match line) -- it cannot see a proxy service
  # declared in a different block of the same compose file, so it is the
  # wrong primitive for this guard. This is still a partial mitigation, not
  # a guarantee: a proxy declared more than 10 lines away in a large compose
  # file will not suppress the finding.
  #
  # Filename-conditioned severity (e.g. downgrading *dev*/*local* compose
  # files by one level) is NOT supported by this repo's rule schema: severity
  # is a single static field per rule (see RuleMetadata.severity /
  # _parse_neuroscan_rule in rowan/core/rules.py) and NeuroScanRule.check
  # has no filename-conditional branch. Deviation noted; not implemented.
  #
  # Engine note on languages: [yaml] -- NeuroScan's own file collector
  # (LANGUAGE_EXTENSIONS in rowan/passes/file_scan.py) does not include
  # a yaml/.yml extension mapping, so compose/k8s YAML files are invisible to
  # the legacy FileScanPass path. They ARE reachable through the default
  # (non-legacy) pipeline, because converted rules run via TaintPass ->
  # opengrep_adapter.py, whose _LANG_EXTENSIONS/_LANG_INCLUDE_GLOBS do map
  # "yaml" to *.yaml/*.yml. The yaml-scoped patterns below are therefore live
  # in the default scan mode but dead in --legacy-neuroscan mode.
  #
  # Engine note on cross-line matching -- every `patterns:`/`pattern-not:`
  # regex below is evaluated per physical line (NeuroScanRule.check calls
  # p.pattern.search(line) in a per-line loop), never across lines. Real
  # invocations that wrap each CLI flag onto its own line/list element (e.g.
  # `subprocess.run(["cmd", "--host", "0.0.0.0"])` split across lines, or a
  # YAML block-style `command:` list) will not match a single-line pattern
  # that expects both the binary name and `--host 0.0.0.0` on one line. The
  # patterns below target the common single-line shell/CMD/compose-string
  # invocation shape (`bentoml serve svc --host 0.0.0.0`, Dockerfile
  # `CMD ["bentoml", "serve", ..., "--host", "0.0.0.0"]` collapsed to one
  # line, etc.) and accept heavily line-wrapped Python list invocations as a
  # known false-negative gap, consistent with how every other regex rule in
  # this corpus (e.g. ns-aiml-076) already operates line-by-line.

  - id: ns-aiml-100
