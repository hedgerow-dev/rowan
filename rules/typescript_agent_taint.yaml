# TypeScript/JavaScript agent-boundary taint rules. Generated by a one-off
# script from explicit handler shapes; edit the YAML directly.
# Sources: MCP tool handlers (McpServer.tool/registerTool and the low-level
# CallToolRequestSchema handler), Vercel AI SDK tool({ execute }), LangChain.js
# tool()/DynamicTool/DynamicStructuredTool, and model output. Validators are
# recognized by name (validate*/sanitize*/safe*/assert*/ensure*/...), so a
# helper with such a name that does not validate hides a finding.
rules:
- id: TNT-TS-AGENT-CMDI-001
  mode: taint
  languages:
  - typescript
  - javascript
  severity: ERROR
  message: An agent tool argument (MCP tool handler, Vercel AI SDK tool, or LangChain.js tool) is chosen
    by the model, and so by anyone who can influence its prompt, context or retrieved documents. It reaches
    a shell command.
  metadata:
    category: command_injection
    cwe:
    - 78
    confidence: HIGH
    source_kind: tool_param
    fix: Call execFile/spawn with an argument array and no shell, and allowlist the program.
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern: $S.tool($NAME, ..., async ({..., $P, ...}) => {...})
      - pattern: $S.tool($NAME, ..., async ({..., $P, ...}) => $BODY)
      - pattern: $S.tool($NAME, ..., async function ({..., $P, ...}) {...})
      - pattern: $S.tool($NAME, ..., ({..., $P, ...}) => {...})
      - pattern: $S.tool($NAME, ..., ({..., $P, ...}) => $BODY)
      - pattern: $S.tool($NAME, ..., function ({..., $P, ...}) {...})
      - pattern: '$S.tool($NAME, ..., async ({..., $P, ...}: $T) => {...})'
      - pattern: '$S.tool($NAME, ..., async ({..., $P, ...}: $T) => $BODY)'
      - pattern: '$S.tool($NAME, ..., async function ({..., $P, ...}: $T) {...})'
      - pattern: '$S.tool($NAME, ..., ({..., $P, ...}: $T) => {...})'
      - pattern: '$S.tool($NAME, ..., ({..., $P, ...}: $T) => $BODY)'
      - pattern: '$S.tool($NAME, ..., function ({..., $P, ...}: $T) {...})'
      - pattern: $S.registerTool($NAME, ..., async ({..., $P, ...}) => {...})
      - pattern: $S.registerTool($NAME, ..., async ({..., $P, ...}) => $BODY)
      - pattern: $S.registerTool($NAME, ..., async function ({..., $P, ...}) {...})
      - pattern: $S.registerTool($NAME, ..., ({..., $P, ...}) => {...})
      - pattern: $S.registerTool($NAME, ..., ({..., $P, ...}) => $BODY)
      - pattern: $S.registerTool($NAME, ..., function ({..., $P, ...}) {...})
      - pattern: '$S.registerTool($NAME, ..., async ({..., $P, ...}: $T) => {...})'
      - pattern: '$S.registerTool($NAME, ..., async ({..., $P, ...}: $T) => $BODY)'
      - pattern: '$S.registerTool($NAME, ..., async function ({..., $P, ...}: $T) {...})'
      - pattern: '$S.registerTool($NAME, ..., ({..., $P, ...}: $T) => {...})'
      - pattern: '$S.registerTool($NAME, ..., ({..., $P, ...}: $T) => $BODY)'
      - pattern: '$S.registerTool($NAME, ..., function ({..., $P, ...}: $T) {...})'
      - pattern: 'tool({..., execute: async ({..., $P, ...}) => {...}, ...})'
      - pattern: 'tool({..., execute: async ({..., $P, ...}) => $BODY, ...})'
      - pattern: 'tool({..., execute: async function ({..., $P, ...}) {...}, ...})'
      - pattern: 'tool({..., execute: ({..., $P, ...}) => {...}, ...})'
      - pattern: 'tool({..., execute: ({..., $P, ...}) => $BODY, ...})'
      - pattern: 'tool({..., execute: function ({..., $P, ...}) {...}, ...})'
      - pattern: 'tool({..., execute: async ({..., $P, ...}: $T) => {...}, ...})'
      - pattern: 'tool({..., execute: async ({..., $P, ...}: $T) => $BODY, ...})'
      - pattern: 'tool({..., execute: async function ({..., $P, ...}: $T) {...}, ...})'
      - pattern: 'tool({..., execute: ({..., $P, ...}: $T) => {...}, ...})'
      - pattern: 'tool({..., execute: ({..., $P, ...}: $T) => $BODY, ...})'
      - pattern: 'tool({..., execute: function ({..., $P, ...}: $T) {...}, ...})'
      - pattern: tool(async ({..., $P, ...}) => {...}, $OPTIONS)
      - pattern: tool(async ({..., $P, ...}) => $BODY, $OPTIONS)
      - pattern: tool(async function ({..., $P, ...}) {...}, $OPTIONS)
      - pattern: tool(({..., $P, ...}) => {...}, $OPTIONS)
      - pattern: tool(({..., $P, ...}) => $BODY, $OPTIONS)
      - pattern: tool(function ({..., $P, ...}) {...}, $OPTIONS)
      - pattern: 'tool(async ({..., $P, ...}: $T) => {...}, $OPTIONS)'
      - pattern: 'tool(async ({..., $P, ...}: $T) => $BODY, $OPTIONS)'
      - pattern: 'tool(async function ({..., $P, ...}: $T) {...}, $OPTIONS)'
      - pattern: 'tool(({..., $P, ...}: $T) => {...}, $OPTIONS)'
      - pattern: 'tool(({..., $P, ...}: $T) => $BODY, $OPTIONS)'
      - pattern: 'tool(function ({..., $P, ...}: $T) {...}, $OPTIONS)'
      - pattern: 'new DynamicStructuredTool({..., func: async ({..., $P, ...}) => {...}, ...})'
      - pattern: 'new DynamicStructuredTool({..., func: async ({..., $P, ...}) => $BODY, ...})'
      - pattern: 'new DynamicStructuredTool({..., func: async function ({..., $P, ...}) {...}, ...})'
      - pattern: 'new DynamicStructuredTool({..., func: ({..., $P, ...}) => {...}, ...})'
      - pattern: 'new DynamicStructuredTool({..., func: ({..., $P, ...}) => $BODY, ...})'
      - pattern: 'new DynamicStructuredTool({..., func: function ({..., $P, ...}) {...}, ...})'
      - pattern: 'new DynamicStructuredTool({..., func: async ({..., $P, ...}: $T) => {...}, ...})'
      - pattern: 'new DynamicStructuredTool({..., func: async ({..., $P, ...}: $T) => $BODY, ...})'
      - pattern: 'new DynamicStructuredTool({..., func: async function ({..., $P, ...}: $T) {...}, ...})'
      - pattern: 'new DynamicStructuredTool({..., func: ({..., $P, ...}: $T) => {...}, ...})'
      - pattern: 'new DynamicStructuredTool({..., func: ({..., $P, ...}: $T) => $BODY, ...})'
      - pattern: 'new DynamicStructuredTool({..., func: function ({..., $P, ...}: $T) {...}, ...})'
      - pattern: 'new DynamicTool({..., func: async ({..., $P, ...}) => {...}, ...})'
      - pattern: 'new DynamicTool({..., func: async ({..., $P, ...}) => $BODY, ...})'
      - pattern: 'new DynamicTool({..., func: async function ({..., $P, ...}) {...}, ...})'
      - pattern: 'new DynamicTool({..., func: ({..., $P, ...}) => {...}, ...})'
      - pattern: 'new DynamicTool({..., func: ({..., $P, ...}) => $BODY, ...})'
      - pattern: 'new DynamicTool({..., func: function ({..., $P, ...}) {...}, ...})'
      - pattern: 'new DynamicTool({..., func: async ({..., $P, ...}: $T) => {...}, ...})'
      - pattern: 'new DynamicTool({..., func: async ({..., $P, ...}: $T) => $BODY, ...})'
      - pattern: 'new DynamicTool({..., func: async function ({..., $P, ...}: $T) {...}, ...})'
      - pattern: 'new DynamicTool({..., func: ({..., $P, ...}: $T) => {...}, ...})'
      - pattern: 'new DynamicTool({..., func: ({..., $P, ...}: $T) => $BODY, ...})'
      - pattern: 'new DynamicTool({..., func: function ({..., $P, ...}: $T) {...}, ...})'
    - focus-metavariable: $P
  - patterns:
    - pattern-either:
      - pattern: $S.tool($NAME, ..., async ($P) => {...})
      - pattern: $S.tool($NAME, ..., async ($P) => $BODY)
      - pattern: $S.tool($NAME, ..., async function ($P) {...})
      - pattern: $S.tool($NAME, ..., ($P) => {...})
      - pattern: $S.tool($NAME, ..., ($P) => $BODY)
      - pattern: $S.tool($NAME, ..., function ($P) {...})
      - pattern: $S.registerTool($NAME, ..., async ($P) => {...})
      - pattern: $S.registerTool($NAME, ..., async ($P) => $BODY)
      - pattern: $S.registerTool($NAME, ..., async function ($P) {...})
      - pattern: $S.registerTool($NAME, ..., ($P) => {...})
      - pattern: $S.registerTool($NAME, ..., ($P) => $BODY)
      - pattern: $S.registerTool($NAME, ..., function ($P) {...})
      - pattern: 'tool({..., execute: async ($P) => {...}, ...})'
      - pattern: 'tool({..., execute: async ($P) => $BODY, ...})'
      - pattern: 'tool({..., execute: async function ($P) {...}, ...})'
      - pattern: 'tool({..., execute: ($P) => {...}, ...})'
      - pattern: 'tool({..., execute: ($P) => $BODY, ...})'
      - pattern: 'tool({..., execute: function ($P) {...}, ...})'
      - pattern: tool(async ($P) => {...}, $OPTIONS)
      - pattern: tool(async ($P) => $BODY, $OPTIONS)
      - pattern: tool(async function ($P) {...}, $OPTIONS)
      - pattern: tool(($P) => {...}, $OPTIONS)
      - pattern: tool(($P) => $BODY, $OPTIONS)
      - pattern: tool(function ($P) {...}, $OPTIONS)
      - pattern: 'new DynamicStructuredTool({..., func: async ($P) => {...}, ...})'
      - pattern: 'new DynamicStructuredTool({..., func: async ($P) => $BODY, ...})'
      - pattern: 'new DynamicStructuredTool({..., func: async function ($P) {...}, ...})'
      - pattern: 'new DynamicStructuredTool({..., func: ($P) => {...}, ...})'
      - pattern: 'new DynamicStructuredTool({..., func: ($P) => $BODY, ...})'
      - pattern: 'new DynamicStructuredTool({..., func: function ($P) {...}, ...})'
      - pattern: 'new DynamicTool({..., func: async ($P) => {...}, ...})'
      - pattern: 'new DynamicTool({..., func: async ($P) => $BODY, ...})'
      - pattern: 'new DynamicTool({..., func: async function ($P) {...}, ...})'
      - pattern: 'new DynamicTool({..., func: ($P) => {...}, ...})'
      - pattern: 'new DynamicTool({..., func: ($P) => $BODY, ...})'
      - pattern: 'new DynamicTool({..., func: function ($P) {...}, ...})'
      - pattern: $S.setRequestHandler(CallToolRequestSchema, async ($P) => {...})
      - pattern: $S.setRequestHandler(CallToolRequestSchema, async ($P) => $BODY)
      - pattern: $S.setRequestHandler(CallToolRequestSchema, async function ($P) {...})
      - pattern: $S.setRequestHandler(CallToolRequestSchema, ($P) => {...})
      - pattern: $S.setRequestHandler(CallToolRequestSchema, ($P) => $BODY)
      - pattern: $S.setRequestHandler(CallToolRequestSchema, function ($P) {...})
    - metavariable-regex:
        metavariable: $P
        regex: ^[A-Za-z_$][\w$]*$
    - focus-metavariable: $P
  pattern-sinks:
  - patterns:
    - pattern: exec($X, ...)
    - focus-metavariable: $X
  - patterns:
    - pattern: execSync($X, ...)
    - focus-metavariable: $X
  - patterns:
    - pattern: $CP.exec($X, ...)
    # RegExp.prototype.exec shares the name: skip a regex literal, a
    # `new RegExp(...)`, and variables named like a regex.
    - metavariable-regex:
        metavariable: $CP
        regex: ^(?!/)(?!(?:new\s+)?RegExp\b)(?!(?:.*\.)?(?i:re|rx|regexp?|pattern|matcher)$)(?!.*(?:Re|RE|Rx|Regexp?|RegExp|REGEXP?|Pattern|PATTERN|_re|_rx|_regexp?|_pattern)$)
    - focus-metavariable: $X
  - patterns:
    - pattern: $CP.execSync($X, ...)
    - focus-metavariable: $X
  - patterns:
    - pattern-either:
      - pattern: 'spawn($X, ..., {..., shell: true, ...})'
      - pattern: 'spawnSync($X, ..., {..., shell: true, ...})'
    - focus-metavariable: $X
  - patterns:
    - pattern-either:
      - pattern-inside: 'const $E = promisify(exec);

          ...'
      - pattern-inside: 'const $E = promisify(child_process.exec);

          ...'
      - pattern-inside: 'const $E = promisify(cp.exec);

          ...'
      - pattern-inside: 'const $E = util.promisify(exec);

          ...'
      - pattern-inside: 'const $E = util.promisify(child_process.exec);

          ...'
      - pattern-inside: 'const $E = util.promisify(cp.exec);

          ...'
    - pattern: $E($X, ...)
    - focus-metavariable: $X
  pattern-sanitizers:
  - patterns:
    - pattern-either:
      - pattern: $F(...)
      - pattern: $O.$F(...)
    - metavariable-regex:
        metavariable: $F
        regex: ^(?i:validate|sanitize|safe(?!parse)|assert|ensure|normalize|allowed|confine)|^.*[a-z](?:Safe|Valid|Sanitiz|Confine)
    - pattern-not-inside: $F(...);
    - pattern-not-inside: $O.$F(...);
  - by-side-effect: true
    patterns:
    - pattern-either:
      - pattern: $F($X, ...)
      - pattern: $O.$F($X, ...)
    - metavariable-regex:
        metavariable: $F
        regex: ^(?i:validate|sanitize|safe(?!parse)|assert|ensure|normalize|allowed|confine)|^.*[a-z](?:Safe|Valid|Sanitiz|Confine)
    - focus-metavariable: $X
