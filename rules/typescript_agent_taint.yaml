- id: TNT-TS-LLMOUT-CMDI-001
  mode: taint
  languages:
  - typescript
  - javascript
  severity: ERROR
  message: Model output reaches a shell command. Anyone who can influence the prompt or its context can
    run commands on this host.
  metadata:
    category: command_injection
    cwe:
    - 78
    confidence: HIGH
    source_kind: llm_output
    fix: Map model output to an allowlisted command and pass arguments as an array to execFile, without
      a shell.
  pattern-sources:
  - pattern: generateText(...)
  - pattern: generateObject(...)
  - pattern: $C.chat.completions.create(...)
  - pattern: $C.responses.create(...)
  - pattern: $C.messages.create(...)
