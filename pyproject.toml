[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rowan-sast"
version = "0.3.5"
description = "Open-source SAST scanner using Opengrep's taint analysis engine"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Hedgerow.dev", email = "hello@hedgerow.dev"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
keywords = ["security", "sast", "static-analysis", "taint-analysis", "opengrep"]
dependencies = [
    "click>=8.0,<9.0",
    "defusedxml>=0.7,<1.0",
    "hayward>=1.2.5,<2.0",
    "rich>=13.0,<14.0",
    "pyyaml>=6.0,<7.0",
    "pydantic>=2.0,<3.0",
    "httpx>=0.27,<1.0",
    "jsonschema>=4.23,<5.0",
    "filelock>=3.16,<4.0",
    "tomli>=2.0,<3.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
    "pytest-xdist>=3.6,<4.0",
    "ruff>=0.4,<1.0",
]
js-crossfile = [
    "tree-sitter>=0.21,<1.0",
    "tree-sitter-javascript>=0.21,<1.0",
    "tree-sitter-typescript>=0.21,<1.0",
    "tree-sitter-go>=0.21,<1.0",
]
mcp = [
    "mcp>=1.9,<2.0",
]

[project.scripts]
rowan = "rowan.cli:main"
rowan-mcp = "rowan.mcp_server:main"

[tool.setuptools.packages.find]
include = ["rowan*", "rules*"]

[tool.setuptools.package-data]
rules = ["*.yaml", "converted/*.yaml", "converted/*.json"]
rowan = ["config/*.yaml"]

[tool.setuptools.exclude-package-data]
rules = ["_wip/*"]

[tool.ruff]
target-version = "py310"
line-length = 100
# Intentionally-vulnerable fixtures used as scanner ground truth: do not lint/fix.
extend-exclude = ["benchmark/ground_truth"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "S", "RUF"]
ignore = [
    "E501",
    "S101",
    "B015",
    "SIM102",
    "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v"
# An xfail that starts passing must be noticed and removed (RT-15).
xfail_strict = true
markers = [
    "corpus: needs an external corpus (scan-targets/, clean_models, ROWAN_VULN_APP_PATH); skips without it unless --require-corpus",
]
