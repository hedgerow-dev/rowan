# Per-rule false positive suppression configuration.
# max_severity: cap findings at this severity (unless taint-confirmed)
# enabled: false to disable a rule entirely  
# min_confidence: suppress findings below this confidence
#
# The min_confidence gates below target the high-volume, very-low-confidence
# "surface signal" rules identified in scan-targets/batch6/DEEP_DIVE.md
# (~14k findings / ~1/3 of batch6 output, all at conf <= 0.35). The enrichment
# pass already floors the non-actionable instances of these rules to 0.1-0.3
# (no AI/web context, config-URL source, no trust_remote_code, etc.) while
# leaving genuine detections at ~0.6-0.7 (AI-agent context, user-input-adjacent
# request, taint-confirmed). A 0.5 gate therefore drops the info/surface noise
# and keeps the actionable findings. Confirmed dataflow SSRF is still reported
# independently by the taint engine (TNT-SSRF-*), unaffected by these gates.
rules:
  # from_pretrained() supply-chain hygiene: 5,310 findings (13% of all output),
  # avg conf ~0.10. Noise floored to 0.1; trust_remote_code-adjacent kept ~0.7.
  ns-aiml-047:
    min_confidence: 0.5
  # Dynamic import: 1,942 findings, avg conf ~0.16. Hardcoded/no-web-input
  # imports floored to 0.15; user-controlled module path kept ~0.7.
  ns-aiml-048:
    min_confidence: 0.5
  # LLM agent shell/subprocess (agent_safety): 1,002 findings, avg conf ~0.35.
  # Non-AI files floored to 0.3; genuine AI-agent subprocess kept ~0.6-0.7.
  ns-aiml-076:
    min_confidence: 0.5
  # Agent tool with system access (ai_ml): 959 findings, avg conf ~0.35.
  # Near-duplicate of ns-aiml-076; same gating rationale.
  NS-AIML-010:
    min_confidence: 0.5
  # Outbound HTTP request (Python, surface signal): 2,321 findings, avg ~0.20.
  # Config-URL/non-web floored to 0.15/0.3; user-input-adjacent kept ~0.7.
  NS-SSRF-001:
    min_confidence: 0.5
  # Outbound HTTP request (Python, surface signal): 1,823 findings, avg ~0.20.
  NS-SSRF-102:
    min_confidence: 0.5
  # Outbound HTTP request (Node.js, surface signal): 982 findings, avg ~0.25.
  NS-SSRF-103:
    min_confidence: 0.5

  # trust_remote_code=True duplicate cluster (issue #90 / DEF-10).
  # NS-AIML-001 is the bare, canonical trust_remote_code=True signal.
  # ns-aiml-059 (near-duplicate of NS-AIML-001) fires on the exact same
  # line as NS-AIML-001 with zero added recall. ns-aiml-038's bare
  # trust_remote_code pattern is likewise a duplicate of NS-AIML-001; its
  # vLLM-specific patterns can't express an AND-relationship with
  # trust_remote_code in this OR-based regex engine, so the rule's stated
  # purpose ("vLLM WITH trust_remote_code") is already fully covered by
  # NS-AIML-001 alone. Confirmed via a 5-repo corpus scan (langchain,
  # letta, autogen, crewai, vllm): this cluster was 920 combined findings,
  # 32% of ALL findings, all co-firing with NS-AIML-001 on the same line.
  #
  # The disabled rules in this file are not dead: they still run before
  # this filter and act as cross-file sink markers
  # (cross_file._is_sink_rule), so CF-SINK findings can cite or depend on
  # them. Delete one only after showing cross-file output does not change.
  ns-aiml-038:
    enabled: false
  ns-aiml-059:
    enabled: false

  # NS-SQLI-002 duplicate cluster (DEF-15). NS-SQLI-001's patterns already
  # cover every pattern NS-SQLI-002 has: NS-SQLI-002's
  # `cursor\.execute\(\s*f["']`/`\.execute\(\s*f["']` are each a strict
  # subset of NS-SQLI-001's broader `\.execute\s*\(\s*f['"]`, and
  # NS-SQLI-002's `\.raw\(\s*f["']` is a strict subset of NS-SQLI-001's
  # bare `\.raw\s*\(` (which matches with or without an f-string). Unlike
  # DEF-14's NS-SSTI-102, NS-SQLI-002 has no pattern that isn't already
  # covered. Confirmed via a corpus scan: 100% of NS-SQLI-002's 81
  # findings were on the exact same (file, line) as an NS-SQLI-001
  # finding; NS-SQLI-001 alone still reports 87 (6 more, from patterns
  # NS-SQLI-002 never had -- %-format and string concatenation).
  NS-SQLI-002:
    enabled: false

  # ns-aiml-063 duplicate of NS-PATH-005 (DEF-16). Identical archive-
  # extraction patterns; NS-PATH-005 has been updated in-place with
  # ns-aiml-063's better exclusions (filter=, members=, read-only
  # tarfile.open modes, ZipFile-extractall-already-covered) and its own
  # over-broad bare `\.extract\(` pattern removed. Disabling ns-aiml-063
  # (rather than NS-PATH-005) specifically avoids subjecting a general
  # filesystem-security vulnerability class to the ns-aiml-* prefix's
  # AI-context suppression gate (_suppress_ai_on_non_ai), which has no
  # logical bearing on zip-slip risk in a non-AI file.
  ns-aiml-063:
    enabled: false

  # ns-aiml-034 duplicate of NS-DESER-001 (DEF-17). Both detect
  # pickle.loads()-style deserialization RCE; NS-DESER-001 has absorbed
  # ns-aiml-034's cPickle/_pickle pattern variants. Disabled here for the
  # same AI-context-gate reason as ns-aiml-063 above -- pickle
  # deserialization RCE isn't an AI-specific risk class.
  ns-aiml-034:
    enabled: false

  # TNT-SQLI-001 (web_taint.yaml) duplicate of TNT-SQLI-002
  # (python_taint_extended.yaml) (DEF-19). Identical pattern-sources;
  # TNT-SQLI-001's 4 sinks (cursor.execute/$DB.execute/$CONN.execute/
  # $DB.raw) are each a strict subset of TNT-SQLI-002's 9 (adds
  # cursor.executemany, $DB.query, $SESSION.execute, $DB.extra,
  # $DB.RawSQL), and TNT-SQLI-002 also has additional sanitizers
  # (text(...)/int(...)/float(...) type-coercion) TNT-SQLI-001 lacks.
  # Confirmed via a corpus scan: 14/15 of TNT-SQLI-001's findings
  # coincided with a TNT-SQLI-002 finding on the same line.
  TNT-SQLI-001:
    enabled: false

  # RB-PATH-001 (Ruby "user-controlled file path", DEF-24) -- a genuinely
  # correct sink (File.open/read/write/delete, Dir.chdir/glob are the real
  # Ruby file-path APIs, no word-collision bug like DEF-21/22/23), but a
  # bare surface signal with no differentiation between a hardcoded/
  # internal path and a real user-controlled one -- same class as
  # NS-SSRF-001/102/103 above. Confirmed on a real corpus scan (discourse):
  # 422 findings, 204 already floored to 0.4 (test-path), the rest split
  # 0.6/0.7 with no further signal narrowing them to genuine external
  # input. Gated the same way.
  RB-PATH-001:
    min_confidence: 0.5

  # NS-DESER-006 duplicate of ns-aiml-030 (DEF-39). Both detect
  # torch.load() without weights_only=True; identical patterns, pattern-not,
  # and sanitizers. ns-aiml-030 has richer metadata (mode: regex,
  # source_rule: AI001). Disabling NS-DESER-006 retains the AI-context-sourced
  # version.
  NS-DESER-006:
    enabled: false

  # NS-DESER-007 duplicate of ns-aiml-069 (DEF-39). Both detect
  # yaml.load()/yaml.unsafe_load()/yaml.full_load() without SafeLoader;
  # identical pattern set. ns-aiml-069 has richer metadata (source_rule).
  # Disabling NS-DESER-007 retains the AI-context-sourced version.
  NS-DESER-007:
    enabled: false

  # NS-DESER-010 (Keras/TensorFlow model loading, generic "with custom_objects"
  # message, no CVE reference) already had its load_model patterns removed by
  # issue #137's own landed fix (rules/security_surface.yaml's own comment:
  # "load_model( was removed from this rule's patterns -- ai_security.yaml's
  # ns-aiml-114/ns-aiml-115 now own load_model"), which correctly resolved the
  # load_model-specific double-firing. What's left is a single remaining
  # pattern, keras.models.model_from_json(, which is a strict subset of the
  # pre-existing ns-aiml-043 (also catches model_from_config() and the
  # tf.keras. variant NS-DESER-010 never had). Unlike the pickle/zip-slip
  # rules disabled elsewhere in this file, Keras model loading has no legitimate
  # non-AI use, so gating the survivor on ns-aiml-*'s AI-import-context check
  # (see EnrichmentPass._suppress_ai_on_non_ai) costs no recall here. Disabled
  # rather than edited so any baseline/ignore-file referencing NS-DESER-010
  # still resolves; reversible by deleting this entry.
  NS-DESER-010:
    enabled: false
